      xCursor += 28 + larguraAproximada(item.rotulo, LEGENDA_FONTE) + 30;
    });
    pecasLegenda.push(h("line", { key: "llp", x1: xCursor + 8, y1: 7, x2: xCursor + 26, y2: 7, stroke: COR.brass, strokeWidth: 2 }));
    pecasLegenda.push(h("circle", { key: "lcp", cx: xCursor + 17, cy: 7, r: 4, fill: COR.surface, stroke: COR.brass, strokeWidth: 2 }));
    pecasLegenda.push(h("text", { key: "ltp", x: xCursor + 36, y: 12, style: { fontSize: LEGENDA_FONTE, fill: COR.dim } }, "% Margem EBITDA (s/ receita líquida)"));
    var larguraLegenda = xCursor + 36 + larguraAproximada("% Margem EBITDA (s/ receita líquida)", LEGENDA_FONTE);
    var xLegenda = (SLIDE.largura - larguraLegenda) / 2;
    var yLegenda = baseY + 72;

    var periodo = meses.length
      ? rotuloMes(meses[0]) + " a " + rotuloMes(meses[meses.length - 1])
      : "sem período";

    return h("div", moldura,
      h("svg", {
        viewBox: "0 0 " + SLIDE.largura + " " + SLIDE.altura,
        width: "100%",
        preserveAspectRatio: "xMidYMid meet",
        style: { display: "block", background: COR.surface }
      },
        h("text", {
          x: RECUO_TITULO, y: 68,
          style: { fontSize: 40, fill: COR.text, fontWeight: 600, letterSpacing: "0.5px" }
        }, "EBITDA"),
        h("text", {
          x: RECUO_TITULO, y: 98,
          style: { fontSize: 15, fill: COR.faint }
        }, periodo + " · regime de " + (regime === "caixa" ? "caixa" : "competência") + " · R$"),

        h("image", {
          href: LOGO_QUORUM,
          x: MARGEM_RODAPE,
          y: SLIDE.altura - MARGEM_RODAPE - TAMANHO_LOGO,
          width: TAMANHO_LOGO,
          height: TAMANHO_LOGO
        }),

        h("text", {
          x: SLIDE.largura - MARGEM_RODAPE,
          y: SLIDE.altura - MARGEM_RODAPE - TAMANHO_LOGO / 2 + 6,
          textAnchor: "end",
          style: { fontSize: 17, fill: COR.faint, fontVariantNumeric: "tabular-nums" }
        }, String(props.numero || 1)),

        grade,
        barras,
        elementosLinha,
        h("g", { transform: "translate(" + xLegenda + "," + yLegenda + ")" }, pecasLegenda)
      )
    );
  }

  /* Quebra um rotulo em quantas linhas forem precisas para nenhuma passar  */
  /* de maxCaracteres — greedy, uma palavra de cada vez. Com poucas         */
  /* colunas (largura sobrando) da pra usar um limite frouxo e o rotulo     */
  /* sai em duas linhas; com muitas colunas apertadas (o waterfall da DRE,  */
  /* por exemplo) o limite aperta e o rotulo quebra em tres ou quatro       */
  /* linhas em vez de estourar a largura da coluna vizinha.                 */
  function quebrarRotulo(texto, maxCaracteres) {
    var limite = maxCaracteres || 14;
    var palavras = String(texto).split(" ");
    var linhas = [], atual = "";
    palavras.forEach(function (p) {
      var candidato = atual ? atual + " " + p : p;
      if (candidato.length > limite && atual) { linhas.push(atual); atual = p; }
      else atual = candidato;
    });
    if (atual) linhas.push(atual);
    return linhas;
  }

  /* Cascata da DRE acumulada no periodo, da Receita Bruta ao Lucro         */
  /* Liquido: um unico grafico por chamada (nao um por mes, como os outros  */
  /* cinco), porque so faz sentido como acumulado do periodo selecionado.   */
  /* Barra cheia (do zero) nos totais/checkpoints do DRE — Receita Bruta,   */
  /* Receita Liquida, Lucro Bruto, EBITDA, Lucro Liquido; barra flutuante   */
  /* (do acumulado anterior ao novo) em cada secao que soma ou subtrai no   */
  /* meio do caminho, na mesma granularidade das secoes do DRE.             */
  function GraficoWaterfallDRE(props) {
    var dados = props.dados;
    var meses = props.meses;
    var regime = props.regime;
    var ateFluxoCaixa = !!props.ateFluxoCaixa;

    /* Soma cada secao do DRE (ou do fluxo de caixa) no periodo inteiro —   */
    /* o mesmo padrao ja usado nos cartoes do topo da tela (ex.:            */
    /* ebitdaPeriodo). */
    function somaSecao(chave) {
      return meses.reduce(function (soma, mes) { return soma + (dados.S[chave][mes] || 0); }, 0);
    }
    var recBruta = somaSecao("receita");
    var impostos = somaSecao("impostos");
    var custo = somaSecao("custo");
    var despesas = somaSecao("despesas");
    var finRec = somaSecao("finRec");
    var finDesp = somaSecao("finDesp");
    var outrasRec = somaSecao("outrasRec");
    var outrasDesp = somaSecao("outrasDesp");
    var impLucro = somaSecao("impLucro");
    var recLiquida = recBruta + impostos;
    var lucroBrutoTotal = recLiquida + custo;
    var ebitdaTotal = lucroBrutoTotal + despesas;
    var lucroLiquidoTotal = ebitdaTotal + finRec + finDesp + outrasRec + outrasDesp + impLucro;

    /* A ordem aqui e a mesma cascata da tela DRE: receita -> impostos ->   */
    /* receita liquida -> custo -> lucro bruto -> despesas -> ebitda ->     */
    /* financeiro -> nao operacional -> impostos sobre o lucro -> liquido.  */
    var etapasBrutas = [
      { tipo: "total", rotulo: "Receita Bruta", valor: recBruta },
      { tipo: "delta", rotulo: "Impostos e Deduções", valor: impostos },
      { tipo: "total", rotulo: "Receita Líquida", valor: recLiquida },
      { tipo: "delta", rotulo: "Custo dos Serviços Prestados", valor: custo },
      { tipo: "total", rotulo: "Lucro Bruto", valor: lucroBrutoTotal },
      { tipo: "delta", rotulo: "Despesas Fixas", valor: despesas },
      { tipo: "total", rotulo: "EBITDA", valor: ebitdaTotal },
      { tipo: "delta", rotulo: "Receitas Financeiras", valor: finRec },
      { tipo: "delta", rotulo: "Despesas Financeiras", valor: finDesp },
      { tipo: "delta", rotulo: "Outras Receitas Não Operacionais", valor: outrasRec },
      { tipo: "delta", rotulo: "Resultado Não Operacional", valor: outrasDesp },
      { tipo: "delta", rotulo: "Impostos sobre o Lucro", valor: impLucro },
      { tipo: "total", rotulo: "Lucro Líquido", valor: lucroLiquidoTotal, final: !ateFluxoCaixa }
    ];

    /* Continua a mesma cascata para dentro do Fluxo de Caixa — as secoes    */
    /* que so existem la (entradas/saidas de passivo, ativo, investimentos,  */
    /* transferencias, nao classificado), ate o Fluxo de Caixa Livre do      */
    /* periodo. Este e o "(=) Fluxo de Caixa Livre do mes" da aba Fluxo de   */
    /* Caixa (dados.fcl) — um resultado do periodo, somavel com o resto da   */
    /* cascata. Nao e o cartao "Caixa Livre" do topo da tela: aquele e       */
    /* saldo acumulado de todas as contas ja menos a caucao, uma posicao no  */
    /* fim do periodo, nao um fluxo — nao daria pra somar linha a linha.     */
    if (ateFluxoCaixa) {
      var entradas = somaSecao("entradas");
      var saidas = somaSecao("saidas");
      var ativo = somaSecao("ativo");
      var capex = somaSecao("capex");
      var transf = somaSecao("transf");
      var naoClassificado = somaSecao("naoClassificado");
      var fclTotal = lucroLiquidoTotal + entradas + saidas + ativo + capex + transf + naoClassificado;
      etapasBrutas = etapasBrutas.concat([
        { tipo: "delta", rotulo: "Entradas Não Operacionais", valor: entradas },
        { tipo: "delta", rotulo: "Saídas Não Operacionais", valor: saidas },
        { tipo: "delta", rotulo: "Movimentação do Ativo", valor: ativo },
        { tipo: "delta", rotulo: "Investimentos", valor: capex },
        { tipo: "delta", rotulo: "Transferências entre Contas", valor: transf },
        { tipo: "delta", rotulo: "Não Classificado", valor: naoClassificado },
        { tipo: "total", rotulo: "Fluxo de Caixa Livre", valor: fclTotal, final: true }
      ]);
    }

    etapasBrutas = etapasBrutas.filter(function (e) {
      /* Coluna flutuante sem valor nao aparece — nao ha o que "usar" ali,   */
      /* so ocuparia espaco. Os totais (checkpoints) sempre ficam, mesmo     */
      /* que algum caia em zero, porque marcam um ponto fixo da cascata.     */
      return e.tipo === "total" || Math.abs(e.valor) > 0.005;
    });

    /* Posiciona cada etapa: total sempre do zero ao seu valor; delta do    */
    /* acumulado anterior ao novo acumulado. O acumulado so avanca de       */
    /* verdade nas deltas — nos totais ele e reafirmado, nao somado de novo,*/
    /* porque o total ja E o acumulado ate ali.                             */
    var acumulado = 0;
    var etapas = etapasBrutas.map(function (e) {
      var inicio, fim;
      if (e.tipo === "total") {
        inicio = 0; fim = e.valor; acumulado = e.valor;
      } else {
        inicio = acumulado; fim = acumulado + e.valor; acumulado = fim;
      }
      return Object.assign({}, e, { inicio: inicio, fim: fim });
    });

    var temAlgumValor = etapas.some(function (e) { return Math.abs(e.valor) > 0.005; });

    var moldura = {
      className: "rounded overflow-hidden mx-auto",
      style: {
        background: COR.surface,
        border: "1px solid " + COR.line,
        maxWidth: 1080,
        width: "100%"
      }
    };

    if (!meses.length || !temAlgumValor) {
      return h("div", moldura,
        h("div", {
          className: "flex items-center justify-center",
          style: { aspectRatio: "16 / 9", fontSize: 12, color: COR.faint }
        }, "Sem movimento no período para montar o gráfico.")
      );
    }

    /* Area util do desenho, um pouco mais baixa que as outras: o rotulo   */
    /* de cada etapa quebra em duas linhas, embaixo do eixo. */
    var margem = { topo: 148, direita: 92, baixo: 168, esquerda: 132 };
    var RECUO_TITULO = 56;
    var larguraPlot = SLIDE.largura - margem.esquerda - margem.direita;
    var alturaPlot = SLIDE.altura - margem.topo - margem.baixo;
    var baseY = margem.topo + alturaPlot;

    var maiorValor = etapas.reduce(function (maior, e) { return Math.max(maior, e.inicio, e.fim); }, 0);
    var menorValor = etapas.reduce(function (menor, e) { return Math.min(menor, e.inicio, e.fim); }, 0);
    var RESERVA_ROTULO = 34;    /* espaco acima da maior barra para o valor */
    var alturaUtil = alturaPlot - RESERVA_ROTULO;

    var escala = escalaBonita(maiorValor, 4);
    var amplitudeTotal = escala.topo + Math.abs(Math.min(0, menorValor));
    var pxPorUnidade = amplitudeTotal > 0 ? alturaUtil / amplitudeTotal : 0;
    var eixoZeroY = baseY - Math.abs(Math.min(0, menorValor)) * pxPorUnidade;
    var yDoValor = function (v) { return eixoZeroY - v * pxPorUnidade; };

    var faixa = larguraPlot / etapas.length;
    /* Coluna e fonte encolhem com o numero de etapas — o waterfall que      */
    /* junta DRE e Fluxo de Caixa passa de 20 colunas, contra 10-13 do que   */
    /* so vai ate o Lucro Liquido, e precisa caber tudo no mesmo slide.      */
    var larguraColuna = Math.min(84, faixa * 0.62);
    var FONTE_ROTULO = Math.max(9, Math.min(13, faixa / 6.2));
    var FONTE_VALOR = Math.max(11, Math.min(15, faixa / 7));
    /* Cada linha do rotulo precisa caber dentro da propria faixa, senao    */
    /* invade o rotulo da coluna vizinha — com muitas etapas a faixa e       */
    /* bem estreita.                                                        */
    var MAX_CARACTERES_ROTULO = Math.max(6, Math.floor((faixa * 0.94) / (FONTE_ROTULO * 0.55)));

    /* Grade horizontal do eixo de R$. */
    var grade = [];
    for (var v = 0; v <= escala.topo + 0.0001; v += escala.passo) {
      var yGrade = yDoValor(v);
      grade.push(h("line", {
        key: "g" + v,
        x1: margem.esquerda, y1: yGrade, x2: margem.esquerda + larguraPlot, y2: yGrade,
        stroke: v === 0 ? COR.line : COR.lineSoft,
        strokeWidth: v === 0 ? 1.5 : 1
      }));
      grade.push(h("text", {
        key: "r" + v,
        x: margem.esquerda - 16, y: yGrade + 5,
        textAnchor: "end",
        style: { fontSize: 15, fill: COR.faint, fontVariantNumeric: "tabular-nums" }
      }, v === 0 ? "0" : formatarNumero(v, 0)));
    }

    /* Barras, rotulos de valor, rotulos de categoria (em ate duas linhas)  */
    /* e as linhas pontilhadas que ligam o fim de uma barra ao inicio da    */
    /* proxima — a mesma leitura de "escada" de qualquer waterfall.         */
    var barras = [];
    var conectores = [];
    var centros = [];
    etapas.forEach(function (e, indice) {
      var centro = margem.esquerda + faixa * indice + faixa / 2;
      centros.push(centro);
      var yTopo = yDoValor(Math.max(e.inicio, e.fim));
      var yBase = yDoValor(Math.min(e.inicio, e.fim));
      var altura = Math.max(0, yBase - yTopo);
      /* Valor real de verdade (ja passou pelo filtro), mas pequeno demais  */
      /* pra virar barra visivel nessa escala — em vez de sumir, cresce ate */
      /* uma altura minima, sem sair do lugar (mesmo centro na vertical),   */
      /* pra pelo menos aparecer como uma linha fina no lugar certo.        */
      var ALTURA_MINIMA_VISIVEL = 3;
      if (Math.abs(e.valor) > 0.005 && altura < ALTURA_MINIMA_VISIVEL) {
        var centroVertical = (yTopo + yBase) / 2;
        yTopo = centroVertical - ALTURA_MINIMA_VISIVEL / 2;
        yBase = centroVertical + ALTURA_MINIMA_VISIVEL / 2;
        altura = ALTURA_MINIMA_VISIVEL;
      }
      var negativo = e.fim < e.inicio;
      var cor;
      if (e.tipo === "total") {
        cor = e.final ? (e.valor < 0 ? COR.coral : COR.mint) : AZUIS[0];
      } else {
        cor = negativo ? COR.coral : COR.mint;
      }
      if (altura > 0.4) {
        barras.push(h("rect", {
          key: "b" + indice,
          x: centro - larguraColuna / 2, y: yTopo, width: larguraColuna, height: altura,
          fill: cor
        }));
      }
      if (Math.abs(e.valor) > 0.005) {
        var acima = e.fim >= e.inicio;
        barras.push(h("text", {
          key: "t" + indice,
          x: centro, y: acima ? (yTopo - 12) : (yBase + 20),
          textAnchor: "middle",
          style: { fontSize: FONTE_VALOR, fontWeight: 600, fill: cor, fontVariantNumeric: "tabular-nums" }
        }, (e.valor < 0 ? "(" + formatarNumero(Math.abs(e.valor), 0) + ")" : formatarNumero(e.valor, 0))));
      }
      /* Rotulo da categoria, quebrado em quantas linhas couberem na faixa. */
      quebrarRotulo(e.rotulo, MAX_CARACTERES_ROTULO).forEach(function (linha, i) {
        barras.push(h("text", {
          key: "m" + indice + "_" + i,
          x: centro, y: baseY + 26 + i * 18,
          textAnchor: "middle",
          style: { fontSize: FONTE_ROTULO, fill: COR.dim }
        }, linha));
      });
      /* Conector pontilhado: liga o fim desta etapa ao inicio da proxima,  */
      /* sempre na mesma altura (o acumulado e continuo entre as duas).     */
      if (indice < etapas.length - 1) {
        var yConector = yDoValor(e.fim);
        conectores.push(h("line", {
          key: "c" + indice,
          x1: centro + larguraColuna / 2, y1: yConector,
          x2: centro + faixa - larguraColuna / 2, y2: yConector,
          stroke: COR.faint, strokeWidth: 1, strokeDasharray: "3,3"
        }));
      }
    });

    var periodo = meses.length
      ? rotuloMes(meses[0]) + " a " + rotuloMes(meses[meses.length - 1])
      : "sem período";

    return h("div", moldura,
      h("svg", {
        viewBox: "0 0 " + SLIDE.largura + " " + SLIDE.altura,
        width: "100%",
        preserveAspectRatio: "xMidYMid meet",
        style: { display: "block", background: COR.surface }
      },
        h("text", {
          x: RECUO_TITULO, y: 68,
          style: { fontSize: 40, fill: COR.text, fontWeight: 600, letterSpacing: "0.5px" }
        }, props.titulo || "FONTES E USOS DAS RECEITAS"),
        h("text", {
          x: RECUO_TITULO, y: 98,
          style: { fontSize: 15, fill: COR.faint }
        }, periodo + " · regime de " + (regime === "caixa" ? "caixa" : "competência") + " · R$" + " · acumulado do período"),

        h("image", {
          href: LOGO_QUORUM,
          x: MARGEM_RODAPE,
          y: SLIDE.altura - MARGEM_RODAPE - TAMANHO_LOGO,
          width: TAMANHO_LOGO,
          height: TAMANHO_LOGO
        }),

        h("text", {
          x: SLIDE.largura - MARGEM_RODAPE,
          y: SLIDE.altura - MARGEM_RODAPE - TAMANHO_LOGO / 2 + 6,
          textAnchor: "end",
          style: { fontSize: 17, fill: COR.faint, fontVariantNumeric: "tabular-nums" }
        }, String(props.numero || 1)),

        grade,
        conectores,
        barras
      )
    );
  }



  /* Igual a escalaPercentual, mas sem prender o piso em 0% nem o teto em   */
  /* 100%: uma taxa de crescimento pode ser negativa, e a escala precisa    */
  /* acompanhar o dado, nao um limite artificial.                          */
  function escalaLinhaLivre(valores) {
    var validos = valores.filter(function (v) { return v !== null && isFinite(v); });
    var minimo = validos.length ? Math.min.apply(null, validos) : 0;
    var maximo = validos.length ? Math.max.apply(null, validos) : 0.02;
    var AMPLITUDE_MINIMA = 0.02;
    var centro = (minimo + maximo) / 2;
    var metade = Math.max((maximo - minimo) / 2 + 0.005, AMPLITUDE_MINIMA / 2);
    var piso = Math.floor((centro - metade) * 1000) / 1000;
    var teto = Math.ceil((centro + metade) * 1000) / 1000;
    if (teto <= piso) teto = piso + 0.02;
    var passoCru = (teto - piso) / 4;
    var passo = Math.max(0.005, Math.round(passoCru * 1000) / 1000);
    return { piso: piso, teto: teto, passo: passo };
  }

  /* Paleta por ano-safra: cada ano de historico recebe um tom, ciclando se */
  /* passar de quatro anos. Usada so no grafico de LTM, que por natureza    */
  /* sempre abrange varios anos quando tem dado suficiente para existir.    */
  var TONS_POR_ANO = ["#0A2A47", "#216FA8", "#74B4DC", "#B9C0CC"];

  /* Soma de Receita Bruta terminando em "mes" (formato AAAA-MM), inclusive. */
  /* Quando ha 12 meses de historico da empresa disponiveis, soma a janela   */
  /* movel completa (completo:true). Antes disso, soma o que existe desde   */
  /* o inicio do historico (completo:false) — por pedido explicito de Alex, */
  /* que prefere ver o acumulado parcial a nao ver nada, sabendo que a      */
  /* leitura de "ultimos 12 meses" so vale a partir do primeiro ponto       */
  /* completo. O grafico marca visualmente a diferenca entre os dois.       */
  function janelaLTM(dados, mesInicioHistorico, mesAlvo) {
    var partesAlvo = mesAlvo.split("-");
    var indiceAlvo = Number(partesAlvo[0]) * 12 + (Number(partesAlvo[1]) - 1);
    var partesInicio = mesInicioHistorico.split("-");
    var indiceInicio = Number(partesInicio[0]) * 12 + (Number(partesInicio[1]) - 1);
    var mesesDisponiveis = Math.min(12, indiceAlvo - indiceInicio + 1);

    var gruposReceita = (dados.secoesDre ? dados.secoesDre[0].groups : SECOES_DRE[0].groups);
    var soma = 0;
    for (var i = 0; i < mesesDisponiveis; i++) {
      var indiceMes = indiceAlvo - i;
      var mes = Math.floor(indiceMes / 12) + "-" + String((indiceMes % 12) + 1).padStart(2, "0");
      gruposReceita.forEach(function (grupo) {
        soma += dados.grupoMes(grupo, mes);
      });
    }
    return { soma: soma, completo: mesesDisponiveis >= 12 };
  }

  /* Colunas com a soma de Receita Bruta nos ultimos 12 meses (janela       */
  /* movel), e uma linha com o crescimento do LTM contra o LTM do mes       */
  /* anterior. Enquanto a empresa nao tem 12 meses de historico, a barra    */
  /* mostra o acumulado parcial desde o inicio, mais clara e marcada com    */
  /* asterisco: nao e uma leitura de "ultimos 12 meses" ainda, e o rodape   */
  /* do grafico deixa isso explicito sempre que houver alguma barra assim.  */
  function GraficoReceitaBrutaLTM(props) {
    var dados = props.dados;
    var regime = props.regime;

    /* O inicio do historico vem SEMPRE da base inteira (props.todosMeses),  */
    /* nunca do filtro de exibicao: se Alex filtrar a tela pra mostrar so    */
    /* agosto, a janela de 12 meses ainda soma os meses reais anteriores, e  */
    /* o rotulo "completo vs parcial" continua correto. So os meses          */
    /* efetivamente exibidos (props.meses, ja filtrado) ganham barra.        */
    var baseHistorico = props.todosMeses && props.todosMeses.length ? props.todosMeses : props.meses;
    var mesInicioHistorico = baseHistorico.length ? baseHistorico[0] : null;
    var mesesValidos = props.meses.slice();

    var valoresBarra = {};
    var completoBarra = {};
    mesesValidos.forEach(function (mes) {
      var janela = janelaLTM(dados, mesInicioHistorico, mes);
      valoresBarra[mes] = janela.soma;
      completoBarra[mes] = janela.completo;
    });

    var crescimento = {};
    mesesValidos.forEach(function (mes, indice) {
      if (indice === 0) { crescimento[mes] = null; return; }
      var mesAnterior = mesesValidos[indice - 1];
      var atual = valoresBarra[mes];
      var anterior = valoresBarra[mesAnterior];
      crescimento[mes] = anterior > 0 ? (atual - anterior) / anterior : null;
    });

    var maiorBarra = mesesValidos.reduce(function (maior, mes) {
      return Math.max(maior, valoresBarra[mes]);
    }, 0);

    var temParcial = mesesValidos.some(function (mes) { return !completoBarra[mes]; });

    var moldura = {
      className: "rounded overflow-hidden mx-auto",
      style: {
        background: COR.surface,
        border: "1px solid " + COR.line,
        maxWidth: 1080,
        width: "100%"
      }
    };

    if (!mesesValidos.length || maiorBarra <= 0) {

  var CONTRATO_ESPERADO = 2;

  /* (sem data, duplicidade, cancelado), baixa. Empate mantem a ordem.  */
  var PESO_GRAVIDADE = { "alta": 1, "média": 2, "baixa": 4 };

      .sort(function (x, y) { return (pesoDe(x[0]) - pesoDe(y[0])) || (x[1] - y[1]); })

  /* Converte uma linha crua da API no formato que o motor de calculo usa.  */
  /* O id precisa ser estavel entre cargas -- e usado como key do React na  */
  /* tabela da gaveta (GavetaLancamentos). Um indice de array (posicao      */
  /* depois da ordenacao por data) muda quando um lancamento novo entra no  */
  /* meio da ordem cronologica, o que faz o React reconciliar a linha       */
  /* errada silenciosamente. Titulo (nCodTitulo) e a primeira escolha; na   */
  /* falta dele (movimento de caixa puro: tarifa, cashback, transferencia), */
  /* o id_movimento (nCodMovCC) e igualmente estavel, vem direto da Omie e  */
  /* nao depende de posicao. So cai no indice se nenhum dos dois existir,   */
  /* o que na pratica nao deveria acontecer -- todo lancamento tem pelo     */
  /* menos um movimento de conta corrente por tras. */
  /* Contas da carga com um dos tipos do cadastro da Omie (CC, CX, CR,   */
  /* CV). Mesma regra da posicao do topo: o tipo decide, nunca o nome.   */
  function contasDoTipo(dados, tipos) {

  }

  /* Contas que nao sao aplicacao, caucao nem cartao: CC, CX e qualquer   */
  /* outro tipo (ou conta sem tipo, que tambem vira achado). Ficam em      */
  /* conta corrente para o caixa total sempre fechar com o saldo de todas  */
  /* as contas.                                                            */
  var TIPOS_FORA_DA_CONTA_CORRENTE = ["CA", "CV", "CR"];
  function contasCorrentes(dados) {
    return dados.contas.filter(function (conta) {
      return TIPOS_FORA_DA_CONTA_CORRENTE.indexOf(dados.tipoConta[conta] || "") < 0;
    });

  /* Posicao de caixa no fim de um mes, pelo tipo da conta na Omie (nunca */
  /* pelo nome): CA aplicacao, CV caucao, CR cartao, o resto conta        */
  /* corrente. Caixa total = conta corrente + aplicacoes + caucao; caixa  */
  /* livre = caixa total - caucao - fatura em aberto. O saldo da conta de */
  /* cartao ja e negativo enquanto a fatura nao e paga, entao "cartao"    */
  /* aqui e esse saldo (negativo) e o caixa total e o saldo de todas as   */
  /* contas sem ele. Usada pelos cartoes, pela pagina Posicao de caixa e  */
  /* pelo fluxo de caixa, para os tres mostrarem sempre os mesmos numeros.*/
  function posicaoNoMes(dados, mes) {
    function soma(contas) {
      return contas.reduce(function (t, conta) { return t + ((dados.saldoConta[conta] || {})[mes] || 0); }, 0);
    }
    var grupos = {
      corrente: contasCorrentes(dados),
      aplicacoes: contasDoTipo(dados, ["CA"]),
      garantia: contasDoTipo(dados, ["CV"]),
      cartao: contasDoTipo(dados, ["CR"])
    };
    var corrente = soma(grupos.corrente), aplicacoes = soma(grupos.aplicacoes);
    var garantia = soma(grupos.garantia), cartao = soma(grupos.cartao);
    var total = corrente + aplicacoes + garantia;
    return {
      corrente: corrente, aplicacoes: aplicacoes, garantia: garantia, cartao: cartao,
      total: total,
      livre: total - garantia + cartao,
      nomes: grupos
    };
  }

  /* 20/10/2026). Semanas de segunda a domingo, a partir da corrente.    */
  /* Saldo inicial = caixa livre de hoje. Entradas e saidas = titulos em */

  /* Cartao: estimativa = media mensal dos gastos em contas CR nos 3     */

  /* ------------------------------------------------------------------ */
  var PROJECAO_SEMANAS = 13;
  var CATEGORIA_PAGAMENTO_FATURA = "2.17.94";
  function dataSemHora(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function textoData(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  /* ------------------------------------------------------------------ */
  /* Dias uteis (Parte C, 21/10/2026). Vencimento que cai em sabado,     */
  /* domingo ou dia sem expediente bancario so pode ser pago no dia util  */
  /* seguinte: o "vencimento efetivo" e esse dia. Usado nos atrasos, nos  */
  /* vencidos em aberto (inclusive previsao de OS e obrigacao vencida da */
  /* Reserva) e na semana da projecao de 13 semanas.                    */
  /* VALIDAR no calendario Febraban; feriados municipais de Sao Paulo    */
  /* fora por enquanto.                                                  */
  /* ------------------------------------------------------------------ */
  var FERIADOS_NACIONAIS_FIXOS = ["01-01", "04-21", "05-01", "09-07", "10-12", "11-02", "11-15", "11-20", "12-25"];
  /* Feriados moveis, em dias a partir do domingo de Pascoa: segunda e   */
  /* terca de Carnaval, Sexta-feira Santa e Corpus Christi.              */
  var FERIADOS_MOVEIS_DESDE_PASCOA = [-48, -47, -2, 60];
  /* Domingo de Pascoa (algoritmo de Meeus/Jones/Butcher, calendario     */
  /* gregoriano).                                                        */
  function domingoDePascoa(ano) {
    var a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4;
    var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), hh = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - hh - k) % 7, m = Math.floor((a + 11 * hh + 22 * l) / 451);
    var mes = Math.floor((hh + l - 7 * m + 114) / 31), dia = ((hh + l - 7 * m + 114) % 31) + 1;
    return new Date(ano, mes - 1, dia);

  var cacheFeriados = {};

    var lista = {};
    FERIADOS_NACIONAIS_FIXOS.forEach(function (md) { lista[ano + "-" + md] = true; });
    var pascoa = domingoDePascoa(ano);
    FERIADOS_MOVEIS_DESDE_PASCOA.forEach(function (n) {
      var d = new Date(pascoa); d.setDate(d.getDate() + n); lista[textoData(d)] = true;
    });
    cacheFeriados[ano] = lista;
    return lista;
  }
  function ehDiaUtil(d) {

  /* Recebe Date ou texto "AAAA-MM-DD"; devolve Date do dia util. */
  function vencimentoEfetivo(venc) {

    for (var n = 0; n < 15 && !ehDiaUtil(d); n++) d.setDate(d.getDate() + 1);

  function vencimentoEfetivoTexto(venc) { return venc ? textoData(vencimentoEfetivo(venc)) : ""; }

  function rotuloVencimento(venc, comAno) {
    if (!venc) return "–";
    var ef = vencimentoEfetivoTexto(venc);
    var fmtD = function (t) { var p = t.split("-"); return p[2] + "/" + p[1] + (comAno ? "/" + p[0] : ""); };
    return ef === venc ? fmtD(venc) : fmtD(venc) + " · útil " + fmtD(ef);
  }

  function calcularProjecao13(linhasCaixa, abertos, hoje, caixaHoje, reservaExigida, mesesBase) {
    var dia0 = dataSemHora(hoje), hojeTexto = textoData(dia0);
    var inicio = new Date(dia0); inicio.setDate(inicio.getDate() - ((inicio.getDay() + 6) % 7));
    var semanas = [];
    for (var i = 0; i < PROJECAO_SEMANAS; i++) {
      var ini = new Date(inicio); ini.setDate(inicio.getDate() + 7 * i);
      var fim = new Date(ini); fim.setDate(ini.getDate() + 6);
      semanas.push({ ini: ini, fim: fim, iniTexto: textoData(ini), fimTexto: textoData(fim),

    /* Titulos em aberto e previsoes de OS (estas marcadas "previsto"). */

      if (valor >= 0) sem.entradas += valor; else sem.saidas += valor;
      if (vencido) { sem.vencidos++; sem.valorVencido += valor; }
      sem.itens.push({ vencimento: venc, vencimentoOriginal: vencOriginal, tipo: l.tipo, contraparte: l.contraparte || "", categoria: l.categoria || "", valor: valor, vencido: vencido, previsto: ehPrevisaoOS(l) });
      if (l.tipo === "receber") { if (ehPrevisaoOS(l)) receber13.previsoes += valor; else receber13.titulos += valor; }
    });

    /* Cartao: gasto medio mensal em contas CR nos meses fechados em que a */
    /* conta de cartao ja tinha movimento, ate os 3 ultimos (ajuste de     */
    /* Alex, 20/10/2026): mes anterior a existencia da conta nao entra     */
    /* como zero.                                                          */
    var mesAtual = chaveMes(dia0);

    var diasFatura = {};
    linhasCaixa.forEach(function (l) {

      }

    var diaFatura = null;

      for (var k = 0; k < 6; k++) {
        var v = new Date(dia0.getFullYear(), dia0.getMonth() + k, dd);

        var vtOriginal = textoData(v), vt = vencimentoEfetivoTexto(vtOriginal);   /* fatura em dia nao util: dia util seguinte */
        var sem = semanas.filter(function (s) { return vt >= s.iniTexto && vt <= s.fimTexto; })[0];

    semanas.forEach(function (s, i) {

      semanas: semanas, caixaHoje: caixaHoje, reservaExigida: reservaExigida, primeiraAbaixo: primeiraAbaixo, receber13: receber13,
      temReceber: temReceber, depois: depois,
      cartao: { medio: cartaoMedio, gastoPorMes: gastoPorMes, meses: mesesCartao, dia: diaFatura === null ? null : Number(diaFatura),

  }

  /* ------------------------------------------------------------------ */
  /* Prazos e atrasos (Fase 4, 20/10/2026). So titulos (linha com id de  */
  /* titulo da Omie; sem movimentos avulsos, sem as linhas de encargo    */
  /* "-ENC-" e sem nada pago em conta de cartao CR) em categorias do DRE */
  /* (receita, impostos, custo, despesas, resultado financeiro e outras):*/
  /* mutuo e adiantamentos (1.11), distribuicoes (2.16), devolucoes e    */
  /* fatura de cartao (2.17), aplicacoes (2.18) e transferencias (0.x)   */
  /* nao sao prazo comercial. Periodo: mes do pagamento no filtro do     */
  /* topo. Media ponderada pelo valor pago.                              */
  /* ------------------------------------------------------------------ */
  var PRAZOS_SECOES = ["receita", "impostos", "custo", "despesas", "finRec", "finDesp", "outrasRec", "outrasDesp", "impLucro"];
  var DIA_MS = 86400000;
  function diasEntre(a, b) { return Math.round((dataSemHora(b) - dataSemHora(a)) / DIA_MS); }

  /* Totais e medias de uma lista de titulos de Prazos e atrasos: a      */
  /* mesma conta dos cartoes, da tabela por contraparte e do rodape da    */
  /* gaveta (Parte D), para os tres sempre baterem.                       */
  function mediasPrazos(lista) {
    var comPrazo = lista.filter(function (t) { return t.prazo !== null; });
    var peso = comPrazo.reduce(function (s, t) { return s + t.valor; }, 0);
    var atrasados = lista.filter(function (t) { return t.atraso !== null && t.atraso > 0; });
    var pesoAt = atrasados.reduce(function (s, t) { return s + t.valor; }, 0);
    return {
      qtd: lista.length,
      valor: lista.reduce(function (s, t) { return s + t.valor; }, 0),
      prazo: peso ? comPrazo.reduce(function (s, t) { return s + t.valor * t.prazo; }, 0) / peso : null,
      atraso: pesoAt ? atrasados.reduce(function (s, t) { return s + t.valor * t.atraso; }, 0) / pesoAt : null,
      qtdAtrasados: atrasados.length,
      comVencimento: lista.filter(function (t) { return t.atraso !== null; }).length,
      maiorAtraso: atrasados.reduce(function (m, t) { return Math.max(m, t.atraso); }, 0),
      titulos: lista, atrasados: atrasados
    };
  }

  function calcularPrazos(linhas, abertos, meses, hoje) {
    var noPeriodo = {};
    (meses || []).forEach(function (m) { noPeriodo[m] = true; });
    var titulos = linhas.filter(function (l) {
      return l.dPag && l.idTitulo && String(l.idTitulo).indexOf("-ENC-") < 0 && l.contaTipo !== "CR"
        && PRAZOS_SECOES.indexOf(secaoDaLinha(l)) >= 0 && noPeriodo[chaveMes(l.dPag)];
    }).map(function (l) {
      return { tipo: l.tipo, contraparte: l.contraparte || "Sem contraparte", valor: Math.abs(l.valor),
        prazo: l.dEmi ? diasEntre(l.dEmi, l.dPag) : null,
        atraso: l.dVenc ? diasEntre(vencimentoEfetivo(l.dVenc), l.dPag) : null,   /* dia util; so conta se positivo */
        /* para a gaveta (Parte D) */
        documento: l.documento || "", categoria: l.categoria || "", dEmi: l.dEmi, dVenc: l.dVenc, dPag: l.dPag };
    });
    var medias = mediasPrazos;
    var receber = medias(titulos.filter(function (t) { return t.tipo === "receber"; }));
    var pagar = medias(titulos.filter(function (t) { return t.tipo === "pagar"; }));
    var grupos = {};
    titulos.forEach(function (t) {
      var chave = t.tipo + "||" + t.contraparte;
      (grupos[chave] = grupos[chave] || { tipo: t.tipo, contraparte: t.contraparte, lista: [] }).lista.push(t);
    });
    var porContraparte = Object.keys(grupos).map(function (k) {
      var g = grupos[k]; var m = medias(g.lista);
      return { tipo: g.tipo, contraparte: g.contraparte, qtd: m.qtd, valor: m.valor, prazo: m.prazo, atraso: m.atraso, maiorAtraso: m.maiorAtraso, titulos: g.lista };
    }).sort(function (a, b) { return a.tipo === b.tipo ? b.valor - a.valor : (a.tipo === "receber" ? -1 : 1); });

    /* Vencidos em aberto: todo titulo sem pagamento com vencimento antes  */
    /* de hoje, qualquer categoria (obrigacao e obrigacao), sem periodo.  */
    var hojeTexto = textoData(dataSemHora(hoje));
    /* Vencido so depois do vencimento efetivo (dia util). */
    var vencidos = (abertos || []).filter(function (l) { return l.vencimento && vencimentoEfetivoTexto(l.vencimento) < hojeTexto && !ehPrevisaoOS(l); }).map(function (l) {
      return { tipo: l.tipo, contraparte: l.contraparte || "Sem contraparte", categoria: l.categoria || "", vencimento: l.vencimento,
        dias: diasEntre(vencimentoEfetivo(l.vencimento), hoje), valor: Number(l.valor_aberto || l.valor_titulo || 0),
        documento: l.documento || "", emissao: l.emissao || "" };
    }).sort(function (a, b) { return b.dias - a.dias; });
    var totalVencido = function (tipo) { return vencidos.filter(function (v) { return v.tipo === tipo; }).reduce(function (s, v) { return s + v.valor; }, 0); };
    return { receber: receber, pagar: pagar, porContraparte: porContraparte, vencidos: vencidos,
      vencidoReceber: totalVencido("receber"), vencidoPagar: totalVencido("pagar") };
  }

  /* ------------------------------------------------------------------ */
  /* Fiscal (Simples) (Fase 5, 21/10/2026). Estimativa gerencial: o     */
  /* valor oficial do DAS e o da contabilidade (TKS).                    */
  /* ------------------------------------------------------------------ */
  /* VALIDAR com a TKS se a opcao e competencia ou caixa. */
  var REGIME_SIMPLES = "competencia";

  /* adiantamento, pensao e IRRF retidos, FGTS e INSS. Ficam fora os     */
  /* beneficios (2.08.86 a 2.08.90). VALIDAR NA FONTE com a TKS.         */
  var CATEGORIAS_FOLHA_FATOR_R = ["2.08.91", "2.08.92", "2.08.93", "2.08.94", "2.08.95", "2.08.96", "2.08.97", "2.08.98", "2.08.99"];

  /* VALIDAR NA FONTE: LC 123, Anexos III e V, com a TKS. */
  var SIMPLES_ANEXO_III = [
    { ate: 180000, nominal: 0.06, deducao: 0 },
    { ate: 360000, nominal: 0.112, deducao: 9360 },
    { ate: 720000, nominal: 0.135, deducao: 17640 },
    { ate: 1800000, nominal: 0.16, deducao: 35640 },
    { ate: 3600000, nominal: 0.21, deducao: 125640 },
    { ate: 4800000, nominal: 0.33, deducao: 648000 }

  var SIMPLES_ANEXO_V = [
    { ate: 180000, nominal: 0.155, deducao: 0 },
    { ate: 360000, nominal: 0.18, deducao: 4500 },
    { ate: 720000, nominal: 0.195, deducao: 9900 },
    { ate: 1800000, nominal: 0.205, deducao: 17100 },
    { ate: 3600000, nominal: 0.23, deducao: 62100 },
    { ate: 4800000, nominal: 0.305, deducao: 540000 }

  /* VALIDAR NA FONTE (Vigo/TKS): no ano-calendario de inicio de         */
  /* atividade, o teste de excesso de sublimite e de teto e proporcional */
  /* aos meses de atividade, e nao sobre o RBT12 anualizado.             */
  var SIMPLES_SUBLIMITE = 3600000, SIMPLES_TETO = 4800000;

  function faixaSimples(rbt12) {
    for (var i = 0; i < SIMPLES_ANEXO_III.length; i++) if (rbt12 <= SIMPLES_ANEXO_III[i].ate) return i;
    return null;   /* acima do teto */
  }

  /* zero (primeiro mes sem receita), vale a nominal da 1a faixa.        */
  function aliquotaEfetiva(tabela, rbt12) {

    return (rbt12 * tabela[f].nominal - tabela[f].deducao) / rbt12;
  }

  /* RBT12 com a regra de inicio de atividade, sobre uma serie mensal    */
  /* (meses consecutivos desde INICIO_ATIVIDADE). Usada pela tela Fiscal */
  /* e pelo FCF projetado.                                               */
  /* VALIDAR NA FONTE: LC 123, art. 18, par. 2o (Vigo/TKS).              */
  /* 1o mes: receita do proprio mes x 12; com menos de 12 meses: media  */
  /* dos meses anteriores ao mes de apuracao x 12; depois: soma dos 12  */
  /* meses anteriores. Junho/26 (sem receita) conta como mes de         */
  /* atividade na media (VALIDAR com a TKS).                             */
  function janelaRBT12(meses, serie, i) {

    var anteriores = meses.slice(Math.max(0, i - 12), i);

    if (i < 12) return { valor: soma / anteriores.length * 12, regra: "média de " + anteriores.length + " mês(es) anteriores × 12" };

  function mesesEntre(ini, fim) {

    while (true) {

  /* linhas: lancamentos pagos (normalizados); abertos: titulos sem      */
  /* pagamento (como vieram da base). Em competencia, receita emitida e  */
  /* ainda nao recebida entra no mes de emissao (VALIDAR com a TKS).     */
  /* O DAS do mes e o lancado em 2.14.99 com emissao naquele mes          */
  /* (VALIDAR com a TKS). Decisoes de Alex em 21/10/2026.                 */
  function calcularFiscal(linhas, abertos, hoje) {
    var mesAtual = chaveMes(hoje);
    var meses = mesesEntre(INICIO_ATIVIDADE, mesAtual);
    var receita = {}, das = {}, folha = {};
    meses.forEach(function (m) { receita[m] = 0; das[m] = 0; folha[m] = 0; });
    function mesDe(dEmi, dPag) {

    }

    }
    linhas.forEach(function (l) {
      var m = mesDe(l.dEmi, l.dPag);

      var cg = l.codigoGrupo || CODIGO_DO_GRUPO.get(l.grupo) || "";

      if (l.codigoCategoria === CATEGORIA_DAS) das[m] += l.valor;
      if (CATEGORIAS_FOLHA_FATOR_R.indexOf(l.codigoCategoria) >= 0) folha[m] += l.valor;
    });
    if (REGIME_SIMPLES !== "caixa") {
      (abertos || []).forEach(function (l) {

        var m = l.emissao.slice(0, 7);

        estIII: iii, estV: v, das: das[m], efetiva: efetiva,
        destaque: efetiva !== null && iii !== null && v !== null && Math.abs(efetiva - iii) > 0.01 && Math.abs(efetiva - v) > 0.01,
        folha12: folha12, fatorR: rbt12 > 0 ? folha12 / rbt12 : null

  }

  /* ------------------------------------------------------------------ */
  /* Free Cash Flow projetado (Parte E, 21/10/2026). Uma funcao so, usada */
  /* pela tela Fluxo de Caixa Livre e pelo grafico 10.                   */
  /* - Horizonte: mes corrente ate o mes do ultimo vencimento (efetivo)   */
  /*   em aberto, titulos e previsoes de OS.                              */
  /* - Receita: titulos a receber e previsoes de OS da secao receita; no  */
  /*   caixa pelo vencimento efetivo (vencido cai no mes corrente) e na   */
  /*   competencia pela emissao (para impostos e custos).                 */
  /* - Impostos (ajuste de Alex, 21/10/2026): para cada mes de           */
  /*   competencia, aliquota efetiva estimada do Anexo III pelo RBT12     */
  /*   (janelaRBT12, a regra da tela Fiscal), com a receita do Fiscal nos */
  /*   meses passados e a receita projetada (inclusive previsoes de OS)   */
  /*   entrando no RBT12 dos meses seguintes; sobre a receita de cada mes */
  /*   de competencia (no mes corrente, tambem a ja realizada, cujo DAS   */
  /*   ainda nao foi pago); sai no dia 20 do mes seguinte. A aliquota     */
  /*   realizada dos 3 meses fechados fica so como referencia.            */
  /* - Custos diretos: % da receita (secao custo / receita, competencia,  */
  /*   3 meses fechados), sobre a receita projetada, no mes da emissao.  */
  /* - Despesas: media mensal paga (caixa) da secao despesas nos 3 meses  */
  /*   fechados, sem os lancamentos das contrapartes que tem titulo a     */
  /*   pagar em aberto no horizonte (essas entram pelo titulo; o resto da */
  /*   categoria fica na media, ajuste de Alex, 21/10/2026). A parte paga */
  /*   historicamente em conta de cartao (CR) sai na fatura do dia 5 do   */
  /*   mes seguinte; o resto no proprio mes. No mes corrente, so os dias  */
  /*   que faltam. O "ritmo do mes corrente" e so informativo.            */
  /* - Titulos a pagar em aberto: no vencimento efetivo.                  */
  /* - Fora: 1.11, 2.16, 2.17, 2.18, 0.x e resultado financeiro.          */
  /* - FCF = receita - impostos - custos - despesas - titulos a pagar;    */
  /*   saldo = caixa livre de hoje + FCF acumulado.                       */
  /* ------------------------------------------------------------------ */
  var FCF_SECOES_TITULOS_A_PAGAR = ["impostos", "custo", "despesas", "outrasDesp", "impLucro"];
  function somarMes(chave, n) {
    var a = +chave.slice(0, 4), m = +chave.slice(5, 7) - 1 + n;
    a += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return a + "-" + String(m + 1).padStart(2, "0");
  }
  function secaoDoAberto(l) {
    return SECAO_POR_CODIGO_GRUPO[l.codigo_grupo || ""] || SECAO_POR_CODIGO_GRUPO[CODIGO_DO_GRUPO.get(l.grupo) || ""] || "naoClassificado";
  }
  function calcularFCFProjetado(dadosComp, dadosCaixa, abertos, hoje, caixaHoje, reservaExigida, mesesBase, fiscal) {
    var mesAtual = chaveMes(hoje);
    var fechados = (mesesBase || []).slice();
    var n = fechados.length;
    /* Bases historicas (3 meses fechados). */
    var receita3 = 0, das3 = 0, custo3 = 0;
    fechados.forEach(function (m) {
      receita3 += (dadosComp.S.receita || {})[m] || 0;
      custo3 += (dadosComp.S.custo || {})[m] || 0;
    });
    dadosComp.linhas.forEach(function (l) {
      if (l.codigoCategoria === CATEGORIA_DAS && fechados.indexOf(chaveMes(l.dataRegime)) >= 0) das3 += l.valor;
    });
    var aliquota = receita3 > 0 ? -das3 / receita3 : 0;
    var custoPct = receita3 > 0 ? -custo3 / receita3 : 0;

    /* Itens em aberto que entram na projecao. */
    var itensReceber = [], itensPagar = [];
    (abertos || []).forEach(function (l) {
      if (!l.vencimento) return;
      var sec = secaoDoAberto(l);
      var mCaixa = chaveMes(vencimentoEfetivo(l.vencimento));
      if (mCaixa < mesAtual) mCaixa = mesAtual;
      var valor = Number(l.valor_aberto || l.valor_titulo || 0);
      var item = { l: l, mCaixa: mCaixa, mComp: l.emissao ? l.emissao.slice(0, 7) : mCaixa, valor: valor, previsao: ehPrevisaoOS(l), secao: sec,
        contraparte: resolverContraparte(l).nome };
      if (l.tipo === "receber" && sec === "receita") itensReceber.push(item);
      else if (l.tipo === "pagar" && FCF_SECOES_TITULOS_A_PAGAR.indexOf(sec) >= 0) itensPagar.push(item);
    });
    var ultimo = mesAtual;
    itensReceber.concat(itensPagar).forEach(function (it) { if (it.mCaixa > ultimo) ultimo = it.mCaixa; });
    var meses = [];
    for (var k = mesAtual; k <= ultimo; k = somarMes(k, 1)) meses.push(k);

    /* Despesas medias, sem os lancamentos das contrapartes com titulo a */
    /* pagar no horizonte (o titulo ja leva o valor delas).               */
    var contrapartesComTitulo = {};
    itensPagar.forEach(function (it) { if (it.contraparte) contrapartesComTitulo[it.contraparte] = 0; });
    var despTotal = 0, despCartao = 0, despExcluida = 0, despMesAtual = 0;
    dadosCaixa.linhas.forEach(function (l) {
      if (!l.dPag || secaoDaLinha(l) !== "despesas") return;
      var m = chaveMes(l.dPag);
      var excluida = contrapartesComTitulo.hasOwnProperty(l.contraparte);
      if (m === mesAtual) { if (!excluida) despMesAtual += l.valor; return; }
      if (fechados.indexOf(m) < 0) return;
      if (excluida) { contrapartesComTitulo[l.contraparte] += l.valor; despExcluida += l.valor; return; }
      despTotal += l.valor;
      if (l.contaTipo === "CR") despCartao += l.valor;
    });
    var despMedia = n ? despTotal / n : 0, despMediaCartao = n ? despCartao / n : 0, despMediaConta = despMedia - despMediaCartao;
    var despMediaSemExclusao = n ? (despTotal + despExcluida) / n : 0;
    var diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
    var fracaoMesAtual = (diasNoMes - hoje.getDate() + 1) / diasNoMes;
    /* Ritmo do mes corrente (so informativo): despesas ja pagas no mes,  */
    /* sem as mesmas contrapartes, estendidas ao mes inteiro pelos dias   */
    /* decorridos, contra a media usada.                                  */
    var ritmoMes = despMesAtual / hoje.getDate() * diasNoMes;
    var ritmo = { lancadas: despMesAtual, diasDecorridos: hoje.getDate(), diasNoMes: diasNoMes, noMes: ritmoMes,
      otimismo: Math.max(0, despMedia - ritmoMes) };

    var linha = {};
    ["receita", "impostos", "custos", "despConta", "despCartao", "titulos", "fcf", "saldo", "reserva"].forEach(function (c) {
      linha[c] = {}; meses.forEach(function (m) { linha[c][m] = 0; });
    });
    var foraDoHorizonte = { impostos: 0, despCartao: 0 };
    function lanca(campo, m, v) { if (linha[campo].hasOwnProperty(m)) linha[campo][m] += v; else if (foraDoHorizonte.hasOwnProperty(campo)) foraDoHorizonte[campo] += v; }

    var receitaComp = {};
    meses.forEach(function (m) { receitaComp[m] = 0; });
    receitaComp[mesAtual] += (dadosComp.S.receita || {})[mesAtual] || 0;   /* realizada no mes corrente: DAS ainda a pagar */
    var receitaRealizadaMesAtual = receitaComp[mesAtual];
    itensReceber.forEach(function (it) {
      lanca("receita", it.mCaixa, it.valor);
      if (it.mComp >= mesAtual && receitaComp.hasOwnProperty(it.mComp)) {
        receitaComp[it.mComp] += it.valor;
        lanca("custos", it.mComp, -custoPct * it.valor);
      }
    });
    /* Aliquota do Anexo III pelo RBT12 projetado: receita do Fiscal nos  */
    /* meses passados, receita projetada de competencia do mes corrente   */
    /* em diante.                                                         */
    var mesesSimples = mesesEntre(INICIO_ATIVIDADE, meses[meses.length - 1]);
    var serieSimples = {};
    mesesSimples.forEach(function (m) {
      serieSimples[m] = m < mesAtual ? ((fiscal && fiscal.porMes[m]) ? fiscal.porMes[m].receita : 0) : (receitaComp[m] || 0);
    });
    var simples = {};
    meses.forEach(function (m) {
      var rbt = janelaRBT12(mesesSimples, serieSimples, mesesSimples.indexOf(m)).valor;
      var aliq = aliquotaEfetiva(SIMPLES_ANEXO_III, rbt);
      if (aliq === null) aliq = SIMPLES_ANEXO_III[SIMPLES_ANEXO_III.length - 1].nominal;   /* acima do teto: nao deveria ocorrer */
      simples[m] = { rbt12: rbt, aliquota: aliq, faixa: faixaSimples(rbt), receita: receitaComp[m] };
      lanca("impostos", somarMes(m, 1), -aliq * receitaComp[m]);
    });
    itensPagar.forEach(function (it) { lanca("titulos", it.mCaixa, it.valor); });
    meses.forEach(function (m) {
      var f = m === mesAtual ? fracaoMesAtual : 1;
      lanca("despConta", m, despMediaConta * f);
      lanca("despCartao", somarMes(m, 1), despMediaCartao * f);
    });
    var saldo = caixaHoje, primeiraAbaixoReserva = null, primeiraNegativa = null;
    meses.forEach(function (m) {
      var fcf = linha.receita[m] + linha.impostos[m] + linha.custos[m] + linha.despConta[m] + linha.despCartao[m] + linha.titulos[m];
      linha.fcf[m] = fcf; saldo += fcf; linha.saldo[m] = saldo; linha.reserva[m] = reservaExigida;
      if (primeiraAbaixoReserva === null && reservaExigida !== null && saldo < reservaExigida) primeiraAbaixoReserva = m;
      if (primeiraNegativa === null && saldo < 0) primeiraNegativa = m;
    });
    return {
      meses: meses, mesAtual: mesAtual, linha: linha, caixaHoje: caixaHoje, reservaExigida: reservaExigida,
      primeiraAbaixoReserva: primeiraAbaixoReserva, primeiraNegativa: primeiraNegativa,
      base: { meses: fechados, receita3: receita3, das3: das3, custo3: custo3, aliquota: aliquota, custoPct: custoPct,
        despMedia: despMedia, despMediaConta: despMediaConta, despMediaCartao: despMediaCartao,
        contrapartesComTitulo: contrapartesComTitulo, despMediaSemExclusao: despMediaSemExclusao, ritmo: ritmo,
        simples: simples, fracaoMesAtual: fracaoMesAtual, receitaRealizadaMesAtual: receitaRealizadaMesAtual },
      totais: {
        receber: itensReceber.reduce(function (t, it) { return t + it.valor; }, 0),
        receberTitulos: itensReceber.filter(function (it) { return !it.previsao; }).reduce(function (t, it) { return t + it.valor; }, 0),
        receberPrevisoes: itensReceber.filter(function (it) { return it.previsao; }).reduce(function (t, it) { return t + it.valor; }, 0),
        pagar: itensPagar.reduce(function (t, it) { return t + it.valor; }, 0),
        qtdReceber: itensReceber.length, qtdPagar: itensPagar.length
      },
      foraDoHorizonte: foraDoHorizonte
    };
  }

  /* FCF realizado dos meses fechados (ajuste 4 de Alex, 21/10/2026), no */
  /* mesmo desenho da projecao. FCF do mes = lucro liquido de caixa (a   */
  /* regra do burn liquido de Reserva e runway: so secoes do DRE). Saldo */
  /* = caixa livre no fim do mes (posicaoNoMes). "Fora da operacao" =    */
  /* lancamentos fora do DRE (1.11, 2.16, 2.17, 2.18, 2.19, 0.x, nao     */
  /* classificado) nas contas que contam no caixa livre, menos o que for */
  /* de DRE lancado na caucao (CV, fora do caixa livre). Conferencia:    */
  /* saldo anterior + FCF + fora da operacao = saldo (diferenca zero).   */
  var FCF_SECOES_FORA_DA_OPERACAO = ["entradas", "saidas", "ativo", "capex", "transf", "naoClassificado"];
  function calcularFCFRealizado(dadosCaixa, mesesFechados, reservaPorMes) {
    var caucao = contasDoTipo(dadosCaixa, ["CV"]);
    var linha = {};
    ["receita", "impostos", "custos", "despConta", "despCartao", "outros", "fcf", "fora", "saldo", "reserva", "conferencia"].forEach(function (c) {
      linha[c] = {}; mesesFechados.forEach(function (m) { linha[c][m] = 0; });
    });
    dadosCaixa.linhas.forEach(function (l) {
      if (!l.dPag) return;
      var m = chaveMes(l.dPag);
      if (!linha.fcf.hasOwnProperty(m)) return;
      var sec = secaoDaLinha(l), naCaucao = caucao.indexOf(l.conta) >= 0;
      if (sec === "despesas" && l.contaTipo === "CR") linha.despCartao[m] += l.valor;
      if (FCF_SECOES_FORA_DA_OPERACAO.indexOf(sec) >= 0) { if (!naCaucao) linha.fora[m] += l.valor; }
      else if (naCaucao) linha.fora[m] -= l.valor;
    });
    var S = dadosCaixa.S;
    mesesFechados.forEach(function (m) {
      var i = dadosCaixa.meses.indexOf(m);
      var anterior = i > 0 ? posicaoNoMes(dadosCaixa, dadosCaixa.meses[i - 1]).livre : 0;
      linha.receita[m] = S.receita[m] || 0;
      linha.impostos[m] = S.impostos[m] || 0;
      linha.custos[m] = S.custo[m] || 0;
      linha.despConta[m] = (S.despesas[m] || 0) - linha.despCartao[m];
      linha.outros[m] = (S.finRec[m] || 0) + (S.finDesp[m] || 0) + (S.outrasRec[m] || 0) + (S.outrasDesp[m] || 0) + (S.impLucro[m] || 0);
      linha.fcf[m] = dadosCaixa.lucroLiquido[m] || 0;
      linha.saldo[m] = posicaoNoMes(dadosCaixa, m).livre;
      linha.reserva[m] = reservaPorMes && reservaPorMes[m] ? reservaPorMes[m].reserva : null;
      linha.conferencia[m] = Math.round((linha.saldo[m] - anterior - linha.fcf[m] - linha.fora[m]) * 100) / 100;
    });
    return { meses: mesesFechados.slice(), linha: linha };
  }

  /* dadosCaixa: calcular() em regime de caixa (pago). hoje: Date.        */
  /* abertos: titulos em aberto como vieram da base (sem pagamento).     */
  function calcularReserva(dadosCaixa, abertos, hoje) {
    var mesAtual = chaveMes(hoje);
    var hojeTexto = hoje.getFullYear() + "-" + String(hoje.getMonth() + 1).padStart(2, "0") + "-" + String(hoje.getDate()).padStart(2, "0");
    var meses = dadosCaixa.meses.filter(function (m) { return m >= RESERVA_PRIMEIRO_MES && m <= mesAtual; });
    if (meses.indexOf(mesAtual) < 0) meses.push(mesAtual);
    var fechados = dadosCaixa.meses.filter(function (m) { return m >= RESERVA_PRIMEIRO_MES && m < mesAtual; });

    /* Custo com o sinal do DRE: negativo. */
    function custoDoMes(m) {
      return RESERVA_SECOES_DE_CUSTO.reduce(function (t, sec) { return t + ((dadosCaixa.S[sec[0]] || {})[m] || 0); }, 0);
    }
    /* Mutuo: entradas da categoria e saidas pagas do projeto ate o fim do mes. */
    var lancamentosMutuo = dadosCaixa.linhas.filter(function (l) {
      return l.dPag && (l.codigoCategoria === MUTUO_CONVERSIVEL_CATEGORIA
        || (l.projeto === MUTUO_CONVERSIVEL_PROJETO && l.tipo === "pagar"
            && MUTUO_SECOES_DE_USO.indexOf(secaoDaLinha(l)) >= 0));
    }).sort(function (a, b) { return a.dPag - b.dPag; });
    function saldoMutuo(m) {
      return lancamentosMutuo.reduce(function (t, l) { return chaveMes(l.dPag) <= m ? t + l.valor : t; }, 0);
    }

    /* Burn liquido do mes: entradas e saidas das secoes do DRE em caixa,  */
    /* ou seja, o lucro liquido de caixa. Fica fora tudo o que nao e DRE:  */
    /* transferencias 0.x, fatura 2.17, aplicacoes 2.18, mutuo (1.11,     */
    /* inclusive a captacao 1.11.95) e distribuicoes 2.16.                 */
    function burnDoMes(m) { return dadosCaixa.lucroLiquido[m] || 0; }

    var porMes = {};
    meses.forEach(function (m) {
      var base = fechados.filter(function (f) { return m === mesAtual ? f < m : f <= m; }).slice(-RESERVA_MESES_NA_MEDIA);
      var media = base.length ? base.reduce(function (t, f) { return t + custoDoMes(f); }, 0) / base.length : 0;
      /* Sem custo medio (meses antes da operacao) nao ha reserva a       */
      /* comparar: reserva, excedente e cobertura ficam vazios ("–").     */
      var temBase = media < 0;
      var reserva = temBase ? RESERVA_MESES_DE_CUSTO * -media : null;
      var caixa = posicaoNoMes(dadosCaixa, m).livre;
      var excedente = temBase ? Math.max(0, caixa - reserva) : null;
      var mutuo = Math.max(0, saldoMutuo(m));
      var porSecao = {};
      RESERVA_SECOES_DE_CUSTO.forEach(function (sec) { porSecao[sec[0]] = (dadosCaixa.S[sec[0]] || {})[m] || 0; });
      porMes[m] = {
        fechado: m < mesAtual,
        custo: custoDoMes(m), porSecao: porSecao,
        mesesNaMedia: base, media: media, reserva: reserva, caixa: caixa,
        excedente: excedente, mutuo: mutuo,
        excedenteLiquido: temBase ? Math.max(0, excedente - mutuo) : null,
        cobertura: temBase ? caixa / -media : null,
        reservaOk: temBase && caixa >= reserva,
        burn: burnDoMes(m),
        burnMedio: base.length ? base.reduce(function (t, f) { return t + burnDoMes(f); }, 0) / base.length : null
      };
    });

    /* Art. 26, par. 1o, (ii): titulos a pagar em aberto com vencimento   */
    /* anterior a hoje.                                                  */
    var vencidas = (abertos || []).filter(function (l) {
      return l.tipo === "pagar" && l.vencimento && vencimentoEfetivoTexto(l.vencimento) < hojeTexto && !ehPrevisaoOS(l);
    }).map(function (l) {
      return { vencimento: l.vencimento, categoria: l.categoria, contraparte: l.contraparte || "",
        documento: l.documento || "", valor: Number(l.valor_aberto || l.valor_titulo || 0) };
    }).sort(function (a, b) { return a.vencimento < b.vencimento ? -1 : 1; });

    /* Runway de hoje (estimativas). Liquido: caixa / |burn medio|, so se ha */
    /* queima. O "sem receita" e a propria cobertura (caixa / |custo medio|),*/
    /* por isso nao tem cartao proprio: a data limite sai da cobertura.     */
    var hj = porMes[mesAtual];
    var runway = { liquido: null, semQueima: false, semReceita: null, dataLimite: null };
    if (hj) {
      if (hj.burnMedio !== null && hj.burnMedio >= 0) runway.semQueima = true;
      else if (hj.burnMedio !== null) runway.liquido = hj.caixa / -hj.burnMedio;
      runway.semReceita = hj.cobertura;
      if (runway.semReceita !== null) {
        var meses_ = Math.max(0, runway.semReceita);
        var inteiros = Math.floor(meses_);
        var limite = new Date(hoje.getFullYear(), hoje.getMonth() + inteiros, hoje.getDate());
        limite.setDate(limite.getDate() + Math.round((meses_ - inteiros) * 30.44));
        runway.dataLimite = limite;
      }
    }

    return {
      runway: runway,
      meses: meses, mesAtual: mesAtual, porMes: porMes, hoje: porMes[mesAtual],
      lancamentosMutuo: lancamentosMutuo, vencidas: vencidas,
      totalVencidas: vencidas.reduce(function (t, v) { return t + v.valor; }, 0),
      recompras: RECOMPRAS_EM_CURSO
    };
  }

  function normalizarLinha(linha, indice) {
    var contraparte = resolverContraparte(linha);
    var idEstavel = linha.id || (linha.id_movimento ? "M" + linha.id_movimento : "L" + indice);

      id: idEstavel,
      idTitulo: linha.id || "",

      codigoGrupo: linha.codigo_grupo || "",

      /* (tipo_conta_corrente): CC conta corrente, CX caixa, CR cartao de */

      contaCodigo: String(linha.conta_codigo || ""),

      situacao: linha.situacao,

  }

  /* 10-A. TELA DE LOGIN                                                 */

  function TelaLogin(props) {

  /* Faixa no topo quando a sessao venceu e o Google nao renovou sozinho: */
  /* o painel continua na tela, com os dados ja carregados, e um clique   */

  function AvisoSessao(props) {

      }).catch(function () {});

    function buscarBase(forcar, tokenUsado, jaRenovou) {

            { col: 1, v: l.valor >= 0 ? "1. Contas a Receber" : "2. Contas a Pagar", s: MAPA_ESTILOS.bd[0] },
            { col: 2, v: l.grupo, s: MAPA_ESTILOS.bd[0] },
            { col: 3, v: l.categoria, s: MAPA_ESTILOS.bd[0] },
            { col: 4, v: l.conta, s: MAPA_ESTILOS.bd[0] },
            { col: 5, v: l.situacao, s: MAPA_ESTILOS.bd[0] },
            { col: 6, v: l.contraparte, s: MAPA_ESTILOS.bd[0] },
            { col: 7, v: l.dEmi ? dataParaSerial(l.dEmi) : "", s: 17 },
            { col: 8, v: l.dPag ? dataParaSerial(l.dPag) : "", s: 17 },
            { col: 9, v: l.valor, s: MAPA_ESTILOS.bd[1] },
            { col: 10, v: l.nota, s: MAPA_ESTILOS.bd[0] },
            { col: 11, v: (l.dEmi || l.dPag) ? dataParaSerial(l.dEmi || l.dPag) : "", s: 17 }
          ]
        });
      });

      /* Fragmentos de formula reutilizados nas duas abas de cima. */
      var ultimaLinhaBase = lancamentos.length + 1;
      var BASE = "'BD Contas'";
      /* Em competencia a formula aponta para a coluna K, que ja tem o     */
      /* fallback para data de pagamento quando nao ha nota fiscal — a      */
      /* mesma regra usada na tela. Sem isso, o XLSX exportado subestimaria */
      /* despesas sem nota fiscal, mesmo com a tela mostrando o valor certo.*/
      var COL_DATA = campoData === "dPag" ? "$H" : "$K";
      var FAIXA_VALOR = BASE + "!$I$2:$I$" + ultimaLinhaBase;

      var criterioMes = function (colunaMes) {
        return BASE + "!" + COL_DATA + "$2:" + COL_DATA + "$" + ultimaLinhaBase + ',">="&' + colunaMes + "$3,"
             + BASE + "!" + COL_DATA + "$2:" + COL_DATA + "$" + ultimaLinhaBase + ',"<"&EDATE(' + colunaMes + "$3,1)";
      };
      /* Criterio de texto exato para SUMIFS. Sem o "=" na frente, o Excel */
      /* le o nome como operador: a categoria "<Disponível>" virava "menor */
      /* que Disponível" e somava as outras categorias do grupo (em jul/26 */
      /* contou de novo a devolucao de 8.000). * ? e ~ seriam curingas.    */
      var criterioTexto = function (texto) {
        return '"=' + String(texto).replace(/[~*?]/g, "~$&").replace(/"/g, '""') + '"';
      };
      var somaCategoria = function (grupo, categoria, colunaMes) {
        return "SUMIFS(" + FAIXA_VALOR
          + "," + BASE + "!$B$2:$B$" + ultimaLinhaBase + "," + criterioTexto(grupo)
          + "," + BASE + "!$C$2:$C$" + ultimaLinhaBase + "," + criterioTexto(categoria)
          + "," + criterioMes(colunaMes) + ")";
      };
      var saldoAcumuladoConta = function (conta, colunaMes) {
        return "SUMIFS(" + FAIXA_VALOR
          + "," + BASE + "!$D$2:$D$" + ultimaLinhaBase + "," + criterioTexto(conta)
          + "," + BASE + "!" + COL_DATA + "$2:" + COL_DATA + "$" + ultimaLinhaBase
          + ',"<"&EDATE(' + colunaMes + "$3,1))";
      };

      var largurasColunas = [3, 3, 52].concat(meses.map(function () { return 14; }), [15]);

      /* ---------------- Aba 1: Quorum Novo ---------------- */

      var abaQuorum = {
        nome: "Quorum Novo",
        cols: largurasColunas,
        linhas: [],
        freeze: { x: 3, y: 3 },
        niveis: 1
      };
      var linhaAtual = 1;

      /* Escreve uma linha de rotulo mais uma formula por mes. Devolve o numero da linha. */
      function escreverLinha(nivel, rotulo, formulaPorColuna, outline) {
        var estilo = MAPA_ESTILOS[nivel] || MAPA_ESTILOS.item;
        var celulas = [{ col: 3, v: rotulo, s: estilo[0] }];
        for (var i = 0; i < qtdMeses; i++) {
          celulas.push({
            col: COL_PRIMEIRO_MES + i,
            f: formulaPorColuna ? formulaPorColuna(col(COL_PRIMEIRO_MES + i)) : undefined,
            s: estilo[1]
          });
        }
        celulas.push({
          col: COL_ACUMULADO,
          f: formulaPorColuna
            ? (nivel === "pct"
                ? formulaPorColuna(col(COL_ACUMULADO))
                : "SUM(" + col(COL_PRIMEIRO_MES) + linhaAtual + ":" + col(COL_ACUMULADO - 1) + linhaAtual + ")")
            : undefined,
          s: estilo[1]
        });
        abaQuorum.linhas.push({ r: linhaAtual, celulas: celulas, outline: outline || 0 });
        return linhaAtual++;
      }

      /* Linha fina de separacao. Cada grupo ja termina com uma; se a      */
      /* linha anterior ja e fina, nao poe outra (nunca duas seguidas).     */
      function linhaVazia() {
        var anterior = abaQuorum.linhas.filter(function (l) { return l.r === linhaAtual - 1; })[0];
        if (anterior && anterior.altura === 3) return;
        abaQuorum.linhas.push({ r: linhaAtual, celulas: [], altura: 3 });
        linhaAtual++;
      }

      abaQuorum.linhas.push({
        r: 1,
        celulas: [{
          col: 3,
          v: "QUORUM | Realizado por categoria — regime de "
            + (campoData === "dPag" ? "caixa" : "competência")
            + " — gerado em " + (resposta ? resposta.gerado_em : ""),
          s: 13
        }]
      });

      linhaAtual = 2;
      abaQuorum.linhas.push({
        r: 2,
        celulas: [{ col: 3, v: "", s: 0 }].concat(meses.map(function (mes, i) {
          return { col: COL_PRIMEIRO_MES + i, v: i + 1, s: 15 };
        }))
      });

      abaQuorum.linhas.push({
        r: 3,
        celulas: [{ col: 3, v: "Realizado Quorum", s: MAPA_ESTILOS.cabLabel[0] }]
          .concat(meses.map(function (mes, i) {
            var partes = mes.split("-");
            return {
              col: COL_PRIMEIRO_MES + i,
              v: dataParaSerial(new Date(Number(partes[0]), Number(partes[1]) - 1, 1)),
              s: MAPA_ESTILOS.cabLabel[1]
            };
          }))
          .concat([{ col: COL_ACUMULADO, v: "Acumulado", s: MAPA_ESTILOS.cabLabel[0] }])
      });

      abaQuorum.linhas.push({ r: 4, celulas: [], altura: 3 });
      linhaAtual = 5;

      /* Escreve uma secao inteira: itens, grupos e o total da secao. */
      var linhaDaSecao = {};
      function escreverSecao(secao) {
        var linhaTotalSecao = linhaAtual++;
        var linhasDeGrupo = [];

        secao.groups.forEach(function (nomeGrupo) {
          var bloco = PLANO_DE_CONTAS.filter(function (b) { return b.grupo === nomeGrupo; })[0];
          if (!bloco) return;

          var linhaGrupo = linhaAtual++;
          var linhasDeItem = [];

          bloco.itens.forEach(function (item) {
            var categoria = item[0];
            linhasDeItem.push(escreverLinha("item", "      " + categoria, function (colunaMes) {
              return somaCategoria(nomeGrupo, categoria, colunaMes);
            }, 1));
          });

          abaQuorum.linhas.push({
            r: linhaGrupo,
            celulas: [{ col: 3, v: "   " + nomeGrupo, s: MAPA_ESTILOS.grupo[0] }]
              .concat(Array.from({ length: qtdMeses + 1 }, function (vazio, i) {
                var letra = col(COL_PRIMEIRO_MES + i);
                return {
                  col: COL_PRIMEIRO_MES + i,
                  f: "SUM(" + letra + linhasDeItem[0] + ":" + letra + linhasDeItem[linhasDeItem.length - 1] + ")",
                  s: MAPA_ESTILOS.grupo[1]
                };
              }))
          });

          linhasDeGrupo.push(linhaGrupo);
          abaQuorum.linhas.push({ r: linhaAtual, celulas: [], altura: 3 });
          linhaAtual++;
        });

        abaQuorum.linhas.push({
          r: linhaTotalSecao,
          celulas: [{ col: 3, v: secao.label, s: MAPA_ESTILOS.secao[0] }]
            .concat(Array.from({ length: qtdMeses + 1 }, function (vazio, i) {
              var letra = col(COL_PRIMEIRO_MES + i);
              return {
                col: COL_PRIMEIRO_MES + i,
                f: linhasDeGrupo.map(function (n) { return letra + n; }).join("+"),
                s: MAPA_ESTILOS.secao[1]
              };
            }))
        });

        linhaDaSecao[secao.key] = linhaTotalSecao;
      }

      escreverSecao(dados.secoesDre[0]);
      linhaVazia();
      escreverSecao(dados.secoesDre[1]);

      var linhaReceitaLiquida = escreverLinha("total", "(=) Receita Líquida", function (c) {
        return c + linhaDaSecao.receita + "+" + c + linhaDaSecao.impostos;
      });
      escreverLinha("pct", "% Receita Líquida", function (c) {
        return "IFERROR(" + c + linhaReceitaLiquida + "/" + c + linhaDaSecao.receita + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[2]);

      var linhaLucroBruto = escreverLinha("total", "(=) Lucro Bruto", function (c) {
        return c + linhaReceitaLiquida + "+" + c + linhaDaSecao.custo;
      });
      escreverLinha("pct", "% Lucro Bruto", function (c) {
        return "IFERROR(" + c + linhaLucroBruto + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[3]);

      var linhaEbitda = escreverLinha("total", "(=) EBITDA", function (c) {
        return c + linhaLucroBruto + "+" + c + linhaDaSecao.despesas;
      });
      escreverLinha("pct", "% EBITDA", function (c) {
        return "IFERROR(" + c + linhaEbitda + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[4]);
      escreverSecao(dados.secoesDre[5]);
      escreverSecao(dados.secoesDre[6]);
      escreverSecao(dados.secoesDre[7]);
      linhaVazia();

      var linhaEbit = escreverLinha("total", "(=) Resultado Antes de Impostos", function (c) {
        return c + linhaEbitda + "+" + c + linhaDaSecao.finRec + "+" + c + linhaDaSecao.finDesp
          + "+" + c + linhaDaSecao.outrasRec + "+" + c + linhaDaSecao.outrasDesp;
      });
      escreverLinha("pct", "% EBIT", function (c) {
        return "IFERROR(" + c + linhaEbit + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[8]);

      var linhaLucroLiquido = escreverLinha("total", "(=) Lucro Líquido", function (c) {
        return c + linhaEbit + "+" + c + linhaDaSecao.impLucro;
      });

      var linhaResultadoAcumulado = linhaAtual++;
      abaQuorum.linhas.push({
        r: linhaResultadoAcumulado,
        celulas: [{ col: 3, v: "(=) Resultado Acumulado", s: MAPA_ESTILOS.secao[0] }]
          .concat(meses.map(function (mes, i) {
            var letra = col(COL_PRIMEIRO_MES + i);
            return {
              col: COL_PRIMEIRO_MES + i,
              f: i === 0
                ? letra + linhaLucroLiquido
                : col(COL_PRIMEIRO_MES + i - 1) + linhaResultadoAcumulado + "+" + letra + linhaLucroLiquido,
              s: MAPA_ESTILOS.secao[1]
            };
          }))
          .concat([{
            col: COL_ACUMULADO,
            f: col(COL_ACUMULADO - 1) + linhaResultadoAcumulado,
            s: MAPA_ESTILOS.secao[1]
          }])
      });

      escreverLinha("pct", "% Lucro Líquido", function (c) {
        return "IFERROR(" + c + linhaLucroLiquido + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();

      abaQuorum.linhas.push({ r: linhaAtual++, celulas: [{ col: 3, v: "Fluxo de Caixa", s: 9 }] });
      linhaVazia();

      var linhaLucroNoFluxo = escreverLinha("secao", "(=) Lucro Líquido do período", function (c) {
        return c + linhaLucroLiquido;
      });
      linhaVazia();
      dados.secoesFluxo.forEach(function (secao) { escreverSecao(secao); });
      /* "Nao classificado" costuma vir sem grupo e, sem grupo, nao termina */
      /* em linha fina: sem esta, o Fluxo de Caixa Livre colava nela.       */
      linhaVazia();

      var linhaFcl = escreverLinha("total", "(=) Fluxo de Caixa Livre do mês", function (c) {
        return c + linhaLucroNoFluxo + "+" + c + linhaDaSecao.entradas + "+" + c + linhaDaSecao.saidas
          + "+" + c + linhaDaSecao.ativo + "+" + c + linhaDaSecao.capex + "+" + c + linhaDaSecao.transf;
      });

      var linhaSaldoAcumulado = linhaAtual++;
      abaQuorum.linhas.push({
        r: linhaSaldoAcumulado,
        celulas: [{ col: 3, v: "(=) Saldo acumulado, todas as contas", s: MAPA_ESTILOS.secao[0] }]
          .concat(meses.map(function (mes, i) {
            var letra = col(COL_PRIMEIRO_MES + i);
            return {
              col: COL_PRIMEIRO_MES + i,
              f: i === 0
                ? letra + linhaFcl
                : col(COL_PRIMEIRO_MES + i - 1) + linhaSaldoAcumulado + "+" + letra + linhaFcl,
              s: MAPA_ESTILOS.secao[1]
            };
          }))
          .concat([{
            col: COL_ACUMULADO,
            f: col(COL_ACUMULADO - 1) + linhaSaldoAcumulado,
            s: MAPA_ESTILOS.secao[1]
          }])
      });

      /* Posicao no fim do mes por tipo de conta, mesma regra da tela      */
      /* (posicaoNoMes): CA aplicacao, CV caucao, CR cartao, o resto conta */
      /* corrente. Cada linha soma o saldo acumulado das contas do grupo.  */
      var somaContasNoMes = function (contas, c) {
        return contas.length
          ? "(" + contas.map(function (conta) { return saldoAcumuladoConta(conta, c); }).join("+") + ")"
          : "0";
      };
      var contasGarantia = contasDoTipo(dados, ["CV"]);
      var linhaCorrente = escreverLinha("grupo", "   Conta corrente", function (c) {
        return somaContasNoMes(contasCorrentes(dados), c);
      });
      var linhaAplicacoes = escreverLinha("grupo", "   (+) Aplicações", function (c) {
        return somaContasNoMes(contasDoTipo(dados, ["CA"]), c);
      });
      var linhaCaucaoEntra = escreverLinha("grupo", "   (+) Caução travada em garantia", function (c) {
        return somaContasNoMes(contasGarantia, c);
      });
      var linhaCaixaTotal = escreverLinha("total", "(=) Caixa total", function (c) {
        return c + linhaCorrente + "+" + c + linhaAplicacoes + "+" + c + linhaCaucaoEntra;
      });
      var linhaCaucao = escreverLinha("grupo", "   (-) Caução travada em garantia", function (c) {
        return "-" + c + linhaCaucaoEntra;
      });
      var linhaFatura = escreverLinha("grupo", "   (-) Fatura de cartão em aberto", function (c) {
        return somaContasNoMes(contasDoTipo(dados, ["CR"]), c);
      });
      var linhaCaixaLivre = escreverLinha("total", "(=) Caixa livre", function (c) {
        return c + linhaCaixaTotal + "+" + c + linhaCaucao + "+" + c + linhaFatura;
      });

      /* Nestas linhas o acumulado e a posicao do ultimo mes, nao a soma dos meses. */
      [linhaCorrente, linhaAplicacoes, linhaCaucaoEntra, linhaCaixaTotal, linhaCaucao, linhaFatura, linhaCaixaLivre].forEach(function (numeroLinha) {
        var linha = abaQuorum.linhas.filter(function (l) { return l.r === numeroLinha; })[0];
        linha.celulas[linha.celulas.length - 1].f = col(COL_ACUMULADO - 1) + numeroLinha;
      });

      linhaVazia();
      abaQuorum.linhas.push({
        r: linhaAtual++,
        celulas: [{
          col: 3,
          v: "Toda célula deste bloco é fórmula sobre a aba BD Contas. Cada conta entra pelo tipo cadastrado na Omie: conta corrente (CC, CX), aplicações (CA), caução (CV) e fatura de cartão (CR). Caixa total = saldo acumulado de todas as contas sem a fatura do cartão; caixa livre = caixa total menos caução e fatura.",
          s: 13
        }]
      });

      var nomeArquivo = "QUORUM_Realizado_"
        + (campoData === "dPag" ? "caixa" : "competencia") + ".xlsx";
      baixarXlsx([abaQuorum, abaBase], nomeArquivo);
    }

    /* ---------------------------------------------------------------- */
    /* Derivados da tela                                                */
    /* ---------------------------------------------------------------- */

    /* Achados da tela: os do calculo (lancamentos pagos) mais os que vem  */
    /* dos titulos em aberto. Previsao de OS com vencimento passado nao e   */
    /* vencido em aberto: vira este alerta (regra de Alex, 21/10/2026).     */
    var achadosTela = useMemo(function () {
      if (!dados) return [];
      var hojeTexto = textoData(dataSemHora(new Date()));
      var previsoesVencidas = (emAberto || []).filter(function (l) {
        return ehPrevisaoOS(l) && l.vencimento && vencimentoEfetivoTexto(l.vencimento) < hojeTexto;
      });
      var extras = [];
      if (previsoesVencidas.length) {
        extras.push({
          nivel: "alerta",
          severidade: "média",
          titulo: "OS não faturada com vencimento passado",
          detalhe: previsoesVencidas.length + " previsão(ões) de faturamento de OS com vencimento antes de hoje, somando "
            + formatarNumero(previsoesVencidas.reduce(function (t, l) { return t + Number(l.valor_titulo || 0); }, 0), 2) + ": "
            + previsoesVencidas.map(function (l) {
              return (l.contraparte || "sem contraparte") + " (vencimento " + rotuloVencimento(l.vencimento, true) + ", " + formatarNumero(Number(l.valor_titulo || 0), 2) + ")";
            }).join("; ") + ". Fature a OS na Omie ou ajuste a previsão."
        });
      }
      return ordenarAchados(dados.achados.concat(extras));
    }, [dados, emAberto]);
    var erros = achadosTela.filter(function (a) { return a.nivel === "erro"; });
    var alertas = achadosTela.filter(function (a) { return a.nivel === "alerta"; });
    var ultimoMes = dados && dados.meses.length ? dados.meses[dados.meses.length - 1] : null;

    /* Posicao de caixa no ultimo mes, separando conta, cartao e caucao. */
    var posicao = useMemo(function () {
      if (!dados || !ultimoMes) return null;
      return posicaoNoMes(dados, ultimoMes);
    }, [dados, ultimoMes]);

    /* Sem sessao confirmada pelo n8n, mostra a tela de login. */
    if (!token || !usuario) {
      return h(TelaLogin, {
        erro: erroLogin,
        entrando: !!token && entrando,
        aoEntrar: function (credencial) { setErroLogin(""); setToken(credencial); }
      });
    }

    /* Primeira carga. */
    if (carregando && !dados) {
      return h("div", {
        className: "min-h-screen w-full flex items-center justify-center",
        style: { background: COR.bg, color: COR.faint, fontSize: 12 }
      }, "Atualizando Dashboard Financeiro QUORUM");
    }

    /* Falha na busca. */
    if (!dados) {
      return h("div", {
        className: "min-h-screen w-full flex items-center justify-center p-6",
        style: { background: COR.bg, color: COR.text }
      },
        h("div", { className: "max-w-xl w-full" },
          h("div", {
            className: "uppercase mb-2",
            style: { fontSize: 10, letterSpacing: "0.3em", color: COR.brass }
          }, "QUORUM"),
          h("h1", {
            className: "text-3xl mb-3",
            style: { fontWeight: 300, letterSpacing: "-0.01em" }
          }, "Dashboard Financeiro QUORUM"),
          h("p", {
            className: "text-sm leading-relaxed mb-6",
            style: { color: COR.dim }
          }, "Não consegui buscar a base agora."),
          aviso && h("div", {
            className: "mt-2 mb-4 text-sm p-3 rounded",
            style: { background: COR.coralSoft, color: COR.coral }
          }, aviso),
          h("button", {
            onClick: buscarBase,
            className: "w-full py-4 rounded text-sm",
            style: { background: COR.surface, border: "1px dashed " + COR.brass, color: COR.brass }
          }, "Tentar de novo")
        )
      );
    }

    /* todosMeses e a base inteira, sem filtro: usado pelo LTM (que        */
    /* precisa olhar pra tras alem do que esta selecionado na tela) e pelo */
    /* proprio painel de selecao (que precisa listar tudo que existe).     */
    var todosMeses = dados.meses;
    var meses = mesesSelecionados
      ? todosMeses.filter(function (mes) { return mesesSelecionados.indexOf(mes) >= 0; })
      : todosMeses;

    /* Uma linha "tem valor" se qualquer mes for diferente de zero. */
    function temValor(valores) {
      return meses.some(function (mes) { return Math.abs(valores[mes] || 0) > 0.005; });
    }

    /* Devolve o handler que abre a gaveta com um filtro pronto. */
    function abrirGaveta(titulo, filtro) {
      return function (mes) {
        setGaveta(Object.assign({}, filtro, { titulo: titulo, mes: mes, campo: campoData }));
      };
    }

    var LARGURA_PRIMEIRA_COLUNA = 34;
    var larguraColunaMes = (100 - LARGURA_PRIMEIRA_COLUNA) / (meses.length + 1);
    var larguraMinimaTabela = 380 + (meses.length + 1) * 100;

    /* Moldura padrao das tabelas mensais. */
    function Tabela(props) {
      return h("div", {
        className: "overflow-x-auto rounded",
        style: { border: "1px solid " + COR.line, background: COR.surface }
      },
        h("table", {
          style: {
            borderCollapse: "collapse",
            tableLayout: "fixed",
            width: "100%",
            minWidth: larguraMinimaTabela
          }
        },
          h("colgroup", null,
            h("col", { style: { width: LARGURA_PRIMEIRA_COLUNA + "%" } }),
            meses.map(function (mes) {
              return h("col", { key: mes, style: { width: larguraColunaMes + "%" } });
            }),
            h("col", { style: { width: larguraColunaMes + "%" } })
          ),
          h(CabecalhoMeses, { meses: meses }),
          h("tbody", null, props.children)
        )
      );
    }

    /* Secao do DRE: linha de total, e opcionalmente grupos e categorias. */
    function linhasDaSecao(secao) {
      var linhasRender = [h(LinhaTabela, {
        key: secao.key,
        label: secao.label,
        valores: dados.S[secao.key],
        meses: meses,
        nivel: "secao",
        aoAbrir: abrirGaveta(secao.label, { grupos: secao.groups })

    function abaDimensao() {
      var agrupado = aba === "proj" ? dados.porProjeto : dados.porCentro;
