<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Financeiro QUORUM</title>
  <link rel="icon" href="favicon.ico" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<script>
  window.__QUORUM_API__ = "https://alexarmstrongs.app.n8n.cloud/webhook/painel-base";
</script>
<script>
/* ==========================================================================
   Dashboard Financeiro QUORUM
   Codigo legivel, sem build step. React via CDN, elementos criados com o
   helper h() no lugar de JSX. Nenhuma regra de calculo foi alterada em
   relacao a versao anterior: isto e traducao de forma, nao reescrita.
   ========================================================================== */
(function () {
  "use strict";

  var React = window.React;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useMemo = React.useMemo;
  var useRef = React.useRef;
  var Fragment = React.Fragment;

  /* Cria elemento React. h(tipo, props, filho, filho, ...) */
  function h(tipo, props) {
    var filhos = Array.prototype.slice.call(arguments, 2);
    return React.createElement.apply(React, [tipo, props].concat(filhos));
  }

  /* ------------------------------------------------------------------ */
  /* 1. PALETA                                                           */
  /* ------------------------------------------------------------------ */

  var COR = {
    bg: "#EEF1F5",
    surface: "#FFFFFF",
    surfaceAlt: "#E3E8EF",
    line: "#CBD3DE",
    lineSoft: "#E1E6ED",
    text: "#1B2230",
    dim: "#4E586B",
    faint: "#7A8598",
    brass: "#8A6A16",
    brassSoft: "rgba(138,106,22,0.10)",
    mint: "#0D7A52",
    mintSoft: "rgba(13,122,82,0.10)",
    coral: "#B23A2F",
    coralSoft: "rgba(178,58,47,0.10)",
    ink: "#D8DEE7"
  };

  /* ------------------------------------------------------------------ */
  /* 2. PLANO DE CONTAS                                                  */
  /* Nao existe plano fixo neste arquivo, de proposito. O catalogo chega  */
  /* da Omie a cada carga, no campo "categorias" da base, e e a unica     */
  /* fonte de verdade sobre quais categorias existem, como se chamam e    */
  /* quais estao inativas. Uma lista fixa aqui seria um retrato congelado */
  /* no dia em que foi escrita: foi assim que uma categoria renomeada na  */
  /* Omie continuou aparecendo com o nome antigo e, pior, saiu calada da  */
  /* conciliacao de caixa.                                               */
  /* ------------------------------------------------------------------ */

  var SEM_GRUPO = "Sem grupo";

  var PLANO_DE_CONTAS = [];        /* [{ codigo, grupo, itens: [[nome, ativa, codigo]] }] */
  var CHAVES_DO_PLANO = new Map(); /* "grupo||categoria" -> true */
  var CODIGO_DO_GRUPO = new Map(); /* nome do grupo -> codigo do grupo */
  var NOME_DA_CATEGORIA = new Map(); /* codigo da categoria -> nome */

  /* ------------------------------------------------------------------ */
  /* 3. SECOES DO DRE E DO FLUXO DE CAIXA                                */
  /* Quais categorias existem e o nome delas e fato, vem da Omie. Em que  */
  /* linha do resultado cada grupo entra e decisao gerencial nossa, e por */
  /* isso mora aqui. O vinculo e feito pelo CODIGO do grupo, nunca pelo   */
  /* nome: codigo e estavel, nome muda quando alguem renomeia na Omie.    */
  /* Grupo que nao esteja neste mapa nao some: cai em "Nao classificado", */
  /* visivel no fluxo, pedindo classificacao.                            */
  /* ------------------------------------------------------------------ */

  var SECAO_POR_CODIGO_GRUPO = {
    "1.01": "receita",   "1.02": "receita",   "1.03": "receita",
    "1.04": "receita",   "1.05": "receita",   "1.06": "receita",
    "1.07": "receita",
    "1.08": "finRec",
    "1.09": "outrasRec", "1.10": "outrasRec",
    "2.01": "custo",     "2.02": "custo",     "2.03": "custo",
    "2.04": "custo",     "2.05": "custo",     "2.06": "custo",
    "2.07": "custo",
    "2.08": "despesas",  "2.09": "despesas",  "2.10": "despesas",
    "2.11": "despesas",  "2.12": "despesas",
    "2.13": "finDesp",
    "2.14": "impostos",
    "2.15": "impLucro",
    "2.20": "outrasDesp",
    "1.11": "entradas",
    "2.16": "saidas",    "2.17": "saidas",
    "2.18": "ativo",
    "2.19": "capex",
    "0.01": "transf"
  };

  var SECOES_DRE = [
    { key: "receita", label: "Receita Bruta", sign: 1, groups: [] },
    { key: "impostos", label: "Impostos e Deduções", sign: -1, groups: [] },
    { key: "custo", label: "Custo dos Serviços Prestados", sign: -1, groups: [] },
    { key: "despesas", label: "Despesas Fixas", sign: -1, groups: [] },
    { key: "finRec", label: "Receitas Financeiras", sign: 1, groups: [] },
    { key: "finDesp", label: "Despesas Financeiras", sign: -1, groups: [] },
    { key: "outrasRec", label: "Outras Receitas e Não Operacional", sign: 1, groups: [] },
    { key: "outrasDesp", label: "Resultado Não Operacional (Despesas)", sign: -1, groups: [] },
    { key: "impLucro", label: "Impostos sobre o Lucro", sign: -1, groups: [] }
  ];

  var SECOES_FLUXO = [
    { key: "entradas", label: "Entradas Não Operacionais", sign: 1, groups: [] },
    { key: "saidas", label: "Saídas Não Operacionais", sign: -1, groups: [] },
    { key: "ativo", label: "Movimentação do Ativo", sign: -1, groups: [] },
    { key: "capex", label: "Investimentos", sign: -1, groups: [] },
    { key: "transf", label: "Transferências entre Contas", sign: 1, groups: [] },
    { key: "naoClassificado", label: "Não classificado", sign: 1, groups: [] }
  ];

  var TODAS_AS_SECOES = SECOES_DRE.concat(SECOES_FLUXO);

  var SECAO_POR_CHAVE = (function () {
    var mapa = {};
    TODAS_AS_SECOES.forEach(function (s) { mapa[s.key] = s; });
    return mapa;
  })();

  var GRUPOS_DE_RESULTADO = [];

  /* Le o catalogo que veio da Omie e remonta plano de contas e secoes.   */
  /* Chamado a cada carga da base, antes de qualquer calculo.             */
  function aplicarCatalogo(categorias) {
    var lista = Array.isArray(categorias) ? categorias : [];
    var porCodigo = new Map();
    lista.forEach(function (c) {
      if (c && c.codigo) porCodigo.set(String(c.codigo), c);
    });

    /* Na Omie, categoria totalizadora e o grupo; as folhas sao os itens. */
    var blocos = new Map();
    function bloco(codigoGrupo) {
      var chave = String(codigoGrupo || "");
      if (!blocos.has(chave)) {
        var reg = porCodigo.get(chave);
        blocos.set(chave, {
          codigo: chave,
          grupo: (reg && reg.nome) ? reg.nome : (chave ? "[grupo " + chave + "]" : SEM_GRUPO),
          itens: []
        });
      }
      return blocos.get(chave);
    }

    NOME_DA_CATEGORIA = new Map();
    lista.forEach(function (c) {
      if (!c || !c.codigo) return;
      NOME_DA_CATEGORIA.set(String(c.codigo), c.nome);
      if (c.totalizadora) return;
      bloco(c.pai).itens.push([c.nome, !c.inativa, String(c.codigo)]);
    });

    PLANO_DE_CONTAS = Array.from(blocos.values()).filter(function (b) {
      return b.itens.length;
    });

    CHAVES_DO_PLANO = new Map();
    CODIGO_DO_GRUPO = new Map();
    PLANO_DE_CONTAS.forEach(function (b) {
      CODIGO_DO_GRUPO.set(b.grupo, b.codigo);
      b.itens.forEach(function (item) {
        CHAVES_DO_PLANO.set(b.grupo + "||" + item[0], true);
      });
    });

    TODAS_AS_SECOES.forEach(function (s) { s.groups = []; });
    PLANO_DE_CONTAS.forEach(function (b) {
      var secao = SECAO_POR_CHAVE[SECAO_POR_CODIGO_GRUPO[b.codigo] || "naoClassificado"];
      if (secao) secao.groups.push(b.grupo);
    });

    GRUPOS_DE_RESULTADO = SECOES_DRE.reduce(function (acc, s) {
      return acc.concat(s.groups);
    }, []);
  }

  /* Secao a que um lancamento pertence. Vale a mesma regra do catalogo:  */
  /* decide pelo codigo do grupo; sem codigo conhecido, "Nao             */
  /* classificado", que existe justamente para que nada saia da conta.    */
  function secaoDaLinha(linha) {
    var codigo = linha.codigoGrupo
      || CODIGO_DO_GRUPO.get(linha.grupo)
      || "";
    return SECAO_POR_CODIGO_GRUPO[codigo] || "naoClassificado";
  }

  var MESES_ABREV = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

  /* ------------------------------------------------------------------ */
  /* 4. FORMATACAO E CONVERSAO                                           */
  /* ------------------------------------------------------------------ */

  /* Data -> "2026-08". Devolve null se nao for data valida. */
  function chaveMes(data) {
    if (!(data instanceof Date) || isNaN(data)) return null;
    return data.getFullYear() + "-" + String(data.getMonth() + 1).padStart(2, "0");
  }

  /* "2026-08" -> "ago/26" */
  function rotuloMes(chave) {
    var partes = chave.split("-");
    return MESES_ABREV[Number(partes[1]) - 1] + "/" + partes[0].slice(2);
  }

  /* Numero no padrao do painel: negativo entre parenteses, zero vira traco. */
  function formatarNumero(valor, casas) {
    if (valor == null || isNaN(valor)) return "-";
    var numero = Number(valor);
    if (Math.abs(numero) < 0.005) return "-";
    var texto = Math.abs(numero).toLocaleString("pt-BR", {
      minimumFractionDigits: casas === undefined ? 0 : casas,
      maximumFractionDigits: casas === undefined ? 0 : casas
    });
    return numero < 0 ? "(" + texto + ")" : texto;
  }

  function formatarPercentual(fracao) {
    if (fracao === null || !isFinite(fracao) || Math.abs(fracao) < 0.00005) return "-";
    return (fracao * 100).toLocaleString("pt-BR", {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    }) + "%";
  }

  /* Aceita Date, serial de Excel ou texto em ISO e em dd/mm/aaaa. */
  function paraData(valor) {
    if (valor instanceof Date) {
      if (isNaN(valor)) return null;
      var meiaNoiteUTC = valor.getUTCHours() === 0 && valor.getUTCMinutes() === 0 && valor.getUTCSeconds() === 0;
      return meiaNoiteUTC
        ? new Date(valor.getUTCFullYear(), valor.getUTCMonth(), valor.getUTCDate())
        : new Date(valor.getFullYear(), valor.getMonth(), valor.getDate());
    }
    if (typeof valor === "number") {
      var convertida = new Date(Math.round((valor - 25569) * 86400 * 1000));
      if (isNaN(convertida)) return null;
      return new Date(convertida.getUTCFullYear(), convertida.getUTCMonth(), convertida.getUTCDate());
    }
    if (typeof valor === "string") {
      var texto = valor.trim();
      if (!texto || texto === "N/D") return null;
      var iso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      var br = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (br) {
        var primeiro = Number(br[1]);
        var segundo = Number(br[2]);
        var dia = primeiro;
        var mes = primeiro > 12 ? segundo : (segundo > 12 ? primeiro : segundo);
        return new Date(Number(br[3]), mes - 1, dia);
      }
    }
    return null;
  }

  /* Aceita numero ou texto no padrao brasileiro, inclusive com R$. */
  function paraNumero(valor) {
    if (typeof valor === "number") return valor;
    if (typeof valor === "string") {
      var texto = valor.trim().replace(/\s|R\$/g, "");
      if (!texto) return 0;
      if (texto.indexOf(",") >= 0) {
        texto = texto.replace(/\./g, "").replace(",", ".");
      }
      texto = texto.replace(/[^\d.\-]/g, "");
      var numero = Number(texto);
      return isNaN(numero) ? 0 : numero;
    }
    return 0;
  }

  /* ------------------------------------------------------------------ */
  /* 5. CONTRAPARTE POR NATUREZA                                         */
  /* Lancamentos sem fornecedor cadastrado ganham nome pela categoria.   */
  /* ------------------------------------------------------------------ */

  /* Indexado pelo CODIGO da categoria, nao pelo nome: renomear a          */
  /* categoria na Omie nao pode fazer a contraparte sumir da tela.         */
  var CONTRAPARTE_POR_NATUREZA = {
    "2.13.97": "Omie.CASH - tarifa",
    "2.13.96": "Receita Federal - IOF",
    "1.08.97": "Omie.CASH - cashback",
    "1.08.99": "Omie.CASH - rendimento",
    "2.14.99": "Receita Federal - DAS",
    "0.01.01": "Transferência entre contas próprias",
    "0.01.02": "Transferência entre contas próprias"
  };

  /* ------------------------------------------------------------------ */
  /* 7. MOTOR DE CALCULO                                                 */
  /* Recebe as linhas normalizadas e o regime, devolve tudo o que a tela */
  /* precisa: DRE, fluxo, saldos por conta, dimensoes e achados.         */
  /* ------------------------------------------------------------------ */

  /* Ordem de exibicao dos centros de custo. Os nomes tem que bater com os */
  /* departamentos cadastrados na Omie, senao o centro cai no fim da lista */
  /* silenciosamente. "AdmeFin" e "QUORUM" estavam faltando aqui.          */
  var ORDEM_CENTROS = [
    "QUORUM", "CEO", "CFO", "QR Insights", "QR Review", "QR Advisory",
    "Comercial", "AdmeFin", "Contabilidade", "Jurídico", "Outros não listados"
  ];

  function calcular(linhas, regime) {
    var campoData = regime === "caixa" ? "dPag" : "dEmi";

    /* Data efetiva de cada linha no regime escolhido. Em competencia, um   */
    /* lancamento sem nota fiscal (uma tarifa, um PIX de aporte, uma        */
    /* cobranca de cartao) nao tem data de emissao; sem um substituto, a    */
    /* linha inteira sumiria do resultado, nao so do mes certo, distorcendo */
    /* EBITDA e Lucro Liquido. O substituto e a data de pagamento, a mesma  */
    /* logica de "sem nota, reconhece quando o dinheiro se moveu" que ja    */
    /* vale implicitamente em Caixa.                                       */
    var usaFallback = regime !== "caixa";
    linhas.forEach(function (l) {
      l.dataRegime = regime === "caixa" ? l.dPag : (l.dEmi || l.dPag);
      l.usouFallbackData = usaFallback && !l.dEmi && !!l.dPag;
    });

    var usadas = linhas.filter(function (l) { return l.dataRegime; });
    var semData = linhas.filter(function (l) { return !l.dataRegime; });

    /* A lista de meses da tela e a uniao de caixa e competencia em TODA a  */
    /* base, nao so do regime escolhido. Um lancamento sem nota fiscal (um  */
    /* aporte de socio via PIX, por exemplo) tem data de pagamento mas nao  */
    /* tem data de emissao; se a lista de meses fosse calculada so a partir */
    /* do regime ativo, um mes inteiro podia sumir da tela ao trocar entre  */
    /* Caixa e Competencia, quando deveria so mudar o valor dentro dele.    */
    var chavesMes = new Set();
    linhas.forEach(function (l) {
      if (l.dPag) chavesMes.add(chaveMes(l.dPag));
      if (l.dEmi) chavesMes.add(chaveMes(l.dEmi));
    });
    var meses = Array.from(chavesMes).sort();

    var porCategoria = new Map();  /* grupo||categoria||mes */
    var porGrupo = new Map();      /* grupo||mes */
    var porSecao = new Map();      /* secao||mes */
    var porConta = new Map();      /* conta||mes */
    var totalPorMes = new Map();   /* mes */

    /* Todo somatorio abaixo e feito varrendo os lancamentos, um por um.   */
    /* Nenhum deles consulta lista de categorias para decidir se soma ou   */
    /* nao: e isso que torna impossivel um lancamento entrar na base e     */
    /* sumir do fluxo, que era exatamente a falha que fazia o painel       */
    /* acusar "base nao fecha" quando surgia categoria nova.               */
    var gruposNaBase = new Set();
    usadas.forEach(function (l) {
      var mes = chaveMes(l.dataRegime);
      var chaveCat = l.grupo + "||" + l.categoria + "||" + mes;
      porCategoria.set(chaveCat, (porCategoria.get(chaveCat) || 0) + l.valor);
      var chaveGrupo = l.grupo + "||" + mes;
      porGrupo.set(chaveGrupo, (porGrupo.get(chaveGrupo) || 0) + l.valor);
      var chaveSecao = secaoDaLinha(l) + "||" + mes;
      porSecao.set(chaveSecao, (porSecao.get(chaveSecao) || 0) + l.valor);
      var chaveConta = l.conta + "||" + mes;
      porConta.set(chaveConta, (porConta.get(chaveConta) || 0) + l.valor);
      totalPorMes.set(mes, (totalPorMes.get(mes) || 0) + l.valor);
      gruposNaBase.add(l.grupo);
    });

    /* Valor bruto de uma categoria num mes. */
    function bruto(grupo, categoria, mes) {
      return porCategoria.get(grupo + "||" + categoria + "||" + mes) || 0;
    }

    /* Soma de um grupo num mes, direto dos lancamentos. */
    function grupoMes(grupo, mes) {
      return porGrupo.get(grupo + "||" + mes) || 0;
    }

    /* Grupos que aparecem nos lancamentos e nao vieram no catalogo da     */
    /* Omie. Devem ser raros, mas continuam somando e ficam visiveis.      */
    var secoesLocais = TODAS_AS_SECOES.map(function (s) {
      return { key: s.key, label: s.label, sign: s.sign, groups: s.groups.slice() };
    });
    var secaoLocalPorChave = {};
    secoesLocais.forEach(function (s) { secaoLocalPorChave[s.key] = s; });
    gruposNaBase.forEach(function (nomeGrupo) {
      var jaListado = secoesLocais.some(function (s) {
        return s.groups.indexOf(nomeGrupo) >= 0;
      });
      if (jaListado) return;
      var codigo = CODIGO_DO_GRUPO.get(nomeGrupo) || "";
      var chave = SECAO_POR_CODIGO_GRUPO[codigo] || "naoClassificado";
      secaoLocalPorChave[chave].groups.push(nomeGrupo);
    });

    /* Totais por secao: S[key][mes], somados linha a linha. */
    var S = {};
    secoesLocais.forEach(function (secao) {
      S[secao.key] = {};
      meses.forEach(function (mes) {
        S[secao.key][mes] = porSecao.get(secao.key + "||" + mes) || 0;
      });
    });

    /* Monta um mapa mes -> valor a partir de uma funcao. */
    function porMes(fn) {
      var mapa = {};
      meses.forEach(function (mes) { mapa[mes] = fn(mes); });
      return mapa;
    }

    var receitaLiquida = porMes(function (m) { return S.receita[m] + S.impostos[m]; });
    var lucroBruto     = porMes(function (m) { return receitaLiquida[m] + S.custo[m]; });
    var ebitda         = porMes(function (m) { return lucroBruto[m] + S.despesas[m]; });
    var resultadoFin   = porMes(function (m) { return S.finRec[m] + S.finDesp[m]; });
    var outras         = porMes(function (m) { return S.outrasRec[m] + S.outrasDesp[m]; });
    var ebit           = porMes(function (m) { return ebitda[m] + resultadoFin[m] + outras[m]; });
    var lucroLiquido   = porMes(function (m) { return ebit[m] + S.impLucro[m]; });
    /* O fluxo de caixa livre soma o resultado e todas as secoes de fluxo, */
    /* inclusive "Nao classificado". Incluir esse balde e o que garante    */
    /* que a base sempre feche: dinheiro que se moveu aparece no fluxo     */
    /* mesmo quando ainda nao sabemos em que linha ele entra.              */
    var fcl            = porMes(function (m) {
      return lucroLiquido[m] + S.entradas[m] + S.saidas[m] + S.ativo[m]
           + S.capex[m] + S.transf[m] + S.naoClassificado[m];
    });

    /* Resultado acumulado mes a mes. */
    var somaCorrida = 0;
    var acumulado = {};
    meses.forEach(function (mes) {
      somaCorrida += lucroLiquido[mes];
      acumulado[mes] = somaCorrida;
    });

    /* Movimento e saldo acumulado por conta corrente. */
    var contas = Array.from(new Set(usadas.map(function (l) { return l.conta; }))).sort();
    var movConta = {};
    var saldoConta = {};
    contas.forEach(function (conta) {
      movConta[conta] = {};
      saldoConta[conta] = {};
      var saldo = 0;
      meses.forEach(function (mes) {
        var movimento = porConta.get(conta + "||" + mes) || 0;
        movConta[conta][mes] = movimento;
        saldo += movimento;
        saldoConta[conta][mes] = saldo;
      });
    });

    /* Integridade: a soma bruta da base tem que bater com o fluxo de caixa livre. */
    var integridade = porMes(function (mes) {
      return Math.round(((totalPorMes.get(mes) || 0) - fcl[mes]) * 100) / 100;
    });

    /* Grupos que contam como receita e como saida nas visoes por dimensao, */
    /* lidos das secoes ja montadas com o catalogo desta carga.             */
    function gruposDe() {
      var chaves = Array.prototype.slice.call(arguments);
      return chaves.reduce(function (acc, chave) {
        return acc.concat((secaoLocalPorChave[chave] || { groups: [] }).groups);
      }, []);
    }
    var GRUPOS_RECEITA = gruposDe("receita", "finRec", "outrasRec");
    var GRUPOS_SAIDA = gruposDe("impostos", "custo", "despesas", "finDesp",
                                "outrasDesp", "impLucro");

    /* Ordena a lista de uma dimensao, deixando o "sem informacao" por ultimo. */
    function ordenarDimensao(lista, dimensao) {
      var rotuloVazio = dimensao === "projeto" ? "Sem projeto" : "Sem centro de custo";
      var preenchidos = lista.filter(function (v) { return v !== rotuloVazio; });
      var temVazio = lista.length !== preenchidos.length;
      var ordenados;

      if (dimensao === "projeto") {
        var quorum = preenchidos.filter(function (v) { return v.toUpperCase() === "QUORUM"; });
        var demais = preenchidos.filter(function (v) { return v.toUpperCase() !== "QUORUM"; })
          .sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });
        ordenados = quorum.concat(demais);
      } else {
        var posicao = function (nome) {
          var indice = ORDEM_CENTROS.findIndex(function (c) {
            return c.toLowerCase() === nome.toLowerCase();
          });
          return indice < 0 ? ORDEM_CENTROS.length : indice;
        };
        ordenados = preenchidos.slice().sort(function (a, b) {
          var diferenca = posicao(a) - posicao(b);
          return diferenca !== 0 ? diferenca : a.localeCompare(b, "pt-BR");
        });
      }

      return temVazio ? ordenados.concat([rotuloVazio]) : ordenados;
    }

    /* Receita, saida e resultado por projeto ou por centro de custo. */
    function agruparPorDimensao(dimensao) {
      var somas = new Map();
      var valores = new Set();

      usadas.forEach(function (l) {
        var ehReceita = GRUPOS_RECEITA.indexOf(l.grupo) >= 0;
        var ehSaida = GRUPOS_SAIDA.indexOf(l.grupo) >= 0;
        if (!ehReceita && !ehSaida) return;
        var valorDimensao = l[dimensao];
        valores.add(valorDimensao);
        var chave = valorDimensao + "||" + chaveMes(l.dataRegime) + "||" + (ehReceita ? "r" : "s");
        somas.set(chave, (somas.get(chave) || 0) + l.valor);
      });

      var lista = ordenarDimensao(Array.from(valores), dimensao);
      var rec = {}, sai = {}, res = {};

      lista.forEach(function (item) {
        rec[item] = {}; sai[item] = {}; res[item] = {};
        meses.forEach(function (mes) {
          rec[item][mes] = somas.get(item + "||" + mes + "||r") || 0;
          sai[item][mes] = somas.get(item + "||" + mes + "||s") || 0;
          res[item][mes] = rec[item][mes] + sai[item][mes];
        });
      });

      return { lista: lista, rec: rec, sai: sai, res: res };
    }

    var porProjeto = agruparPorDimensao("projeto");
    var porCentro = agruparPorDimensao("centro");

    /* ---------------------------------------------------------------- */
    /* Achados                                                          */
    /* ---------------------------------------------------------------- */

    var achados = [];

    /* Categoria que nao existe no plano de contas. */
    var foraDoPlano = new Map();
    linhas.forEach(function (l) {
      if (!CHAVES_DO_PLANO.has(l.grupo + "||" + l.categoria)) {
        var rotulo = l.grupo + " > " + l.categoria;
        if (!foraDoPlano.has(rotulo)) foraDoPlano.set(rotulo, { valor: 0, linhas: [] });
        var registro = foraDoPlano.get(rotulo);
        registro.valor += l.valor;
        registro.linhas.push(l);
      }
    });
    foraDoPlano.forEach(function (registro, rotulo) {
      achados.push({
        nivel: "erro",
        titulo: "Categoria fora do plano de contas",
        detalhe: rotulo + " - " + formatarNumero(registro.valor, 2),
        linhas: registro.linhas
      });
    });

    /* Lancamentos que ficam de fora por nao ter nenhuma data utilizavel,   */
    /* nem de pagamento nem de emissao. Deve ser raro: normalmente so       */
    /* titulos em aberto chegam aqui, e esses ja ficam fora de "usadas" por */
    /* definicao (usadas exige dataRegime, que so falta quando faltam as    */
    /* duas datas ao mesmo tempo).                                         */
    if (semData.length) {
      achados.push({
        nivel: "alerta",
        titulo: "Lançamento sem nenhuma data utilizável",
        detalhe: semData.length + " lançamento(s), somando "
          + formatarNumero(semData.reduce(function (s, l) { return s + l.valor; }, 0), 2)
          + ", ficam fora do período",
        linhas: semData
      });
    }

    /* Em competencia, lancamentos sem nota fiscal foram reconhecidos pela  */
    /* data de pagamento. Fica registrado aqui para auditoria: o valor      */
    /* entra no resultado certo, mas o mes onde ele caiu e uma aproximacao. */
    var comFallback = usadas.filter(function (l) { return l.usouFallbackData; });
    if (comFallback.length) {
      achados.push({
        nivel: "alerta",
        titulo: "Reconhecido pela data de pagamento, sem nota fiscal",
        detalhe: comFallback.length + " lançamento(s) sem data de emissão, somando "
          + formatarNumero(comFallback.reduce(function (s, l) { return s + l.valor; }, 0), 2)
          + ", contados no mês do pagamento em vez do mês de emissão",
        linhas: comFallback
      });
    }

    /* Possivel duplicidade. Repetir data, categoria, valor e conta nao e   */
    /* suficiente: tres tarifas de meio real no mesmo dia sao tres tarifas  */
    /* de verdade, e quatro aportes iguais sao quatro depositos de verdade. */
    /* Por isso o documento entra na assinatura, e um grupo so vira alerta  */
    /* quando nao da para provar que sao eventos distintos. Prova aceita:   */
    /* cada linha com titulo proprio na Omie e ja conciliada com o banco.   */
    var possiveisDuplicatas = new Map();
    usadas.forEach(function (l) {
      var assinatura = chaveMes(l.dataRegime) + "|" + l.dataRegime.getDate() + "|"
        + l.categoria + "|" + l.valor.toFixed(2) + "|" + l.conta + "|" + (l.documento || "");
      if (!possiveisDuplicatas.has(assinatura)) possiveisDuplicatas.set(assinatura, []);
      possiveisDuplicatas.get(assinatura).push(l);
    });

    /* Eventos distintos comprovados: identificadores proprios, todos      */
    /* diferentes entre si, e dinheiro ja conciliado no extrato.           */
    function eventosDistintos(grupo) {
      var ids = grupo.map(function (l) { return l.idTitulo || l.idMovimento || ""; });
      var todosIdentificados = ids.every(function (id) { return !!id; });
      if (!todosIdentificados) return false;
      if (new Set(ids).size !== ids.length) return false;
      return grupo.every(function (l) { return l.liquidado; });
    }

    possiveisDuplicatas.forEach(function (grupo) {
      if (grupo.length > 1 && !eventosDistintos(grupo)) {
        achados.push({
          nivel: "alerta",
          titulo: "Possível duplicidade",
          detalhe: grupo.length + "x " + grupo[0].categoria + " de "
            + formatarNumero(grupo[0].valor, 2) + " em "
            + grupo[0].dataRegime.toLocaleDateString("pt-BR") + " (" + grupo[0].conta + ")",
          linhas: grupo
        });
      }
    });

    /* Lancamento cancelado que continua na base. */
    usadas.forEach(function (l) {
      if (/cancel/i.test(l.situacao)) {
        achados.push({
          nivel: "alerta",
          titulo: "Lançamento cancelado ainda na base",
          detalhe: l.categoria + " - " + formatarNumero(l.valor, 2) + " - " + l.situacao,
          linhas: [l]
        });
      }
    });

    /* Base que nao fecha com o fluxo. */
    meses.forEach(function (mes) {
      if (Math.abs(integridade[mes]) >= 0.01) {
        achados.push({
          nivel: "erro",
          titulo: "Base não fecha com o fluxo",
          detalhe: rotuloMes(mes) + " tem diferença de " + formatarNumero(integridade[mes], 2)
            + " entre a soma da base e o fluxo de caixa",
          linhas: usadas.filter(function (l) { return chaveMes(l.dataRegime) === mes; })
        });
      }
    });

    return {
      meses: meses,
      bruto: bruto,
      grupoMes: grupoMes,
      /* As secoes desta carga, ja com os grupos que realmente aparecem.   */
      /* O render usa esta lista, e nao a constante do modulo, para que a  */
      /* soma da secao e os grupos exibidos embaixo dela sejam a mesma     */
      /* coisa, sempre.                                                    */
      secoes: secoesLocais,
      secoesDre: secoesLocais.slice(0, SECOES_DRE.length),
      secoesFluxo: secoesLocais.slice(SECOES_DRE.length),
      S: S,
      receitaLiquida: receitaLiquida,
      lucroBruto: lucroBruto,
      ebitda: ebitda,
      resultadoFin: resultadoFin,
      outras: outras,
      ebit: ebit,
      lucroLiquido: lucroLiquido,
      acumulado: acumulado,
      fcl: fcl,
      contas: contas,
      movConta: movConta,
      saldoConta: saldoConta,
      integridade: integridade,
      totalMes: totalPorMes,
      achados: achados,
      usadas: usadas,
      semData: semData,
      porProjeto: porProjeto,
      porCentro: porCentro,
      campo: campoData
    };
  }

  /* ------------------------------------------------------------------ */
  /* 8. COMPONENTES DE UI                                                */
  /* ------------------------------------------------------------------ */

  /* Aparencia de cada nivel hierarquico das tabelas. */
  var ESTILO_LINHA = {
    secao: { bg: "#E3E8EF",                 cor: "#1B2230", peso: 600, pad: "pl-3",  fs: 12.5 },
    grupo: { bg: "transparent",             cor: "#3C465A", peso: 500, pad: "pl-6",  fs: 12 },
    item:  { bg: "transparent",             cor: "#7A8598", peso: 400, pad: "pl-10", fs: 11.5 },
    total: { bg: "rgba(138,106,22,0.12)",   cor: "#7A5C10", peso: 700, pad: "pl-3",  fs: 13 },
    pct:   { bg: "transparent",             cor: "#7A8598", peso: 400, pad: "pl-3",  fs: 11 }
  };

  /* Uma linha da tabela mensal. Clicavel quando recebe aoAbrir. */
  function LinhaTabela(props) {
    var estilo = ESTILO_LINHA[props.nivel || "item"];
    var casas = props.casas === undefined ? 2 : props.casas;
    var estadoHover = useState(false);
    var hover = estadoHover[0];
    var setHover = estadoHover[1];

    var totalAcumulado = props.acumulado !== undefined
      ? props.acumulado
      : props.meses.reduce(function (soma, mes) { return soma + (props.valores[mes] || 0); }, 0);

    var clicavel = typeof props.aoAbrir === "function";

    var estiloNumero = {
      color: estilo.cor,
      fontWeight: estilo.peso,
      fontSize: estilo.fs,
      fontVariantNumeric: "tabular-nums"
    };

    var celulaRotulo = h("td", {
      className: estilo.pad + " py-1 whitespace-nowrap overflow-hidden",
      style: { color: estilo.cor, fontWeight: estilo.peso, fontSize: estilo.fs },
      onClick: clicavel ? function () { props.aoAbrir(null); } : undefined,
      title: clicavel ? "Abrir os lançamentos desta linha" : undefined
    },
      h("span", {
        className: "inline-block align-middle truncate",
        style: { maxWidth: "72%" },
        title: props.label
      }, props.label),
      props.sufixo,
      h("span", {
        className: "align-middle",
        style: {
          color: COR.brass,
          fontSize: 10,
          marginLeft: 6,
          opacity: clicavel && hover ? 1 : 0
        }
      }, "ver lançamentos")
    );

    var celulasMes = props.meses.map(function (mes) {
      return h("td", {
        key: mes,
        className: "px-3 py-1 text-right whitespace-nowrap",
        style: estiloNumero,
        onClick: clicavel ? function () { props.aoAbrir(mes); } : undefined,
        title: clicavel ? "Abrir os lançamentos de " + rotuloMes(mes) : undefined
      }, props.formato === "pct"
        ? formatarPercentual(props.valores[mes])
        : formatarNumero(props.valores[mes], casas));
    });

    /* O acumulado de um percentual nunca e a soma dos percentuais mensais  */
    /* (isso nao tem sentido matematico), mas o quociente dos totais do     */
    /* periodo: soma do numerador dividida pela soma do denominador. Quem   */
    /* chama LinhaTabela com formato "pct" precisa calcular esse quociente  */
    /* e passar em props.acumulado; sem isso, a celula fica em branco, como */
    /* sempre foi.                                                          */
    var celulaAcumulado = h("td", {
      className: "px-3 py-1 text-right whitespace-nowrap",
      style: Object.assign({}, estiloNumero, { borderLeft: "1px solid " + COR.line }),
      onClick: clicavel && props.formato !== "pct" ? function () { props.aoAbrir(null); } : undefined,
      title: clicavel && props.formato !== "pct" ? "Abrir os lançamentos do período inteiro" : undefined
    }, props.formato === "pct"
      ? (props.acumulado !== undefined ? formatarPercentual(props.acumulado) : "")
      : formatarNumero(totalAcumulado, casas));

    return h("tr", {
      onMouseEnter: function () { setHover(true); },
      onMouseLeave: function () { setHover(false); },
      style: {
        background: hover && clicavel ? "rgba(138,106,22,0.07)" : estilo.bg,
        cursor: clicavel ? "pointer" : "default"
      }
    }, celulaRotulo, celulasMes, celulaAcumulado);
  }

  /* Cartao de indicador do topo, com tooltip de ajuda no hover. */
  function CartaoIndicador(props) {
    var estadoHover = useState(false);
    var hover = estadoHover[0];
    var setHover = estadoHover[1];
    var corValor = props.tom === "neg" ? COR.coral : (props.tom === "pos" ? COR.mint : COR.text);

    return h("div", {
      className: "rounded px-4 py-3 relative",
      style: {
        background: COR.surface,
        border: "1px solid " + (hover ? COR.brass : COR.line),
        minHeight: 112
      },
      onMouseEnter: function () { setHover(true); },
      onMouseLeave: function () { setHover(false); }
    },
      h("div", {
        className: "uppercase flex items-center gap-1",
        style: { fontSize: 10, letterSpacing: "0.12em", color: COR.faint }
      },
        props.rotulo,
        props.ajuda && h("span", {
          className: "inline-flex items-center justify-center rounded-full",
          style: {
            width: 13, height: 13,
            border: "1px solid " + COR.faint,
            fontSize: 9, lineHeight: "11px", color: COR.faint
          }
        }, "?")
      ),
      h("div", {
        className: "mt-1",
        style: {
          fontSize: 24,
          color: corValor,
          fontWeight: 600,
          fontVariantNumeric: "tabular-nums"
        }
      }, formatarNumero(props.valor, props.casas === undefined ? 0 : props.casas)),
      props.sub && h("div", {
        className: "mt-1 leading-snug",
        style: { fontSize: 11, color: COR.faint }
      }, props.sub),
      props.ajuda && hover && h("div", {
        className: "absolute left-0 right-0 rounded p-3 z-20",
        style: {
          top: "100%",
          marginTop: 6,
          background: COR.text,
          color: "#F4F6F9",
          fontSize: 11,
          lineHeight: 1.5,
          boxShadow: "0 8px 24px rgba(15,22,35,0.25)"
        }
      }, props.ajuda)
    );
  }

  /* Cabecalho com uma coluna por mes mais a coluna de acumulado. */
  function CabecalhoMeses(props) {
    var estiloTh = { fontSize: 10, letterSpacing: "0.12em", color: COR.dim };
    return h("thead", null,
      h("tr", { style: { background: COR.ink } },
        h("th", { className: "pl-3 py-2 text-left uppercase", style: estiloTh }, "Linha"),
        props.meses.map(function (mes) {
          return h("th", {
            key: mes,
            className: "px-3 py-2 text-right uppercase whitespace-nowrap",
            style: estiloTh
          }, rotuloMes(mes));
        }),
        h("th", {
          className: "px-3 py-2 text-right uppercase whitespace-nowrap",
          style: {
            fontSize: 10,
            letterSpacing: "0.12em",
            color: COR.brass,
            borderLeft: "1px solid " + COR.line
          }
        }, "Acumulado")
      )
    );
  }

  /* Etiqueta que explica de onde veio o nome da contraparte. */
  function EtiquetaOrigem(origem) {
    if (origem !== "nota" && origem !== "natureza") return null;
    var explicacao = origem === "natureza"
      ? "Fornecedor não cadastrado no Omie. O painel usou a natureza do lançamento, porque a observação traz a operação de origem e não quem recebeu."
      : "Fornecedor não cadastrado no Omie. O painel leu o nome na observação do lançamento.";
    return h("span", {
      style: {
        fontSize: 9,
        color: COR.brass,
        marginLeft: 6,
        border: "1px solid " + COR.brass,
        borderRadius: 3,
        padding: "0 4px"
      },
      title: explicacao
    }, origem === "natureza" ? "por natureza" : "lido da observação");
  }

  /* Gaveta lateral: mostra os lancamentos que compoem a linha clicada. */
  function GavetaLancamentos(props) {
    var ctx = props.ctx;
    if (!ctx) return null;

    /* Achado abre com a lista pronta (linhas ja identificadas na apuracao */
    /* do achado, como duplicidade ou sem data), em vez de recalcular um   */
    /* filtro por grupo/categoria/mes que nem sempre existe para esses     */
    /* casos.                                                              */
    var selecionadas = ctx.listaFixa
      ? ctx.listaFixa
      : props.linhas.filter(function (l) {
          if (ctx.grupo && l.grupo !== ctx.grupo) return false;
          if (ctx.categoria && l.categoria !== ctx.categoria) return false;
          if (ctx.grupos && ctx.grupos.indexOf(l.grupo) < 0) return false;
          if (ctx.projeto && l.projeto !== ctx.projeto) return false;
          if (ctx.centro && l.centro !== ctx.centro) return false;
          if (ctx.somenteResultado && ctx.gruposResultado.indexOf(l.grupo) < 0) return false;
          if (ctx.mes && chaveMes(l.dataRegime) !== ctx.mes) return false;
          return true;
        });

    /* Consolidacao por contraparte, da maior para a menor em valor absoluto. */
    var mapaContraparte = new Map();
    selecionadas.forEach(function (l) {
      if (!mapaContraparte.has(l.contraparte)) {
        mapaContraparte.set(l.contraparte, { soma: 0, n: 0, origem: l.contraOrigem });
      }
      var registro = mapaContraparte.get(l.contraparte);
      registro.soma += l.valor;
      registro.n += 1;
      if (registro.origem !== l.contraOrigem) registro.origem = "misto";
    });
    var contrapartes = Array.from(mapaContraparte.entries()).sort(function (a, b) {
      return Math.abs(b[1].soma) - Math.abs(a[1].soma);
    });

    var total = selecionadas.reduce(function (soma, l) { return soma + l.valor; }, 0);

    var cabecalho = h("div", {
      className: "sticky top-0 px-5 py-4",
      style: { background: COR.surface, borderBottom: "1px solid " + COR.line }
    },
      h("div", { className: "flex items-start gap-3" },
        h("div", { className: "flex-1" },
          h("div", {
            className: "uppercase",
            style: { fontSize: 10, letterSpacing: "0.12em", color: COR.brass }
          }, "Lançamentos"),
          h("div", { style: { fontSize: 15, fontWeight: 600, color: COR.text } }, ctx.titulo),
          h("div", { style: { fontSize: 11, color: COR.faint } },
            ctx.mes ? rotuloMes(ctx.mes) : "todo o período",
            " · ", selecionadas.length, " lançamento(s) · ",
            ctx.campo === "dPag" ? "por data de pagamento" : "por data de emissão"
          )
        ),
        h("button", {
          onClick: props.aoFechar,
          className: "px-3 py-1 rounded",
          style: { border: "1px solid " + COR.line, color: COR.dim, fontSize: 11 }
        }, "Fechar")
      ),
      h("div", {
        className: "mt-3 flex justify-between",
        style: { fontSize: 13, fontWeight: 700, color: total < 0 ? COR.coral : COR.mint }
      },
        h("span", null, "Total"),
        h("span", { style: { fontVariantNumeric: "tabular-nums" } }, formatarNumero(total, 2))
      )
    );

    var blocoContrapartes = contrapartes.map(function (par) {
      var nome = par[0];
      var registro = par[1];
      return h("div", {
        key: nome,
        className: "flex justify-between py-1",
        style: { fontSize: 12, color: COR.dim, borderBottom: "1px solid " + COR.lineSoft }
      },
        h("span", { className: "pr-3" },
          nome,
          registro.n > 1 ? "  (" + registro.n + "x)" : "",
          EtiquetaOrigem(registro.origem)
        ),
        h("span", {
          style: { fontVariantNumeric: "tabular-nums", color: COR.text }
        }, formatarNumero(registro.soma, 2))
      );
    });

    var linhaALinha = selecionadas.slice().sort(function (a, b) {
      return (a.dataRegime || 0) - (b.dataRegime || 0);
    }).map(function (l) {
      return h("tr", { key: l.id, style: { borderBottom: "1px solid " + COR.lineSoft } },
        h("td", {
          className: "py-1 pr-2 whitespace-nowrap",
          style: { fontSize: 11, color: COR.faint }
        }, l.dataRegime ? l.dataRegime.toLocaleDateString("pt-BR") : "-"),
        h("td", { className: "py-1 pr-2", style: { fontSize: 11.5, color: COR.text } },
          h("div", { style: { whiteSpace: "normal", wordBreak: "break-word" } },
            l.contraparte,
            EtiquetaOrigem(l.contraOrigem)
          ),
          h("div", { style: { fontSize: 10, color: COR.faint } },
            l.categoria, l.situacao ? " · " + l.situacao : ""
          ),
          l.nota && h("div", {
            style: {
              fontSize: 10,
              color: COR.faint,
              lineHeight: 1.45,
              whiteSpace: "normal",
              wordBreak: "break-word"
            }
          }, l.nota)
        ),
        h("td", {
          className: "py-1 pr-2 whitespace-nowrap",
          style: { fontSize: 10, color: COR.faint }
        }, l.conta),
        h("td", {
          className: "py-1 text-right whitespace-nowrap",
          style: {
            fontSize: 12,
            fontVariantNumeric: "tabular-nums",
            color: l.valor < 0 ? COR.coral : COR.mint
          }
        }, formatarNumero(l.valor, 2))
      );
    });

    var corpo = h("div", { className: "px-5 py-4" },
      h("div", {
        className: "uppercase mb-2",
        style: { fontSize: 10, letterSpacing: "0.12em", color: COR.faint }
      }, "Por contraparte"),
      blocoContrapartes,
      h("div", {
        className: "uppercase mt-6 mb-2",
        style: { fontSize: 10, letterSpacing: "0.12em", color: COR.faint }
      }, "Linha a linha"),
      h("table", { className: "w-full", style: { borderCollapse: "collapse" } },
        h("tbody", null, linhaALinha)
      )
    );

    return h("div", {
      className: "fixed inset-0 z-40 flex justify-end",
      style: { background: "rgba(20,26,38,0.35)" },
      onClick: props.aoFechar
    },
      h("div", {
        className: "h-full overflow-y-auto",
        style: {
          width: 640,
          maxWidth: "100%",
          background: COR.surface,
          borderLeft: "1px solid " + COR.line
        },
        onClick: function (evento) { evento.stopPropagation(); }

  /* Distancia das bordas usada igualmente pelo logo e pelo numero do slide. */
  var MARGEM_RODAPE = 34;
  var TAMANHO_LOGO = 34;

  /* Gradiente de azul, do mais escuro ao mais claro. A maior serie fica  */
  /* na base da coluna e recebe o tom mais escuro.                       */
  var AZUIS = [
    "#0A2A47", "#16497A", "#216FA8", "#3E92C8",
    "#74B4DC", "#A6CFE8", "#BBD9EE"
  ];

  /* Escolhe um topo de eixo redondo e o passo da grade. */
  function escalaBonita(valorMaximo, divisoesDesejadas) {
    if (!(valorMaximo > 0)) return { topo: 1, passo: 1 };
    var divisoes = divisoesDesejadas || 5;
    var passoCru = valorMaximo / divisoes;
    var magnitude = Math.pow(10, Math.floor(Math.log(passoCru) / Math.LN10));
    var normalizado = passoCru / magnitude;
    var multiplicador = normalizado <= 1 ? 1 : (normalizado <= 2 ? 2 : (normalizado <= 2.5 ? 2.5 : (normalizado <= 5 ? 5 : 10)));
    var passo = multiplicador * magnitude;
    return { topo: Math.ceil(valorMaximo / passo) * passo, passo: passo };
  }

  /* Largura aproximada de um texto, para posicionar a legenda. */
  function larguraAproximada(texto, tamanhoFonte) {
    return String(texto).length * tamanhoFonte * 0.55;
  }

  /* Espalha os tons ao longo do gradiente de azul: com poucas series usa   */
  /* os extremos, para que faixas vizinhas nunca fiquem quase iguais. Grava  */
  /* .cor em cada serie recebida, na ordem em que ja estiverem (maior        */
  /* primeiro, que e quem fica na base da coluna).                          */
  function colorirGradiente(series) {
    series.forEach(function (serie, i) {
      /* Com poucas series o tom mais claro fica lavado contra o fundo,     */
      /* entao o teto do gradiente so sobe ate o fim com series suficientes. */
      var tetoTom = Math.min(AZUIS.length - 1, Math.max(series.length - 1, 5));
      var passo = series.length > 1 ? tetoTom / (series.length - 1) : 0;
      serie.cor = AZUIS[Math.round(i * passo)];
    });
  }

  /* Corta um texto longo demais para a legenda, com reticencias no fim. */
  function truncar(texto, maximo) {
    var t = String(texto);
    return t.length > maximo ? t.slice(0, maximo - 1).trim() + "…" : t;
  }

  /* ---------------------------------------------------------------------- */
  /* Slide generico de colunas empilhadas. Recebe as series ja prontas      */
  /* (rotulo, cor, valores por mes), na ordem de empilhamento desejada, e   */
  /* cuida so do desenho: grade, colunas, total no topo, legenda, cabecalho */
  /* e rodape do slide. Todo grafico novo do mesmo formato usa este molde   */
  /* em vez de reescrever o SVG do zero.                                    */
  /* ---------------------------------------------------------------------- */
  function SlideColunasEmpilhadas(props) {
    var meses = props.meses;
    var regime = props.regime;
    var series = props.series;
    var numero = props.numero;

    var totalPorMes = {};
    meses.forEach(function (mes) {
      totalPorMes[mes] = series.reduce(function (soma, serie) {
        return soma + serie.valores[mes];
      }, 0);
    });

    var maiorTotal = meses.reduce(function (maior, mes) {
      return Math.max(maior, totalPorMes[mes]);
    }, 0);

    var moldura = {
      className: "rounded overflow-hidden mx-auto",
      style: {
        background: COR.surface,
        border: "1px solid " + COR.line,
        maxWidth: 1080,
        width: "100%"
      }
    };

    if (!series.length || maiorTotal <= 0) {
      return h("div", moldura,
        h("div", {
          className: "flex items-center justify-center",
          style: { aspectRatio: "16 / 9", fontSize: 12, color: COR.faint }
        }, props.vazio || "Sem dados no período para montar o gráfico.")
      );
    }

    /* Area util do desenho. */
    var margem = { topo: 148, direita: 92, baixo: 192, esquerda: 132 };
    var RECUO_TITULO = 56;
    var larguraPlot = SLIDE.largura - margem.esquerda - margem.direita;
    var alturaPlot = SLIDE.altura - margem.topo - margem.baixo;
    var baseY = margem.topo + alturaPlot;

    var escala = escalaBonita(maiorTotal, 5);
    var alturaDe = function (valor) { return (valor / escala.topo) * alturaPlot; };

    var faixa = larguraPlot / meses.length;
    var larguraColuna = Math.min(96, faixa * 0.58);

    /* Grade horizontal e rotulos do eixo de valores. */
    var grade = [];
    for (var v = 0; v <= escala.topo + 0.0001; v += escala.passo) {
      var y = baseY - alturaDe(v);
      grade.push(h("line", {
        key: "g" + v,
        x1: margem.esquerda, y1: y, x2: margem.esquerda + larguraPlot, y2: y,
        stroke: v === 0 ? COR.line : COR.lineSoft,
        strokeWidth: v === 0 ? 1.5 : 1
      }));
      grade.push(h("text", {
        key: "r" + v,
        x: margem.esquerda - 16, y: y + 5,
        textAnchor: "end",
        style: { fontSize: 15, fill: COR.faint, fontVariantNumeric: "tabular-nums" }
      }, v === 0 ? "0" : formatarNumero(v, 0)));
    }

    /* Colunas empilhadas, maior serie na base. */
    var colunas = [];
    meses.forEach(function (mes, indiceMes) {
      var centro = margem.esquerda + faixa * indiceMes + faixa / 2;
      var x = centro - larguraColuna / 2;
      var topoAcumulado = baseY;

      series.forEach(function (serie) {
        var valor = serie.valores[mes];
        if (valor <= 0) return;
        var altura = alturaDe(valor);
        topoAcumulado -= altura;
        colunas.push(h("rect", {
          key: "b" + mes + serie.rotulo,
          x: x, y: topoAcumulado, width: larguraColuna, height: altura,
          fill: serie.cor,
          stroke: COR.surface,
          strokeWidth: 1.5
        }));
      });

      /* Total no topo da coluna. */
      if (totalPorMes[mes] > 0) {
        colunas.push(h("text", {
          key: "t" + mes,
          x: centro, y: topoAcumulado - 14,
          textAnchor: "middle",
          style: {
            fontSize: 19,
            fill: COR.text,
            fontWeight: 600,
            fontVariantNumeric: "tabular-nums"
          }
        }, formatarNumero(totalPorMes[mes], 0)));
      }

      /* Rotulo do mes. */
      colunas.push(h("text", {
        key: "m" + mes,
        x: centro, y: baseY + 30,
        textAnchor: "middle",
        style: { fontSize: 16, fill: COR.dim }
      }, rotuloMes(mes)));
    });

    /* Legenda centralizada, quebrando em linhas quando nao couber. */
    var LEGENDA_FONTE = 15;
    var itensLegenda = series.map(function (serie) {
      return { rotulo: serie.rotulo, cor: serie.cor, largura: 18 + 10 + larguraAproximada(serie.rotulo, LEGENDA_FONTE) + 28 };
    });

    var linhasLegenda = [];
    var linhaCorrente = [];
    var larguraCorrente = 0;
    var larguraLegenda = SLIDE.largura - 120;
    itensLegenda.forEach(function (item) {
      if (linhaCorrente.length && larguraCorrente + item.largura > larguraLegenda) {
        linhasLegenda.push({ itens: linhaCorrente, largura: larguraCorrente });
        linhaCorrente = [];
        larguraCorrente = 0;
      }
      linhaCorrente.push(item);
      larguraCorrente += item.largura;
    });
    if (linhaCorrente.length) linhasLegenda.push({ itens: linhaCorrente, largura: larguraCorrente });

    var legenda = [];
    linhasLegenda.forEach(function (linha, indiceLinha) {
      var x = (SLIDE.largura - linha.largura) / 2;
      var y = baseY + 72 + indiceLinha * 30;
      linha.itens.forEach(function (item) {
        legenda.push(h("rect", {
          key: "lc" + item.rotulo,
          x: x, y: y - 12, width: 18, height: 14, rx: 2, fill: item.cor
        }));
        legenda.push(h("text", {
          key: "lt" + item.rotulo,
          x: x + 28, y: y,
          style: { fontSize: LEGENDA_FONTE, fill: COR.dim }
        }, item.rotulo));
        x += item.largura;
      });
    });

    var periodo = meses.length
      ? rotuloMes(meses[0]) + " a " + rotuloMes(meses[meses.length - 1])
      : "sem período";

    return h("div", moldura,
      h("svg", {
        viewBox: "0 0 " + SLIDE.largura + " " + SLIDE.altura,
        width: "100%",
        preserveAspectRatio: "xMidYMid meet",
        style: { display: "block", background: COR.surface }
      },
        /* Cabecalho do slide: titulo e, logo abaixo, o subtitulo. */
        h("text", {
          x: RECUO_TITULO, y: 68,
          style: { fontSize: 40, fill: COR.text, fontWeight: 600, letterSpacing: "0.5px" }
        }, props.titulo),
        h("text", {
          x: RECUO_TITULO, y: 98,
          style: { fontSize: 15, fill: COR.faint }
        }, periodo + " · regime de " + (regime === "caixa" ? "caixa" : "competência") + " · R$"),

        /* Logotipo no canto inferior esquerdo. */
        h("image", {
          href: LOGO_QUORUM,
          x: MARGEM_RODAPE,
          y: SLIDE.altura - MARGEM_RODAPE - TAMANHO_LOGO,
          width: TAMANHO_LOGO,
          height: TAMANHO_LOGO
        }),

        /* Numero do slide no canto inferior direito, na mesma margem. */
        h("text", {
          x: SLIDE.largura - MARGEM_RODAPE,
          y: SLIDE.altura - MARGEM_RODAPE - TAMANHO_LOGO / 2 + 6,
          textAnchor: "end",
          style: { fontSize: 17, fill: COR.faint, fontVariantNumeric: "tabular-nums" }
        }, String(numero || 1)),
        grade,
        colunas,
        legenda
      )
    );
  }

  /* Colunas empilhadas de receita bruta, abertas por tipo de receita. */
  function GraficoReceitaBruta(props) {
    var dados = props.dados;
    var meses = props.meses;
    var regime = props.regime;

    /* Uma serie por grupo de receita, descartando o que ficou zerado. */
    var series = (dados.secoesDre ? dados.secoesDre[0].groups : SECOES_DRE[0].groups).map(function (grupo) {
      var valores = {};
      var total = 0;
      meses.forEach(function (mes) {
        var valor = dados.grupoMes(grupo, mes);
        valores[mes] = valor;
        total += valor;
      });
      return { nome: grupo, valores: valores, total: total };
    }).filter(function (serie) {
      return Math.abs(serie.total) > 0.005;
    }).sort(function (a, b) {
      return b.total - a.total;
    });

    /* Rotulo curto: "Receita de Patrocínio" vira "Patrocínio". */
    series.forEach(function (serie) {
      serie.rotulo = serie.nome.replace(/^Receitas? de /, "").replace(/^Receitas /, "");
    });
    colorirGradiente(series);

    return h(SlideColunasEmpilhadas, {
      titulo: "RECEITA BRUTA",
      series: series,
      meses: meses,
      regime: regime,
      numero: props.numero
    });
  }

  /* Quantos clientes aparecem nomeados individualmente antes de agrupar o  */
  /* resto em "Outros clientes". Mantido igual ao numero de tons do        */
  /* gradiente para nunca faltar cor propria a um cliente nomeado.         */
  var LIMITE_CLIENTES_NO_GRAFICO = 6;

  /* Colunas empilhadas de receita bruta, abertas por cliente. Os maiores   */
  /* clientes do periodo aparecem nomeados, do maior para o menor; o resto  */
  /* vira uma unica faixa "Outros clientes", sempre no topo da pilha e em   */
  /* cinza neutro, fora do gradiente de azul, para nao competir com nomes.  */
  /* Rotulo usado quando o lancamento de receita nao tem fornecedor        */
  /* cadastrado na Omie. Sem isso, o painel cairia no ultimo recurso de     */
  /* resolverContraparte (o nome da conta bancaria), o que faria a conta    */
  /* corrente aparecer como se fosse um cliente no grafico.                 */
  var SEM_CLIENTE_ROTULO = "Sem cliente identificado";

  function GraficoReceitaPorCliente(props) {
    var dados = props.dados;
    var meses = props.meses;
    var regime = props.regime;

    var gruposReceita = (dados.secoesDre ? dados.secoesDre[0].groups : SECOES_DRE[0].groups);
    var somasPorCliente = new Map();
    var totalPorCliente = new Map();

    dados.usadas.forEach(function (l) {
      if (gruposReceita.indexOf(l.grupo) < 0) return;
      var mes = chaveMes(l.dataRegime);
      if (!mes) return;
      /* So confia no nome se ele veio do cadastro de fato. Fallback por    */
      /* natureza ou por conta corrente vira "sem cliente identificado".    */
      var cliente = l.contraOrigem === "cadastro" ? l.contraparte : SEM_CLIENTE_ROTULO;
      var chave = cliente + "||" + mes;
      somasPorCliente.set(chave, (somasPorCliente.get(chave) || 0) + l.valor);
      totalPorCliente.set(cliente, (totalPorCliente.get(cliente) || 0) + l.valor);
    });

    var ranking = Array.from(totalPorCliente.entries())
      .filter(function (par) { return par[0] !== SEM_CLIENTE_ROTULO && Math.abs(par[1]) > 0.005; })
      .sort(function (a, b) { return b[1] - a[1]; });

    var principais = ranking.slice(0, LIMITE_CLIENTES_NO_GRAFICO);
    var demais = ranking.slice(LIMITE_CLIENTES_NO_GRAFICO);

    var series = principais.map(function (par) {
      var cliente = par[0];
      var valores = {};
      meses.forEach(function (mes) {
        valores[mes] = somasPorCliente.get(cliente + "||" + mes) || 0;
      });
      return { rotulo: truncar(cliente, 26), valores: valores };
    });

    /* A cor por gradiente considera so os clientes nomeados de verdade:   */
    /* "Outros" e "sem cliente" recebem cinza fixo, escolhido depois, para */
    /* nao serem confundidos com um cliente de verdade.                   */
    colorirGradiente(series);

    if (demais.length) {
      var valoresOutros = {};
      meses.forEach(function (mes) {
        valoresOutros[mes] = demais.reduce(function (soma, par) {
          return soma + (somasPorCliente.get(par[0] + "||" + mes) || 0);
        }, 0);
      });
      series.push({
        rotulo: "Outros clientes (" + demais.length + ")",
        valores: valoresOutros,
        cor: "#B9C0CC"
      });
    }

    var totalSemCliente = totalPorCliente.get(SEM_CLIENTE_ROTULO) || 0;
    if (Math.abs(totalSemCliente) > 0.005) {
      var valoresSemCliente = {};
      meses.forEach(function (mes) {
        valoresSemCliente[mes] = somasPorCliente.get(SEM_CLIENTE_ROTULO + "||" + mes) || 0;
      });
      series.push({ rotulo: SEM_CLIENTE_ROTULO, valores: valoresSemCliente, cor: "#D8DEE7" });
    }

    return h(SlideColunasEmpilhadas, {
      titulo: "RECEITA BRUTA POR CLIENTE",
      series: series,
      meses: meses,
      regime: regime,
      numero: props.numero,
      vazio: "Sem receita atribuída a cliente no período para montar o gráfico."
    });
  }

  /* Ajusta o topo e o piso do eixo do percentual aos proprios dados, em    */
  /* vez de ir de 0% a 100%: e o que da variacao visivel numa linha que,    */
  /* na pratica, costuma oscilar so alguns pontos percentuais.              */
  function escalaPercentual(valores) {
    var validos = valores.filter(function (v) { return v !== null && isFinite(v); });
    var minimo = validos.length ? Math.min.apply(null, validos) : 0;
    var maximo = validos.length ? Math.max.apply(null, validos) : 1;
    var AMPLITUDE_MINIMA = 0.06;
    var centro = (minimo + maximo) / 2;
    var metade = Math.max((maximo - minimo) / 2 + 0.01, AMPLITUDE_MINIMA / 2);
    var piso = Math.max(0, Math.floor((centro - metade) * 100) / 100);
    var teto = Math.min(1, Math.ceil((centro + metade) * 100) / 100);
    if (teto <= piso) teto = piso + 0.02;
    var passoCru = (teto - piso) / 4;
    var passo = Math.max(0.01, Math.round(passoCru * 100) / 100);
    return { piso: piso, teto: teto, passo: passo };
  }

  /* Colunas de Receita Líquida em R$, com uma linha de percentual sobre a  */
  /* Receita Bruta por cima. A linha vive numa faixa propria reservada no   */
  /* topo do slide, separada da area das colunas, para nunca cruzar por    */
  /* cima de uma barra alta.                                                */
  function GraficoReceitaLiquida(props) {
    var dados = props.dados;
    var meses = props.meses;
    var regime = props.regime;

    var valoresBarra = {};
    var percentuais = {};
    meses.forEach(function (mes) {
      var liquida = dados.receitaLiquida[mes];
      var bruta = dados.S.receita[mes];
      valoresBarra[mes] = liquida;
      percentuais[mes] = bruta > 0.005 ? liquida / bruta : null;
    });

    var maiorBarra = meses.reduce(function (maior, mes) {
      return Math.max(maior, valoresBarra[mes]);
    }, 0);

    var moldura = {
      className: "rounded overflow-hidden mx-auto",
      style: {
        background: COR.surface,
        border: "1px solid " + COR.line,
        maxWidth: 1080,
        width: "100%"
      }
    };

    if (!meses.length || maiorBarra <= 0) {
      return h("div", moldura,
        h("div", {
          className: "flex items-center justify-center",
          style: { aspectRatio: "16 / 9", fontSize: 12, color: COR.faint }
        }, "Sem receita líquida no período para montar o gráfico.")
      );
    }

    /* Area util do desenho, no mesmo padrao dos outros slides. */
    var margem = { topo: 148, direita: 92, baixo: 192, esquerda: 132 };
    var RECUO_TITULO = 56;
    var larguraPlot = SLIDE.largura - margem.esquerda - margem.direita;
    var alturaPlot = SLIDE.altura - margem.topo - margem.baixo;
    var baseY = margem.topo + alturaPlot;

    /* Faixa propria da linha, no topo do plot. As barras ficam proibidas  */
    /* de crescer para dentro dela: por isso o topo delas nao e o topo do  */
    /* plot inteiro, e sim logo abaixo dessa faixa, com um respiro.        */
    var yTopoFaixaLinha = margem.topo + 40;
    var ALTURA_FAIXA_LINHA = 90;
    var yBaseFaixaLinha = yTopoFaixaLinha + ALTURA_FAIXA_LINHA;
    var GAP_LINHA_BARRAS = 36;
    var topoParaBarras = yBaseFaixaLinha + GAP_LINHA_BARRAS;
    var alturaDisponivelBarras = baseY - topoParaBarras;

    meses.forEach(function (mes, indiceMes) {

    var maiorBarra = meses.reduce(function (maior, mes) {

    var temAlgumValor = meses.some(function (mes) { return Math.abs(valoresBarra[mes]) > 0.005; });

    var moldura = {

    var margem = { topo: 148, direita: 92, baixo: 192, esquerda: 132 };
    var RECUO_TITULO = 56;
    var larguraPlot = SLIDE.largura - margem.esquerda - margem.direita;

    /* de crescer para dentro dela: por isso o topo delas nao e o topo do  */
    /* plot inteiro, e sim logo abaixo dessa faixa, com um respiro.        */
    var yTopoFaixaLinha = margem.topo + 40;
    var ALTURA_FAIXA_LINHA = 90;
    var yBaseFaixaLinha = yTopoFaixaLinha + ALTURA_FAIXA_LINHA;

    var eixoZeroY = baseY - RESERVA_ROTULO_NEGATIVO - Math.abs(Math.min(0, menorBarra)) * pxPorUnidade;
    var alturaDeBarra = function (valor) { return Math.abs(valor) * pxPorUnidade; };

    var faixa = larguraPlot / meses.length;
    var larguraColuna = Math.min(96, faixa * 0.58);

    for (var v = 0; v <= escala.topo + 0.0001; v += escala.passo) {

    var escalaPct = escalaLinhaLivre(meses.map(function (mes) { return percentuais[mes]; }));
    var yDoPercentual = function (p) {

      return yBaseFaixaLinha - fracao * ALTURA_FAIXA_LINHA;

    var segmentos = [];
    var segmentoAtual = [];
    meses.forEach(function (mes) {

      segmentoAtual.push({ x: centros[mes], y: yDoPercentual(p) });

    if (segmentoAtual.length) segmentos.push(segmentoAtual);

    segmentos.forEach(function (segmento, indiceSegmento) {

          strokeWidth: 2

    meses.forEach(function (mes) {

    var LEGENDA_FONTE = 15;
    var legenda = [

      h("text", { key: "lt1", x: 28, y: 12, style: { fontSize: LEGENDA_FONTE, fill: COR.dim } }, "Lucro Bruto"),
      h("line", { key: "ll2", x1: 190, y1: 7, x2: 208, y2: 7, stroke: COR.brass, strokeWidth: 2 }),
      h("circle", { key: "lc2", cx: 199, cy: 7, r: 4, fill: COR.surface, stroke: COR.brass, strokeWidth: 2 }),
      h("text", { key: "lt2", x: 218, y: 12, style: { fontSize: LEGENDA_FONTE, fill: COR.dim } }, "% Margem Bruta")

    var xLegenda = (SLIDE.largura - larguraLegenda) / 2;

        preserveAspectRatio: "xMidYMid meet",

      },
        h("text", {

  /* Igual a escalaPercentual, mas sem prender o piso em 0% nem o teto em   */
  /* 100%: uma taxa de crescimento pode ser negativa, e a escala precisa    */
  /* acompanhar o dado, nao um limite artificial.                          */
  function escalaLinhaLivre(valores) {
    var validos = valores.filter(function (v) { return v !== null && isFinite(v); });
    var minimo = validos.length ? Math.min.apply(null, validos) : 0;
    var maximo = validos.length ? Math.max.apply(null, validos) : 0.02;
    var AMPLITUDE_MINIMA = 0.02;
    var centro = (minimo + maximo) / 2;
    var metade = Math.max((maximo - minimo) / 2 + 0.005, AMPLITUDE_MINIMA / 2);
    var piso = Math.floor((centro - metade) * 1000) / 1000;
    var teto = Math.ceil((centro + metade) * 1000) / 1000;
    if (teto <= piso) teto = piso + 0.02;
    var passoCru = (teto - piso) / 4;
    var passo = Math.max(0.005, Math.round(passoCru * 1000) / 1000);
    return { piso: piso, teto: teto, passo: passo };
  }

  /* Paleta por ano-safra: cada ano de historico recebe um tom, ciclando se */
  /* passar de quatro anos. Usada so no grafico de LTM, que por natureza    */
  /* sempre abrange varios anos quando tem dado suficiente para existir.    */
  var TONS_POR_ANO = ["#0A2A47", "#216FA8", "#74B4DC", "#B9C0CC"];

  /* Soma de Receita Bruta terminando em "mes" (formato AAAA-MM), inclusive. */
  /* Quando ha 12 meses de historico da empresa disponiveis, soma a janela   */
  /* movel completa (completo:true). Antes disso, soma o que existe desde   */
  /* o inicio do historico (completo:false) — por pedido explicito de Alex, */
  /* que prefere ver o acumulado parcial a nao ver nada, sabendo que a      */
  /* leitura de "ultimos 12 meses" so vale a partir do primeiro ponto       */
  /* completo. O grafico marca visualmente a diferenca entre os dois.       */
  function janelaLTM(dados, mesInicioHistorico, mesAlvo) {
    var partesAlvo = mesAlvo.split("-");
    var indiceAlvo = Number(partesAlvo[0]) * 12 + (Number(partesAlvo[1]) - 1);
    var partesInicio = mesInicioHistorico.split("-");
    var indiceInicio = Number(partesInicio[0]) * 12 + (Number(partesInicio[1]) - 1);
    var mesesDisponiveis = Math.min(12, indiceAlvo - indiceInicio + 1);

    var gruposReceita = (dados.secoesDre ? dados.secoesDre[0].groups : SECOES_DRE[0].groups);
    var soma = 0;
    for (var i = 0; i < mesesDisponiveis; i++) {
      var indiceMes = indiceAlvo - i;
      var mes = Math.floor(indiceMes / 12) + "-" + String((indiceMes % 12) + 1).padStart(2, "0");
      gruposReceita.forEach(function (grupo) {
        soma += dados.grupoMes(grupo, mes);
      });
    }
    return { soma: soma, completo: mesesDisponiveis >= 12 };
  }

  /* Colunas com a soma de Receita Bruta nos ultimos 12 meses (janela       */
  /* movel), e uma linha com o crescimento do LTM contra o LTM do mes       */
  /* anterior. Enquanto a empresa nao tem 12 meses de historico, a barra    */
  /* mostra o acumulado parcial desde o inicio, mais clara e marcada com    */
  /* asterisco: nao e uma leitura de "ultimos 12 meses" ainda, e o rodape   */
  /* do grafico deixa isso explicito sempre que houver alguma barra assim.  */
  function GraficoReceitaBrutaLTM(props) {
    var dados = props.dados;
    var regime = props.regime;

    /* O inicio do historico vem SEMPRE da base inteira (props.todosMeses),  */
    /* nunca do filtro de exibicao: se Alex filtrar a tela pra mostrar so    */
    /* agosto, a janela de 12 meses ainda soma os meses reais anteriores, e  */
    /* o rotulo "completo vs parcial" continua correto. So os meses          */
    /* efetivamente exibidos (props.meses, ja filtrado) ganham barra.        */
    var baseHistorico = props.todosMeses && props.todosMeses.length ? props.todosMeses : props.meses;
    var mesInicioHistorico = baseHistorico.length ? baseHistorico[0] : null;

    var valoresBarra = {};
    var completoBarra = {};
    mesesValidos.forEach(function (mes) {

      completoBarra[mes] = janela.completo;

    mesesValidos.forEach(function (mes, indice) {

      var mesAnterior = mesesValidos[indice - 1];
      var atual = valoresBarra[mes];

      crescimento[mes] = anterior > 0 ? (atual - anterior) / anterior : null;
    });

    var maiorBarra = mesesValidos.reduce(function (maior, mes) {
      return Math.max(maior, valoresBarra[mes]);
    }, 0);

    var temParcial = mesesValidos.some(function (mes) { return !completoBarra[mes]; });

    var moldura = {
      className: "rounded overflow-hidden mx-auto",
      style: {
        background: COR.surface,
        border: "1px solid " + COR.line,
        maxWidth: 1080,
        width: "100%"
      }
    };

    var GAP_LINHA_BARRAS = 36;

        x1: margem.esquerda, y1: y, x2: margem.esquerda + larguraPlot, y2: y,

    mesesValidos.forEach(function (mes) {

      elementosLinha.push(h("text", {

    });

    var larguraTotalLegenda = itensLegenda.reduce(function (s, i) { return s + i.largura; }, 0);
    var xLegenda0 = (SLIDE.largura - larguraTotalLegenda) / 2;

  var escaparXml = function (valor) {

  /* 1 -> A, 27 -> AA */
  function colunaLetra(indice) {
    var letras = "";
    var n = indice;
    while (n > 0) {
      var resto = (n - 1) % 26;
      letras = String.fromCharCode(65 + resto) + letras;
      n = Math.floor((n - 1) / 26);
    }
    return letras;

  var TABELA_CRC32 = (function () {
    var tabela = new Uint32Array(256);
    for (var i = 0; i < 256; i++) {
      var valor = i;
      for (var bit = 0; bit < 8; bit++) {
        valor = valor & 1 ? 3988292384 ^ (valor >>> 1) : valor >>> 1;
      }
      tabela[i] = valor >>> 0;
    }
    return tabela;

  function crc32(bytes) {
    var acumulado = 4294967295;
    for (var i = 0; i < bytes.length; i++) {

    }
    return (acumulado ^ 4294967295) >>> 0;

  /* ZIP store, sem compressao. Recebe [{nome, conteudo}]. */
  function criarZip(arquivos) {
    var codificador = new TextEncoder();
    var partesLocais = [];
    var partesCentral = [];
    var deslocamento = 0;

    var u16 = function (n) { return [n & 255, (n >> 8) & 255]; };
    var u32 = function (n) { return [n & 255, (n >> 8) & 255, (n >> 16) & 255, n >>> 24 & 255]; };

    arquivos.forEach(function (arquivo) {
      var nome = codificador.encode(arquivo.nome);
      var conteudo = codificador.encode(arquivo.conteudo);
      var verificacao = crc32(conteudo);

      var cabecalhoLocal = [].concat(
        u32(67324752), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(verificacao), u32(conteudo.length), u32(conteudo.length),
        u16(nome.length), u16(0)

      partesLocais.push(new Uint8Array(cabecalhoLocal), nome, conteudo);

      partesCentral.push([].concat(
        u32(33639248), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(verificacao), u32(conteudo.length), u32(conteudo.length),
        u16(nome.length), u16(0), u16(0), u16(0), u16(0),
        u32(0), u32(deslocamento)
      ), nome);

      deslocamento += cabecalhoLocal.length + nome.length + conteudo.length;

    var tamanhoCentral = 0;
    for (var i = 0; i < partesCentral.length; i += 2) {
      var cabecalho = new Uint8Array(partesCentral[i]);
      blocosCentral.push(cabecalho, partesCentral[i + 1]);
      tamanhoCentral += cabecalho.length + partesCentral[i + 1].length;

      u32(101010256), u16(0), u16(0),
      u16(arquivos.length), u16(arquivos.length),
      u32(tamanhoCentral), u32(deslocamento), u16(0)

    var todos = partesLocais.concat(blocosCentral, [fimDiretorio]);
    var tamanhoTotal = todos.reduce(function (soma, parte) { return soma + parte.length; }, 0);
    var resultado = new Uint8Array(tamanhoTotal);
    var posicao = 0;
    todos.forEach(function (parte) {
      resultado.set(parte, posicao);

    });

  /* Monta o XML de uma aba a partir de {nome, cols, linhas, freeze, niveis}. */
  function montarPlanilhaXml(planilha) {
    var colunas = planilha.cols.map(function (largura, indice) {
      return '<col min="' + (indice + 1) + '" max="' + (indice + 1) + '" width="' + largura + '" customWidth="1"/>';
    }).join("");

    var linhasXml = planilha.linhas.slice()
      .sort(function (a, b) { return a.r - b.r; })
      .map(function (linha) {
        linha.celulas.sort(function (a, b) { return a.col - b.col; });
        return linha;
      })
      .map(function (linha) {
        var celulas = linha.celulas.map(function (celula) {
          var referencia = colunaLetra(celula.col) + linha.r;
          var estilo = celula.s === undefined ? 0 : celula.s;
          if (celula.f !== undefined) {
            return '<c r="' + referencia + '" s="' + estilo + '"><f>' + escaparXml(celula.f) + '</f></c>';
          }
          if (celula.v === undefined || celula.v === null || celula.v === "") {

          }
          if (typeof celula.v === "number") {
            return '<c r="' + referencia + '" s="' + estilo + '"><v>' + celula.v + '</v></c>';
          }
          return '<c r="' + referencia + '" s="' + estilo + '" t="inlineStr"><is><t xml:space="preserve">'

      return Math.max(maior, l.celulas.reduce(function (m, c) { return Math.max(m, c.col); }, 1));
    }, 1);

      ? '<pane xSplit="' + planilha.freeze.x + '" ySplit="' + planilha.freeze.y
