      /* Margem acumulada de um item: soma do resultado do periodo dividida */
      /* pela soma da receita do periodo, nao a media dos percentuais       */
      /* mensais.                                                          */
      function margemAcumulada(recPorMes, resPorMes) {
        var recAcum = meses.reduce(function (s, mes) { return s + (recPorMes[mes] || 0); }, 0);
        var resAcum = meses.reduce(function (s, mes) { return s + (resPorMes[mes] || 0); }, 0);

      /* Custos e despesas e % margem, igual a qualquer outro item, e        */
      /* mostrada primeiro por ser a visao mais ampla. Clicar nela abre      */
      /* todos os lancamentos de resultado do periodo, sem filtro de         */
      /* projeto/centro: o mecanismo da gaveta ja ignora uma dimensao que    */
      /* nao foi informada, entao basta nao passar valorDimensao nenhum.     */

      var saiGeral = somarTudo("sai");

  /* 11-D. EXPORTACAO DO BP EM XLSX, TUDO EM FORMULA                     */
  /* Gera um .xlsx com a mesma formatacao da BP_QUORUM_Oficial (estilos, */
  /* alturas, larguras, agrupamentos, paineis congelados), lida de um    */
  /* molde extraido da propria planilha (bp_modelo_xlsx.json, baixado so */
  /* na hora de exportar). Nenhum numero do DRE e digitado: tudo e       */
  /* formula sobre as abas Premissas, Impostos e BD Omie, espelhando o   */
  /* motor do BP online. Os valores calculados pelo dashboard vao junto  */
  /* como cache de cada celula; o Excel recalcula tudo ao abrir.         */
  /* ------------------------------------------------------------------ */

  var BP_MODELO_URL = "bp_modelo_xlsx.json";

  /* Linha do molde -> identificador do motor. O molde (bp_modelo_xlsx) */
  /* tem a numeracao da planilha de 24/09/2026, sem a linha 1.08.95: por */
  /* isso esta funcao nao acompanha bpLinhaPlanilha, e a 1.08.95 entra   */
  /* no export como linha inserida (INSERE_APOS_LINHA, depois da 239).   */
  /* null = linha so de formatacao (espacador etc.).                     */
  function bpIdDaLinhaPlanilha(r) {
    var id;
    if (r <= 139) id = r;
    else if (r <= 201) id = r + 1;
    else if (r <= 204) id = r + 2;
    else if (r === 205) id = 203;
    else if (r <= 208) id = null;
    else if (r === 294 || r === 318) id = null;   /* espacadores: as linhas 292 e 316 do motor sao inseridas, nao gravadas por cima */
    else id = r - 2;
    return (id !== null && BP_LINHA[id]) ? id : null;
  }

  function bpX(c) { return colunaLetra(c); }
  function bpNum(v) { return (typeof v === "number" && isFinite(v)) ? String(v) : null; }
  function bpCelVazia(ref, s) { return '<c r="' + ref + '" s="' + s + '"/>'; }
  function bpCelNum(ref, s, v) {
    var n = bpNum(v);
    return n === null ? bpCelVazia(ref, s) : '<c r="' + ref + '" s="' + s + '"><v>' + n + '</v></c>';
  }

            case 4: f = "IFERROR(INDEX(" + aba + "!$F$" + Rv[7] + ":$AO$" + Rv[7] + ",MATCH(" + C + "," + aba + "!$F$5:$AO$5,0)),0)"; break;
            case 5: f = "SUMIFS($D$4:$D$99,$B$4:$B$99,B" + r + ",$C$4:$C$99,\"<=\"&" + C + ")"; break;
            case 6:

                + ",SUMIFS($D$4:$D$99,$C$4:$C$99,\">\"&EDATE(" + C + ",-12),$C$4:$C$99,\"<=\"&" + C + ")))"; break;

              var ini = "DATE(YEAR(" + C + "),INT((MONTH(" + C + ")-1)/3)*3+1,1)";

                + "-MAX(0,SUMIFS($D$4:$D$99,$C$4:$C$99,\">=\"&" + ini + ",$C$4:$C$99,\"<\"&" + C + ")*$V$9-$V$18)*$V$17,0)"; break;

  /* ------------------------------------------------------------------ */
  /* 11-E. EXPORTACAO DA APRESENTACAO DE RESULTADOS (.pptx)              */
  /* Botao "Exportar apresentacao" da tela Financeiro. Usa o molde       */
  /* apresentacao_modelo.json (o .pptx em base64: capa, separador, 10    */
  /* slides de grafico e                                                 */
  /* contracapa, sem nenhum numero: o repositorio e publico) e so        */
  /* sobrescreve nele as imagens ppt/media/grafico{n}.svg/.png e o       */
  /* marcador {{PERIODO}} do separador. Os 10 graficos sao os mesmos da  */
  /* aba Apresentacao, com o regime e o periodo do topo da tela, mas     */
  /* recoloridos para fundo escuro SO no arquivo: a tela segue clara.    */
  /* O grafico vai como SVG (o PowerPoint desenha com a Calibri dele,    */
  /* nitido em qualquer tamanho), com um PNG de reserva para quem abrir  */
  /* em outro programa.                                                   */
  /* ------------------------------------------------------------------ */

  /* O .pptx vai em base64 dentro de um JSON: o webhook de publicacao no */
  /* GitHub so envia texto, e um binario chegaria corrompido.            */
  var APRES_MODELO_URL = "apresentacao_modelo.json";
  var APRES_JSZIP_URL = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";

  /* Biblioteca de zip so e baixada no primeiro clique, para nao pesar a */
  /* abertura do painel.                                                  */
  function apresCarregarJSZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = APRES_JSZIP_URL;
      s.onload = function () { window.JSZip ? resolve(window.JSZip) : reject(new Error("biblioteca de zip não carregou")); };
      s.onerror = function () { reject(new Error("não consegui baixar a biblioteca de zip")); };
      document.head.appendChild(s);
    });
  }

  /* Tema escuro do export. Mapa das cores claras do painel para o fundo  */
  /* escuro do template: texto e linhas claros, barras claras e solidas.  */
  var APRES_TEXTO = {
    "#1B2230": "#FFFFFF",   /* titulos e valores */
    "#4E586B": "#D5DAE1",   /* meses e legenda */
    "#7A8598": "#A9B1BD",   /* eixo, subtitulo, nota */
    "#0A2A47": "#E8EEF5",   /* rotulo dos totais do waterfall */
    "#0D7A52": "#5EE3A6",   /* positivo */
    "#8A6A16": "#F2C75C",   /* percentuais */
    "#B23A2F": "#FF8B7B",   /* negativo */
    "#FFFFFF": "#0B0F17",   /* valor dentro de barra (a barra fica clara) */
    "#0B1A2B": "#0B0F17",   /* valor dentro de segmento que ja era claro */
    "#1F5FA0": "#8EC3EE"    /* percentual dos 3 maiores clientes (grafico 9) */
  };
  var APRES_PREENCHIMENTO = {
    "#0A2A47": "#E8EEF5", "#16497A": "#BFD9F0", "#A6CFE8": "#7FB2DB",
    "#0D7A52": "#5EE3A6", "#B23A2F": "#FF8B7B", "#D3938D": "#FFC4BA",
    "#B9C0CC": "#6F7886",   /* "Outros clientes" */
    "#D8DEE7": "#9AA2AE",   /* "Sem cliente identificado": cinza, longe do branco do 1o cliente */
    "#8A6A16": "#F2C75C",   /* pontos do caixa livre real (grafico 10) */
    "#9DD0B9": "#B4F0D4",   /* FCF projetado positivo (grafico 10) */
    "#FFFFFF": "#000000"    /* miolo dos circulos da linha de % */
  };
  var APRES_TRACO = {
    "#E1E6ED": "#6F7886",   /* grade */
    "#CBD3DE": "#C9D1DC",   /* eixo zero */
    "#7A8598": "#A9B1BD",   /* conectores do waterfall */
    "#8A6A16": "#F2C75C",   /* linha de % */
    "#1F5FA0": "#8EC3EE",   /* linha dos 3 maiores clientes (grafico 9) */
    "#B23A2F": "#FF8B7B",   /* reserva exigida tracejada (grafico 10) */
    "#FFFFFF": "none"       /* separacao entre segmentos: sem contorno sobre a marca d'agua */
  };
  var APRES_CINZA_PARCIAL = "#A3AAB5";   /* barra parcial do LTM, solida */
  var APRES_TITULO_PX = 40, APRES_TITULO_EXPORT_PX = 44;

  function apresHex(c) {
    if (!c) return "";
    c = String(c).trim();
    var m = c.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if (m) return "#" + [m[1], m[2], m[3]].map(function (n) { return ("0" + (+n).toString(16)).slice(-2); }).join("").toUpperCase();
    return c.toUpperCase();
  }

  /* Recolore um SVG ja desenhado e passa os estilos para atributos de   */
  /* apresentacao (fill, font-size...), que e o que o leitor de SVG do    */
  /* PowerPoint respeita com seguranca.                                   */
  function apresTemaEscuro(svg, numero) {
    var XLINK = "http://www.w3.org/1999/xlink";
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    svg.setAttribute("xmlns:xlink", XLINK);
    svg.setAttribute("width", String(SLIDE.largura));
    svg.setAttribute("height", String(SLIDE.altura));
    svg.removeAttribute("style");
    svg.setAttribute("font-family", "Calibri");
    Array.prototype.slice.call(svg.querySelectorAll("*")).forEach(function (el) {
      var tag = el.tagName.toLowerCase();
      if (tag === "text") {
        /* numero do slide (canto inferior direito) sai do export */
        if (el.textContent === String(numero) && el.getAttribute("text-anchor") === "end" && +el.getAttribute("y") > 600) {
          el.parentNode.removeChild(el);
          return;
        }
        var st = el.style;
        var tamanho = parseFloat(st.fontSize);
        if (tamanho === APRES_TITULO_PX) tamanho = APRES_TITULO_EXPORT_PX;
        var cor = apresHex(st.fill || el.getAttribute("fill"));
        if (APRES_TEXTO[cor]) cor = APRES_TEXTO[cor];
        if (cor) el.setAttribute("fill", cor);
        if (tamanho) el.setAttribute("font-size", String(tamanho));
        var peso = parseInt(st.fontWeight, 10);
        if (peso) el.setAttribute("font-weight", peso >= 600 ? "bold" : "normal");
        if (st.fontStyle) el.setAttribute("font-style", st.fontStyle);
        if (st.letterSpacing) el.setAttribute("letter-spacing", parseFloat(st.letterSpacing));
        el.setAttribute("font-family", "Calibri");
        el.removeAttribute("style");
        return;
      }
      if (tag === "image") {
        /* logotipo preto vira branco: inverte os pixels, que e o que   */
        /* sobrevive no PowerPoint (filtro CSS nao)                      */
        var href = el.getAttribute("href") || el.getAttributeNS(XLINK, "href");
        if (href) el.setAttributeNS(XLINK, "xlink:href", href);
        el.setAttribute("data-inverter", "1");
        return;
      }
      var op = el.getAttribute("fill-opacity");
      if (tag === "rect" && op && +op < 1) {
        el.removeAttribute("fill-opacity");
        el.setAttribute("fill", APRES_CINZA_PARCIAL);
        return;
      }
      var fill = apresHex(el.getAttribute("fill"));
      if (fill && APRES_PREENCHIMENTO[fill]) el.setAttribute("fill", APRES_PREENCHIMENTO[fill]);
      var stroke = apresHex(el.getAttribute("stroke"));
      if (stroke && APRES_TRACO[stroke]) el.setAttribute("stroke", APRES_TRACO[stroke]);
      if (tag === "line" && stroke === "#E1E6ED") el.setAttribute("stroke-opacity", "0.55");
    });
    return svg;
  }

  /* Inverte as cores de uma imagem (data URI) num canvas: o logotipo     */
  /* preto do painel vira branco no fundo escuro.                         */
  function apresInverterImagem(dataUri) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement("canvas");
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        var ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0);
        var px = ctx.getImageData(0, 0, c.width, c.height);
        for (var i = 0; i < px.data.length; i += 4) {
          px.data[i] = 255 - px.data[i]; px.data[i + 1] = 255 - px.data[i + 1]; px.data[i + 2] = 255 - px.data[i + 2];
        }
        ctx.putImageData(px, 0, 0);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = function () { reject(new Error("não consegui processar o logotipo")); };
      img.src = dataUri;
    });
  }

  /* Desenha um grafico fora da tela e devolve o texto do SVG ja no tema */
  /* escuro.                                                              */
  function apresRenderizarGrafico(elemento, numero) {
    var caixa = document.createElement("div");
    caixa.style.position = "fixed"; caixa.style.left = "-20000px"; caixa.style.top = "0"; caixa.style.width = "1280px";
    document.body.appendChild(caixa);
    var raiz = ReactDOM.createRoot(caixa);
    ReactDOM.flushSync(function () { raiz.render(elemento); });
    var original = caixa.querySelector("svg");
    if (!original) { raiz.unmount(); document.body.removeChild(caixa); return Promise.reject(new Error("gráfico " + numero + " sem dados no período")); }
    var svg = apresTemaEscuro(original.cloneNode(true), numero);
    raiz.unmount(); document.body.removeChild(caixa);
    var imagens = Array.prototype.slice.call(svg.querySelectorAll("image[data-inverter]"));
    return Promise.all(imagens.map(function (el) {
      var XLINK = "http://www.w3.org/1999/xlink";
      return apresInverterImagem(el.getAttributeNS(XLINK, "href") || el.getAttribute("href")).then(function (novo) {
        el.setAttribute("href", novo); el.setAttributeNS(XLINK, "xlink:href", novo); el.removeAttribute("data-inverter");
      });
    })).then(function () { return new XMLSerializer().serializeToString(svg); });
  }

  /* PNG de reserva do SVG, com fundo transparente. */
  function apresSvgParaPng(textoSvg, largura, altura) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement("canvas");
        c.width = largura; c.height = altura;
        c.getContext("2d").drawImage(img, 0, 0, largura, altura);
        c.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error("falha ao gerar PNG")); }, "image/png");
      };
      img.onerror = function () { reject(new Error("falha ao desenhar o gráfico em PNG")); };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(textoSvg);
    });
  }

  function apresEscaparXml(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* Gera o .pptx inteiro. Recebe o mesmo contexto da aba Apresentacao.  */
  function apresGerar(ctx) {
    var props = { dados: ctx.dados, meses: ctx.meses, regime: ctx.regime };
    var graficos = [
      h(GraficoReceitaBruta, Object.assign({ numero: 1 }, props)),
      h(GraficoReceitaPorCliente, Object.assign({ numero: 2 }, props)),
      h(GraficoReceitaBrutaLTM, Object.assign({ numero: 3, todosMeses: ctx.todosMeses }, props)),
      h(GraficoReceitaLiquida, Object.assign({ numero: 4 }, props)),
      h(GraficoLucroBruto, Object.assign({ numero: 5 }, props)),
      h(GraficoEBITDA, Object.assign({ numero: 6 }, props)),
      h(GraficoWaterfallDRE, Object.assign({ numero: 7 }, props)),
      h(GraficoWaterfallDRE, Object.assign({ numero: 8, ateFluxoCaixa: true, titulo: "FLUXO DE CAIXA LIVRE" }, props)),
      h(GraficoConcentracao, Object.assign({ numero: 9, todosMeses: ctx.todosMeses }, props)),
      h(GraficoFCFProjetado, { projecao: ctx.projecao, numero: 10 })
    ];
    var periodo = ctx.meses.length
      ? rotuloMes(ctx.meses[0]) + " a " + rotuloMes(ctx.meses[ctx.meses.length - 1])
      : "sem período";
    var textoPeriodo = periodo + " · regime de " + (ctx.regime === "caixa" ? "caixa" : "competência");

    return Promise.all([
      apresCarregarJSZip(),
      fetch(APRES_MODELO_URL, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("molde da apresentação indisponível (HTTP " + r.status + ")");
        return r.json();
      })
    ]).then(function (res) {
      if (!res[1] || !res[1].pptx_base64) throw new Error("molde da apresentação sem o arquivo");
      return res[0].loadAsync(res[1].pptx_base64, { base64: true });
    }).then(function (zip) {
      /* um grafico de cada vez: cada um monta e desmonta sua propria raiz */
      var cadeia = Promise.resolve();
      graficos.forEach(function (elemento, i) {
        var n = i + 1;
        cadeia = cadeia.then(function () {
          if (!zip.file("ppt/media/grafico" + n + ".svg")) throw new Error("molde sem o espaço do gráfico " + n);
          return apresRenderizarGrafico(elemento, n).then(function (textoSvg) {
            zip.file("ppt/media/grafico" + n + ".svg", textoSvg);
            return apresSvgParaPng(textoSvg, 1920, 1080).then(function (png) {
              zip.file("ppt/media/grafico" + n + ".png", png);
            });
          });
        });
      });
      return cadeia.then(function () {
        /* periodo no subtitulo do separador */
        var slides = Object.keys(zip.files).filter(function (nome) { return /^ppt\/slides\/slide\d+\.xml$/.test(nome); });
        return Promise.all(slides.map(function (nome) {
          return zip.file(nome).async("string").then(function (xml) {
            if (xml.indexOf("{{PERIODO}}") >= 0) zip.file(nome, xml.split("{{PERIODO}}").join(apresEscaparXml(textoPeriodo)));
          });
        }));
      }).then(function () {
        return zip.generateAsync({
          type: "blob", compression: "DEFLATE",
          mimeType: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        });
      });
    });
  }

  function apresBaixar(blob, nomeArquivo) {
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url; link.download = nomeArquivo;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /* ------------------------------------------------------------------ */
  /* 12. MONTAGEM                                                        */
  /* ------------------------------------------------------------------ */

  window.__PainelRealizado = Painel;
})();
</script>
<script>
(function () {
  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(window.__PainelRealizado));
})();
</script>
