  /* Monta o pacote xlsx completo e dispara o download. */
  function baixarXlsx(planilhas, nomeArquivo) {
    var nomes = planilhas.map(function (p) { return p.nome; });

    var arquivos = [
      {
        nome: "[Content_Types].xml",
        conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
          + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">\n'
          + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>\n'
          + '<Default Extension="xml" ContentType="application/xml"/>\n'
          + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>\n'
          + planilhas.map(function (p, i) {
              return '<Override PartName="/xl/worksheets/sheet' + (i + 1)
                + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
            }).join("") + '\n'
          + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>\n'
          + '</Types>'
      },
      {
        nome: "_rels/.rels",
        conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
          + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">\n'
          + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>\n'
          + '</Relationships>'
      },
      {
        nome: "xl/workbook.xml",
        conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
          + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">\n'
          + '<sheets>' + nomes.map(function (nome, i) {
              return '<sheet name="' + escaparXml(nome) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
            }).join("") + '</sheets>\n'
          + '</workbook>'
      },
      {
        nome: "xl/_rels/workbook.xml.rels",
        conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
          + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">\n'
          + planilhas.map(function (p, i) {
              return '<Relationship Id="rId' + (i + 1)
                + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'
                + (i + 1) + '.xml"/>';
            }).join("") + '\n'
          + '<Relationship Id="rId' + (planilhas.length + 1)
          + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>\n'
          + '</Relationships>'
      },
      { nome: "xl/styles.xml", conteudo: STYLES_XML }
    ].concat(planilhas.map(function (planilha, i) {
      return { nome: "xl/worksheets/sheet" + (i + 1) + ".xml", conteudo: montarPlanilhaXml(planilha) };
    }));

    var bytes = criarZip(arquivos);
    var blob = new Blob([bytes], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = nomeArquivo;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /* ------------------------------------------------------------------ */
  /* 10. PREFERENCIAS E ENTRADA DE DADOS                                 */
  /* ------------------------------------------------------------------ */

  /* localStorage sem quebrar a pagina se estiver bloqueado no navegador. */
  var armazenamento = {
    getItem: function (chave) {
      try { return window.localStorage.getItem(chave); } catch (e) { return null; }
    },
    setItem: function (chave, valor) {
      try { window.localStorage.setItem(chave, valor); } catch (e) {}
    },
    removeItem: function (chave) {
      try { window.localStorage.removeItem(chave); } catch (e) {}
    }
  };

  var URL_API = window.__QUORUM_API__ || "";

  /* Versao do contrato que este painel sabe ler, e os campos sem os quais */
  /* nao ha calculo confiavel. As duas travas existem pela mesma razao: um */
  /* numero errado com cara de numero certo e pior que nenhum numero. Se o */
  /* workflow do n8n e o painel divergirem — rascunho publicado sem o     */
  /* outro, campo removido, renomeado — o painel para e explica o que      */
  /* falta, em vez de calcular em cima de um buraco.                       */
  var CONTRATO_ESPERADO = 2;
  var CAMPOS_OBRIGATORIOS = ["contrato", "categorias", "linhas"];

  /* Confere o payload antes de qualquer calculo. Devolve null se estiver  */
  /* tudo certo, ou uma mensagem pronta pra tela se faltar algo.           */
  function validarContrato(dados) {
    if (!dados || typeof dados !== "object") {
      return "A base voltou vazia ou em formato inesperado.";
    }
    var faltando = CAMPOS_OBRIGATORIOS.filter(function (campo) {
      return !(campo in dados);
    });
    if (faltando.length) {
      return "A base voltou sem o(s) campo(s) " + faltando.join(", ") + ". "
        + "O workflow do n8n provavelmente está com o rascunho e a produção "
        + "divergentes — publique o workflow (versão de contrato "
        + CONTRATO_ESPERADO + ") antes de usar este painel.";
    }
    if (Number(dados.contrato) !== CONTRATO_ESPERADO) {
      return "Este painel espera o contrato " + CONTRATO_ESPERADO
        + " e a base veio na versão " + dados.contrato + ". "
        + "Publique o workflow do n8n (ou o painel, se o n8n já estiver na "
        + "versão certa) antes de confiar nestes números.";
    }
    if (!Array.isArray(dados.categorias) || !dados.categorias.length) {
      return "A base veio sem catálogo de categorias. Sem ele o painel não "
        + "sabe classificar nenhum lançamento — confira o workflow no n8n.";
    }
    return null;
  }

  /* Descobre o nome da contraparte e de onde ele veio. */
  function resolverContraparte(linha) {
    var cadastrada = (linha.contraparte || "").trim();
    if (cadastrada) return { nome: cadastrada, origem: "cadastro" };

    var porNatureza = CONTRAPARTE_POR_NATUREZA[linha.codigo_categoria];
    if (porNatureza) return { nome: porNatureza, origem: "natureza" };

    if (linha.documento) {
      return { nome: linha.conta + " · " + linha.documento, origem: "natureza" };
    }
    return { nome: linha.conta || "Sem contraparte", origem: "natureza" };
  }

  /* Converte uma linha crua da API no formato que o motor de calculo usa. */
  function normalizarLinha(linha, indice) {
    var contraparte = resolverContraparte(linha);
    return {
      id: linha.id || "L" + indice,
      idTitulo: linha.id || "",
      idMovimento: linha.id_movimento || "",
      grupo: linha.grupo,
      categoria: linha.categoria,
      codigoCategoria: linha.codigo_categoria || "",
      codigoGrupo: linha.codigo_grupo || "",
      conta: linha.conta,
      situacao: linha.situacao,
      liquidado: String(linha.liquidado || "").toUpperCase() === "S",
      documento: linha.documento || "",
      contraparte: contraparte.nome,
      contraOrigem: contraparte.origem,
      nota: "",
      projeto: linha.projeto || "Sem projeto",
      centro: linha.centro || "Sem centro de custo",
      valor: Number(linha.valor_pago || linha.valor_titulo || 0),
      dPag: paraData(linha.pagamento),
      dEmi: paraData(linha.emissao)
    };
  }


  /* ------------------------------------------------------------------ */
  /* 10-A. TELA DE LOGIN                                                 */
  /* Substitui a chave na URL por uma senha guardada no navegador.       */
  /* A senha nunca e validada aqui: e so enviada ao n8n por header, que   */
  /* e quem decide se ela e valida.                                      */
  /* ------------------------------------------------------------------ */

  function TelaLogin(props) {
    var estValor = useState("");
    var valor = estValor[0], setValor = estValor[1];

    function enviar(evento) {
      if (evento && evento.preventDefault) evento.preventDefault();
      var limpo = valor.trim();
      if (!limpo) return;
      props.aoEntrar(limpo);
    }

    return h("div", {
      className: "min-h-screen w-full flex items-center justify-center p-6",
      style: { background: COR.bg, color: COR.text }
    },
      h("form", { onSubmit: enviar, className: "max-w-sm w-full" },
        h("div", {
          className: "uppercase mb-2",
          style: { fontSize: 10, letterSpacing: "0.3em", color: COR.brass }
        }, "QUORUM"),
        h("h1", {
          className: "text-2xl mb-1",
          style: { fontWeight: 300, letterSpacing: "-0.01em" }
        }, "Dashboard Financeiro"),
        h("p", {
          className: "text-sm mb-5",
          style: { color: COR.faint }
        }, "Digite a senha para continuar."),
        h("input", {
          type: "password",
          autoFocus: true,
          value: valor,
          onChange: function (evento) { setValor(evento.target.value); },
          placeholder: "senha",
          className: "w-full px-3 py-2.5 rounded mb-3",
          style: {
            fontSize: 14,
            background: COR.surface,
            border: "1px solid " + (props.erro ? COR.coral : COR.line),
            color: COR.text,
            outline: "none"
          }
        }),
        props.erro && h("div", {
          className: "text-sm mb-3",
          style: { color: COR.coral }
        }, props.erro),
        h("button", {
          type: "submit",
          className: "w-full py-2.5 rounded text-sm",
          style: { background: COR.brass, color: "#FFFFFF", fontWeight: 600 }
        }, props.entrando ? "Entrando..." : "Entrar")
      )
    );
  }

  /* ------------------------------------------------------------------ */
  /* 11. PAINEL                                                          */
  /* ------------------------------------------------------------------ */

  function Painel() {
    var estLinhas = useState(null);            var linhas = estLinhas[0],        setLinhas = estLinhas[1];
    var estAbertos = useState([]);             var emAberto = estAbertos[0],     setEmAberto = estAbertos[1];
    var estResposta = useState(null);          var resposta = estResposta[0],    setResposta = estResposta[1];
    var estCarregando = useState(true);        var carregando = estCarregando[0], setCarregando = estCarregando[1];
    var estAtualizado = useState(null);        var atualizadoEm = estAtualizado[0], setAtualizadoEm = estAtualizado[1];

    var estRegime = useState(function () {
      return armazenamento.getItem("quorum_regime") || "caixa";
    });
    var regime = estRegime[0], setRegime = estRegime[1];

    var estAba = useState("dre");              var aba = estAba[0], setAba = estAba[1];

    var estDetalhe = useState(function () {
      return armazenamento.getItem("quorum_detalhe") !== "0";
    });
    var mostrarDetalhe = estDetalhe[0], setMostrarDetalhe = estDetalhe[1];

    var estZeradas = useState(function () {
      return armazenamento.getItem("quorum_zeradas") === "1";
    });
    var mostrarZeradas = estZeradas[0], setMostrarZeradas = estZeradas[1];

    /* Selecao livre de meses a exibir. Nulo = mostra todos (padrao). O    */
    /* filtro so recorta o que aparece na tela: saldo de conta, achados e  */
    /* o LTM continuam calculados sobre a base inteira por baixo, so a     */
    /* lista de colunas exibidas encolhe.                                  */
    var estMesesSel = useState(function () {
      try {
        var salvo = armazenamento.getItem("quorum_meses_sel");
        return salvo ? JSON.parse(salvo) : null;
      } catch (e) { return null; }
    });
    var mesesSelecionados = estMesesSel[0], setMesesSelecionados = estMesesSel[1];

    var estFiltroMesesAberto = useState(false);
    var filtroMesesAberto = estFiltroMesesAberto[0], setFiltroMesesAberto = estFiltroMesesAberto[1];

    var estGaveta = useState(null);            var gaveta = estGaveta[0], setGaveta = estGaveta[1];
    var estAviso = useState("");               var aviso = estAviso[0], setAviso = estAviso[1];

    /* Autenticacao: chave lida da URL antiga (?k=) ou da memoria do        */
    /* navegador. Nula significa "mostrar tela de login".                  */
    var estChave = useState(function () {
      var daUrl = new URLSearchParams(window.location.search).get("k");
      return daUrl || armazenamento.getItem("quorum_chave") || null;
    });
    var chave = estChave[0], setChave = estChave[1];
    var estErroLogin = useState("");            var erroLogin = estErroLogin[0], setErroLogin = estErroLogin[1];
    var estEntrando = useState(false);          var entrando = estEntrando[0], setEntrando = estEntrando[1];

    var campoData = regime === "caixa" ? "dPag" : "dEmi";

    /* Limpa o ?k= da barra de enderecos assim que a chave foi capturada,   */
    /* e guarda a chave na memoria do navegador para as proximas visitas.   */
    useEffect(function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get("k")) {
        window.history.replaceState({}, "", window.location.pathname + window.location.hash);
      }
    }, []);
    useEffect(function () {
      if (chave) armazenamento.setItem("quorum_chave", chave);
    }, [chave]);

    /* Preferencias persistidas entre visitas. */
    useEffect(function () { armazenamento.setItem("quorum_regime", regime); }, [regime]);
    useEffect(function () { armazenamento.setItem("quorum_detalhe", mostrarDetalhe ? "1" : "0"); }, [mostrarDetalhe]);
    useEffect(function () { armazenamento.setItem("quorum_zeradas", mostrarZeradas ? "1" : "0"); }, [mostrarZeradas]);
    useEffect(function () {
      if (mesesSelecionados === null) { armazenamento.removeItem("quorum_meses_sel"); return; }
      armazenamento.setItem("quorum_meses_sel", JSON.stringify(mesesSelecionados));
    }, [mesesSelecionados]);

    /* Busca a base na Omie, via webhook. A senha vai por header, nunca   */
    /* mais pela URL. Uma recusa 401 derruba a sessao e volta pra tela de  */
    /* login, em vez de cair no aviso vermelho generico de erro de rede.   */
    function buscarBase(forcar) {
      if (!URL_API) {
        setAviso("A URL da base não foi configurada nesta página. Fale com o Alex.");
        setCarregando(false);
        return Promise.resolve();
      }
      if (!chave) return Promise.resolve();
      setCarregando(true);
      setEntrando(true);
      setAviso("");
      var cabecalhos = { "x-quorum-key": chave };
      /* "Atualizar agora" sempre pula o cache do n8n; carregamento normal */
      /* de pagina usa o cache quando ele existe e esta dentro do TTL.     */
      if (forcar) cabecalhos["x-forcar-atualizacao"] = "1";
      return fetch(URL_API, { cache: "no-store", headers: cabecalhos })
        .then(function (r) {
          if (r.status === 401) {
            var recusado = new Error("Senha incorreta.");
            recusado.autenticacaoRecusada = true;
            throw recusado;
          }
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (dados) {
          var problema = validarContrato(dados);
          if (problema) {
            setAviso(problema);
            setLinhas(null);
            setEmAberto(null);
            setResposta(null);
            return;
          }
          /* O catalogo tem que ser aplicado antes de normalizar e calcular: */
          /* e ele que diz quais categorias existem, como se chamam, quais   */
          /* estao inativas e em que secao cada grupo entra.                 */
          aplicarCatalogo(dados.categorias);
          var realizadas = (dados.linhas || []).map(normalizarLinha).filter(function (l) { return l.dPag; });
          var futuras = (dados.linhas || []).filter(function (l) { return !l.pagamento; });
          setLinhas(realizadas);
          setEmAberto(futuras);
          setResposta(dados);
          setAtualizadoEm(new Date());
          setGaveta(null);
          setErroLogin("");
        })
        .catch(function (erro) {
          if (erro && erro.autenticacaoRecusada) {
            armazenamento.removeItem("quorum_chave");
            setChave(null);
            setErroLogin("Senha incorreta. Tenta de novo.");
            return;
          }
          setAviso("Não consegui buscar a base agora: " + erro.message + ". Tenta de novo em alguns segundos.");
        })
        .then(function () { setCarregando(false); setEntrando(false); });
    }

    useEffect(function () { if (chave) buscarBase(); }, [chave]);

    var dados = useMemo(function () {
      return linhas ? calcular(linhas, regime) : null;
    }, [linhas, regime]);

    /* ---------------------------------------------------------------- */
    /* Exportacao: tres abas, todas as celulas em formula sobre BD Contas */
    /* ---------------------------------------------------------------- */

    function exportarXlsx() {
      if (!dados) return;

      var qtdMeses = meses.length;
      var COL_PRIMEIRO_MES = 4;
      var COL_ACUMULADO = COL_PRIMEIRO_MES + qtdMeses;
      var col = colunaLetra;

      var lancamentos = dados.usadas.slice().sort(function (a, b) {
        return (a.dataRegime || 0) - (b.dataRegime || 0);
      });

      /* ---------------- Aba 3: BD Contas ---------------- */

      var abaBase = {
        nome: "BD Contas",
        cols: [20, 34, 40, 30, 16, 34, 13, 13, 14, 60, 22],
        linhas: [],
        freeze: { x: 0, y: 1 },
        niveis: 0
      };

      var cabecalhosBase = [
        "Tipo", "Grupo", "Categoria", "Conta Corrente", "Situação",
        "Cliente ou Fornecedor", "Data de Emissão", "Data de Pagto ou Recbto",
        "Pago ou Recebido", "Observação", "Data Competência (efetiva)"
      ];

      abaBase.linhas.push({
        r: 1,
        celulas: cabecalhosBase.map(function (titulo, i) {
          return { col: i + 1, v: titulo, s: MAPA_ESTILOS.bdCab[0] };
        })
      });

      lancamentos.forEach(function (l, i) {
        abaBase.linhas.push({
          r: i + 2,
          celulas: [
            { col: 1, v: l.valor >= 0 ? "1. Contas a Receber" : "2. Contas a Pagar", s: MAPA_ESTILOS.bd[0] },
            { col: 2, v: l.grupo, s: MAPA_ESTILOS.bd[0] },
            { col: 3, v: l.categoria, s: MAPA_ESTILOS.bd[0] },
            { col: 4, v: l.conta, s: MAPA_ESTILOS.bd[0] },
            { col: 5, v: l.situacao, s: MAPA_ESTILOS.bd[0] },
            { col: 6, v: l.contraparte, s: MAPA_ESTILOS.bd[0] },
            { col: 7, v: l.dEmi ? dataParaSerial(l.dEmi) : "", s: 17 },
            { col: 8, v: l.dPag ? dataParaSerial(l.dPag) : "", s: 17 },
            { col: 9, v: l.valor, s: MAPA_ESTILOS.bd[1] },
            { col: 10, v: l.nota, s: MAPA_ESTILOS.bd[0] },
            { col: 11, v: (l.dEmi || l.dPag) ? dataParaSerial(l.dEmi || l.dPag) : "", s: 17 }
          ]
        });
      });

      /* Fragmentos de formula reutilizados nas duas abas de cima. */
      var ultimaLinhaBase = lancamentos.length + 1;
      var BASE = "'BD Contas'";
      /* Em competencia a formula aponta para a coluna K, que ja tem o     */
      /* fallback para data de pagamento quando nao ha nota fiscal — a      */
      /* mesma regra usada na tela. Sem isso, o XLSX exportado subestimaria */
      /* despesas sem nota fiscal, mesmo com a tela mostrando o valor certo.*/
      var COL_DATA = campoData === "dPag" ? "$H" : "$K";
      var FAIXA_VALOR = BASE + "!$I$2:$I$" + ultimaLinhaBase;

      var criterioMes = function (colunaMes) {
        return BASE + "!" + COL_DATA + "$2:" + COL_DATA + "$" + ultimaLinhaBase + ',">="&' + colunaMes + "$3,"
             + BASE + "!" + COL_DATA + "$2:" + COL_DATA + "$" + ultimaLinhaBase + ',"<"&EDATE(' + colunaMes + "$3,1)";
      };
      var somaCategoria = function (grupo, categoria, colunaMes) {
        return "SUMIFS(" + FAIXA_VALOR
          + "," + BASE + "!$B$2:$B$" + ultimaLinhaBase + ',"' + grupo + '"'
          + "," + BASE + "!$C$2:$C$" + ultimaLinhaBase + ',"' + categoria + '"'
          + "," + criterioMes(colunaMes) + ")";
      };
      var saldoAcumuladoConta = function (conta, colunaMes) {
        return "SUMIFS(" + FAIXA_VALOR
          + "," + BASE + "!$D$2:$D$" + ultimaLinhaBase + ',"' + conta + '"'
          + "," + BASE + "!" + COL_DATA + "$2:" + COL_DATA + "$" + ultimaLinhaBase
          + ',"<"&EDATE(' + colunaMes + "$3,1))";
      };

      var largurasColunas = [3, 3, 52].concat(meses.map(function () { return 14; }), [15]);

      /* ---------------- Aba 1: Quorum Novo ---------------- */

      var abaQuorum = {
        nome: "Quorum Novo",
        cols: largurasColunas,
        linhas: [],
        freeze: { x: 3, y: 3 },
        niveis: 1
      };
      var linhaAtual = 1;

      /* Escreve uma linha de rotulo mais uma formula por mes. Devolve o numero da linha. */
      function escreverLinha(nivel, rotulo, formulaPorColuna, outline) {
        var estilo = MAPA_ESTILOS[nivel] || MAPA_ESTILOS.item;
        var celulas = [{ col: 3, v: rotulo, s: estilo[0] }];
        for (var i = 0; i < qtdMeses; i++) {
          celulas.push({
            col: COL_PRIMEIRO_MES + i,
            f: formulaPorColuna ? formulaPorColuna(col(COL_PRIMEIRO_MES + i)) : undefined,
            s: estilo[1]
          });
        }
        celulas.push({
          col: COL_ACUMULADO,
          f: formulaPorColuna
            ? (nivel === "pct"
                ? formulaPorColuna(col(COL_ACUMULADO))
                : "SUM(" + col(COL_PRIMEIRO_MES) + linhaAtual + ":" + col(COL_ACUMULADO - 1) + linhaAtual + ")")
            : undefined,
          s: estilo[1]
        });
        abaQuorum.linhas.push({ r: linhaAtual, celulas: celulas, outline: outline || 0 });
        return linhaAtual++;
      }

      function linhaVazia() {
        abaQuorum.linhas.push({ r: linhaAtual, celulas: [], altura: 3 });
        linhaAtual++;
      }

      abaQuorum.linhas.push({
        r: 1,
        celulas: [{
          col: 3,
          v: "QUORUM | Realizado por categoria — regime de "
            + (campoData === "dPag" ? "caixa" : "competência")
            + " — gerado em " + (resposta ? resposta.gerado_em : ""),
          s: 13
        }]
      });

      linhaAtual = 2;
      abaQuorum.linhas.push({
        r: 2,
        celulas: [{ col: 3, v: "", s: 0 }].concat(meses.map(function (mes, i) {
          return { col: COL_PRIMEIRO_MES + i, v: i + 1, s: 15 };
        }))
      });

      abaQuorum.linhas.push({
        r: 3,
        celulas: [{ col: 3, v: "Realizado Quorum", s: MAPA_ESTILOS.cabLabel[0] }]
          .concat(meses.map(function (mes, i) {
            var partes = mes.split("-");
            return {
              col: COL_PRIMEIRO_MES + i,
              v: dataParaSerial(new Date(Number(partes[0]), Number(partes[1]) - 1, 1)),
              s: MAPA_ESTILOS.cabLabel[1]
            };
          }))
          .concat([{ col: COL_ACUMULADO, v: "Acumulado", s: MAPA_ESTILOS.cabLabel[0] }])
      });

      abaQuorum.linhas.push({ r: 4, celulas: [], altura: 3 });
      linhaAtual = 5;

      /* Escreve uma secao inteira: itens, grupos e o total da secao. */
      var linhaDaSecao = {};
      function escreverSecao(secao) {
        var linhaTotalSecao = linhaAtual++;
        var linhasDeGrupo = [];

        secao.groups.forEach(function (nomeGrupo) {
          var bloco = PLANO_DE_CONTAS.filter(function (b) { return b.grupo === nomeGrupo; })[0];
          if (!bloco) return;

          var linhaGrupo = linhaAtual++;
          var linhasDeItem = [];

          bloco.itens.forEach(function (item) {
            var categoria = item[0];
            linhasDeItem.push(escreverLinha("item", "      " + categoria, function (colunaMes) {
              return somaCategoria(nomeGrupo, categoria, colunaMes);
            }, 1));
          });

          abaQuorum.linhas.push({
            r: linhaGrupo,
            celulas: [{ col: 3, v: "   " + nomeGrupo, s: MAPA_ESTILOS.grupo[0] }]
              .concat(Array.from({ length: qtdMeses + 1 }, function (vazio, i) {
                var letra = col(COL_PRIMEIRO_MES + i);
                return {
                  col: COL_PRIMEIRO_MES + i,
                  f: "SUM(" + letra + linhasDeItem[0] + ":" + letra + linhasDeItem[linhasDeItem.length - 1] + ")",
                  s: MAPA_ESTILOS.grupo[1]
                };
              }))
          });

          linhasDeGrupo.push(linhaGrupo);
          abaQuorum.linhas.push({ r: linhaAtual, celulas: [], altura: 3 });
          linhaAtual++;
        });

        abaQuorum.linhas.push({
          r: linhaTotalSecao,
          celulas: [{ col: 3, v: secao.label, s: MAPA_ESTILOS.secao[0] }]
            .concat(Array.from({ length: qtdMeses + 1 }, function (vazio, i) {
              var letra = col(COL_PRIMEIRO_MES + i);
              return {
                col: COL_PRIMEIRO_MES + i,
                f: linhasDeGrupo.map(function (n) { return letra + n; }).join("+"),
                s: MAPA_ESTILOS.secao[1]
              };
            }))
        });

        linhaDaSecao[secao.key] = linhaTotalSecao;
      }

      escreverSecao(dados.secoesDre[0]);
      linhaVazia();
      escreverSecao(dados.secoesDre[1]);

      var linhaReceitaLiquida = escreverLinha("total", "(=) Receita Líquida", function (c) {
        return c + linhaDaSecao.receita + "+" + c + linhaDaSecao.impostos;
      });
      escreverLinha("pct", "% Receita Líquida", function (c) {
        return "IFERROR(" + c + linhaReceitaLiquida + "/" + c + linhaDaSecao.receita + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[2]);

      var linhaLucroBruto = escreverLinha("total", "(=) Lucro Bruto", function (c) {
        return c + linhaReceitaLiquida + "+" + c + linhaDaSecao.custo;
      });
      escreverLinha("pct", "% Lucro Bruto", function (c) {
        return "IFERROR(" + c + linhaLucroBruto + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[3]);

      var linhaEbitda = escreverLinha("total", "(=) EBITDA", function (c) {
        return c + linhaLucroBruto + "+" + c + linhaDaSecao.despesas;
      });
      escreverLinha("pct", "% EBITDA", function (c) {
        return "IFERROR(" + c + linhaEbitda + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[4]);
      escreverSecao(dados.secoesDre[5]);
      escreverSecao(dados.secoesDre[6]);
      escreverSecao(dados.secoesDre[7]);
      linhaVazia();

      var linhaEbit = escreverLinha("total", "(=) Resultado Antes de Impostos", function (c) {
        return c + linhaEbitda + "+" + c + linhaDaSecao.finRec + "+" + c + linhaDaSecao.finDesp
          + "+" + c + linhaDaSecao.outrasRec + "+" + c + linhaDaSecao.outrasDesp;
      });
      escreverLinha("pct", "% EBIT", function (c) {
        return "IFERROR(" + c + linhaEbit + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();
      escreverSecao(dados.secoesDre[8]);

      var linhaLucroLiquido = escreverLinha("total", "(=) Lucro Líquido", function (c) {
        return c + linhaEbit + "+" + c + linhaDaSecao.impLucro;
      });

      var linhaResultadoAcumulado = linhaAtual++;
      abaQuorum.linhas.push({
        r: linhaResultadoAcumulado,
        celulas: [{ col: 3, v: "(=) Resultado Acumulado", s: MAPA_ESTILOS.secao[0] }]
          .concat(meses.map(function (mes, i) {
            var letra = col(COL_PRIMEIRO_MES + i);
            return {
              col: COL_PRIMEIRO_MES + i,
              f: i === 0
                ? letra + linhaLucroLiquido
                : col(COL_PRIMEIRO_MES + i - 1) + linhaResultadoAcumulado + "+" + letra + linhaLucroLiquido,
              s: MAPA_ESTILOS.secao[1]
            };
          }))
          .concat([{
            col: COL_ACUMULADO,
            f: col(COL_ACUMULADO - 1) + linhaResultadoAcumulado,
            s: MAPA_ESTILOS.secao[1]
          }])
      });

      escreverLinha("pct", "% Lucro Líquido", function (c) {
        return "IFERROR(" + c + linhaLucroLiquido + "/" + c + linhaReceitaLiquida + ",0)";
      });
      linhaVazia();

      abaQuorum.linhas.push({ r: linhaAtual++, celulas: [{ col: 3, v: "Fluxo de Caixa", s: 9 }] });
      linhaVazia();

      var linhaLucroNoFluxo = escreverLinha("secao", "(=) Lucro Líquido do período", function (c) {
        return c + linhaLucroLiquido;
      });
      linhaVazia();
      dados.secoesFluxo.forEach(function (secao) { escreverSecao(secao); });

      var linhaFcl = escreverLinha("total", "(=) Fluxo de Caixa Livre do mês", function (c) {
        return c + linhaLucroNoFluxo + "+" + c + linhaDaSecao.entradas + "+" + c + linhaDaSecao.saidas
          + "+" + c + linhaDaSecao.ativo + "+" + c + linhaDaSecao.capex + "+" + c + linhaDaSecao.transf;
      });

      var linhaSaldoAcumulado = linhaAtual++;
      abaQuorum.linhas.push({
        r: linhaSaldoAcumulado,
        celulas: [{ col: 3, v: "(=) Saldo acumulado, todas as contas", s: MAPA_ESTILOS.secao[0] }]
          .concat(meses.map(function (mes, i) {
            var letra = col(COL_PRIMEIRO_MES + i);
            return {
              col: COL_PRIMEIRO_MES + i,
              f: i === 0
                ? letra + linhaFcl
                : col(COL_PRIMEIRO_MES + i - 1) + linhaSaldoAcumulado + "+" + letra + linhaFcl,
              s: MAPA_ESTILOS.secao[1]
            };
          }))
          .concat([{
            col: COL_ACUMULADO,
            f: col(COL_ACUMULADO - 1) + linhaSaldoAcumulado,
            s: MAPA_ESTILOS.secao[1]
          }])
      });

      var contasGarantia = dados.contas.filter(function (c) { return /garantia|cau/i.test(c); });
      var linhaCaucao = escreverLinha("grupo", "   (-) Caução em garantia do cartão", function (c) {
        return contasGarantia.length
          ? "-(" + contasGarantia.map(function (conta) { return saldoAcumuladoConta(conta, c); }).join("+") + ")"
          : "0";
      });
      var linhaCaixaLivre = escreverLinha("total", "(=) Caixa livre", function (c) {
        return c + linhaSaldoAcumulado + "+" + c + linhaCaucao;
      });

      /* Nestas duas o acumulado e a posicao do ultimo mes, nao a soma dos meses. */
      [linhaCaucao, linhaCaixaLivre].forEach(function (numeroLinha) {
        var linha = abaQuorum.linhas.filter(function (l) { return l.r === numeroLinha; })[0];
        linha.celulas[linha.celulas.length - 1].f = col(COL_ACUMULADO - 1) + numeroLinha;
      });

      linhaVazia();
      abaQuorum.linhas.push({
        r: linhaAtual++,
        celulas: [{
          col: 3,
          v: "Toda célula deste bloco é fórmula sobre a aba BD Contas. A caução sai porque está travada como garantia do cartão; a fatura de cartão já está deduzida no saldo acumulado.",
          s: 13
        }]
      });

      var nomeArquivo = "QUORUM_Realizado_"
        + (campoData === "dPag" ? "caixa" : "competencia") + ".xlsx";
      baixarXlsx([abaQuorum, abaBase], nomeArquivo);
    }

    /* ---------------------------------------------------------------- */
    /* Derivados da tela                                                */
    /* ---------------------------------------------------------------- */

    var erros = dados ? dados.achados.filter(function (a) { return a.nivel === "erro"; }) : [];
    var alertas = dados ? dados.achados.filter(function (a) { return a.nivel === "alerta"; }) : [];
    var ultimoMes = dados && dados.meses.length ? dados.meses[dados.meses.length - 1] : null;

    /* Posicao de caixa no ultimo mes, separando conta, cartao e caucao. */
    var posicao = useMemo(function () {
      if (!dados || !ultimoMes) return null;
      var corrente = 0, cartao = 0, garantia = 0;
      var nomes = { corrente: [], cartao: [], garantia: [] };

      dados.contas.forEach(function (conta) {
        var saldo = dados.saldoConta[conta][ultimoMes];
        if (/garantia|cau/i.test(conta)) { garantia += saldo; nomes.garantia.push(conta); }
        else if (/cart/i.test(conta)) { cartao += saldo; nomes.cartao.push(conta); }
        else { corrente += saldo; nomes.corrente.push(conta); }
      });

      return {
        corrente: corrente,
        cartao: cartao,
        garantia: garantia,
        livre: corrente + cartao,
        total: corrente + cartao + garantia,
        nomes: nomes
      };
    }, [dados, ultimoMes]);

    /* Sem chave, nem tenta buscar: mostra a tela de login direto. */
    if (!chave) {
      return h(TelaLogin, {
        erro: erroLogin,
        entrando: entrando,
        aoEntrar: function (valor) { setErroLogin(""); setChave(valor); }
      });
    }

    /* Primeira carga. */
    if (carregando && !dados) {
      return h("div", {
        className: "min-h-screen w-full flex items-center justify-center",
        style: { background: COR.bg, color: COR.faint, fontSize: 12 }
      }, "Atualizando Dashboard Financeiro QUORUM");
    }

    /* Falha na busca. */
    if (!dados) {
      return h("div", {
        className: "min-h-screen w-full flex items-center justify-center p-6",
        style: { background: COR.bg, color: COR.text }
      },
        h("div", { className: "max-w-xl w-full" },
          h("div", {
            className: "uppercase mb-2",
            style: { fontSize: 10, letterSpacing: "0.3em", color: COR.brass }
          }, "QUORUM"),
          h("h1", {
            className: "text-3xl mb-3",
            style: { fontWeight: 300, letterSpacing: "-0.01em" }
          }, "Dashboard Financeiro QUORUM"),
          h("p", {
            className: "text-sm leading-relaxed mb-6",
            style: { color: COR.dim }
          }, "Não consegui buscar a base agora."),
          aviso && h("div", {
            className: "mt-2 mb-4 text-sm p-3 rounded",
            style: { background: COR.coralSoft, color: COR.coral }
          }, aviso),
          h("button", {
            onClick: buscarBase,
            className: "w-full py-4 rounded text-sm",
            style: { background: COR.surface, border: "1px dashed " + COR.brass, color: COR.brass }
          }, "Tentar de novo")
        )
      );
    }

    /* todosMeses e a base inteira, sem filtro: usado pelo LTM (que        */
    /* precisa olhar pra tras alem do que esta selecionado na tela) e pelo */
    /* proprio painel de selecao (que precisa listar tudo que existe).     */
    var todosMeses = dados.meses;
    var meses = mesesSelecionados
      ? todosMeses.filter(function (mes) { return mesesSelecionados.indexOf(mes) >= 0; })
      : todosMeses;

    /* Uma linha "tem valor" se qualquer mes for diferente de zero. */
    function temValor(valores) {
      return meses.some(function (mes) { return Math.abs(valores[mes] || 0) > 0.005; });
    }

    /* Devolve o handler que abre a gaveta com um filtro pronto. */
    function abrirGaveta(titulo, filtro) {
      return function (mes) {
        setGaveta(Object.assign({}, filtro, { titulo: titulo, mes: mes, campo: campoData }));
      };
    }

    var LARGURA_PRIMEIRA_COLUNA = 34;
    var larguraColunaMes = (100 - LARGURA_PRIMEIRA_COLUNA) / (meses.length + 1);
    var larguraMinimaTabela = 380 + (meses.length + 1) * 100;

    /* Moldura padrao das tabelas mensais. */
    function Tabela(props) {
      return h("div", {
        className: "overflow-x-auto rounded",
        style: { border: "1px solid " + COR.line, background: COR.surface }
      },
        h("table", {
          style: {
            borderCollapse: "collapse",
            tableLayout: "fixed",
            width: "100%",
            minWidth: larguraMinimaTabela
          }
        },
          h("colgroup", null,
            h("col", { style: { width: LARGURA_PRIMEIRA_COLUNA + "%" } }),
            meses.map(function (mes) {
              return h("col", { key: mes, style: { width: larguraColunaMes + "%" } });
            }),
            h("col", { style: { width: larguraColunaMes + "%" } })
          ),
          h(CabecalhoMeses, { meses: meses }),
          h("tbody", null, props.children)
        )
      );
    }

    /* Secao do DRE: linha de total, e opcionalmente grupos e categorias. */
    function linhasDaSecao(secao) {
      var linhasRender = [h(LinhaTabela, {
        key: secao.key,
        label: secao.label,
        valores: dados.S[secao.key],
        meses: meses,
        nivel: "secao",
        aoAbrir: abrirGaveta(secao.label, { grupos: secao.groups })
      })];

      if (!mostrarDetalhe) return linhasRender;

      secao.groups.forEach(function (nomeGrupo) {
        var valoresGrupo = {};
        meses.forEach(function (mes) { valoresGrupo[mes] = dados.grupoMes(nomeGrupo, mes); });
        if (!mostrarZeradas && !temValor(valoresGrupo)) return;

        linhasRender.push(h(LinhaTabela, {
          key: secao.key + nomeGrupo,
          label: nomeGrupo,
          valores: valoresGrupo,
          meses: meses,
          nivel: "grupo",
          aoAbrir: abrirGaveta(nomeGrupo, { grupo: nomeGrupo })
        }));

        var bloco = PLANO_DE_CONTAS.filter(function (b) { return b.grupo === nomeGrupo; })[0];
        if (!bloco) return;

        bloco.itens.forEach(function (item) {
          var categoria = item[0];
          var ativa = item[1];
          var valoresItem = {};
          meses.forEach(function (mes) { valoresItem[mes] = dados.bruto(nomeGrupo, categoria, mes); });
          if (!mostrarZeradas && !temValor(valoresItem)) return;

          linhasRender.push(h(LinhaTabela, {
            key: secao.key + nomeGrupo + categoria,
            label: categoria,
            valores: valoresItem,
            meses: meses,
            nivel: "item",
            aoAbrir: temValor(valoresItem)
              ? abrirGaveta(categoria, { grupo: nomeGrupo, categoria: categoria })
              : undefined,
            sufixo: ativa ? null : h("span", {
              style: { fontSize: 10, color: COR.faint }
            }, "  inativa")
          }));
        });
      });

      return linhasRender;
    }

    /* Percentual de uma linha sobre a receita liquida do mesmo mes. */
    function sobreReceitaLiquida(valores) {
      var percentuais = {};
      meses.forEach(function (mes) {
        percentuais[mes] = dados.receitaLiquida[mes] ? valores[mes] / dados.receitaLiquida[mes] : 0;
      });
      return percentuais;
    }

    /* Estilo dos botoes de alternancia da barra superior. */
    function estiloBotao(ativo) {
      return {
        border: "1px solid " + (ativo ? COR.brass : COR.line),
        background: ativo ? COR.brassSoft : COR.surface,
        color: ativo ? COR.brass : COR.dim,
        fontSize: 11
      };
    }

    /* ---------------------------------------------------------------- */
    /* Barra superior                                                   */
    /* ---------------------------------------------------------------- */

    var barraSuperior = h("div", {
      className: "sticky top-0 z-10 px-6 py-3 flex flex-wrap items-center gap-3",
      style: { background: COR.surface, borderBottom: "1px solid " + COR.line }
    },
      h("div", null,
        h("div", {
          className: "uppercase",
          style: { fontSize: 9, letterSpacing: "0.3em", color: COR.brass }
        }, "QUORUM"),
        h("div", { className: "text-sm", style: { fontWeight: 600 } }, "Dashboard Financeiro QUORUM")
      ),

      h("div", { className: "ml-2", style: { fontSize: 11, color: COR.faint } },
        dados.usadas.length,
        " lançamentos realizados · ",
        meses.length ? rotuloMes(meses[0]) + " a " + rotuloMes(ultimoMes) : "sem período",
        resposta && resposta.em_aberto > 0 && h("span", { style: { color: COR.brass } },
          " · " + resposta.em_aberto + " compromisso(s) futuro(s) não incluído(s)"),
        atualizadoEm && h("span", { style: { color: COR.mint } },
          " · atualizado às ",
          atualizadoEm.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }))
      ),

      h("div", { className: "flex-1" }),

      /* Regime de caixa ou de competencia. */
      h("div", { className: "flex rounded overflow-hidden", style: { border: "1px solid " + COR.line } },
        [["caixa", "Caixa"], ["competencia", "Competência"]].map(function (par) {
          var valor = par[0], rotulo = par[1];
          return h("button", {
            key: valor,
            onClick: function () { setRegime(valor); },
            className: "px-3 py-1.5",
            title: valor === "caixa"
              ? "Usa a data de pagamento ou recebimento: mostra quando o dinheiro entrou e saiu"
              : "Usa a data de emissão: mostra o mês em que a receita ou a despesa foi gerada",
            style: {
              fontSize: 11,
              background: regime === valor ? COR.brass : "transparent",
              color: regime === valor ? "#FFFFFF" : COR.dim,
              fontWeight: regime === valor ? 600 : 400
            }
          }, rotulo);
        })
      ),

      /* Filtro livre de meses: qual mes aparece em toda a tela (tabelas e   */
      /* apresentacao), independente do que a base tem no total.             */
      h("div", { style: { position: "relative" } },
        h("button", {
          onClick: function () { setFiltroMesesAberto(!filtroMesesAberto); },
          className: "px-3 py-1.5 rounded",
          style: estiloBotao(mesesSelecionados !== null),
          title: "Escolhe quais meses aparecem em todo o painel, tabelas e apresentação"
        }, mesesSelecionados === null
             ? "Todos os meses"
             : "Meses: " + mesesSelecionados.length + " de " + todosMeses.length),

        filtroMesesAberto && h(React.Fragment, null,
          h("div", {
            onClick: function () { setFiltroMesesAberto(false); },
            style: { position: "fixed", inset: 0, zIndex: 40 }
          }),
          h("div", {
            className: "absolute mt-1 rounded p-3",
            style: {
              zIndex: 41, background: COR.surface, border: "1px solid " + COR.line,
              minWidth: 190, boxShadow: "0 4px 16px rgba(0,0,0,0.12)"
            }
          },
            h("div", { className: "flex justify-between gap-3 mb-2 pb-2", style: { fontSize: 11, borderBottom: "1px solid " + COR.lineSoft } },
              h("button", { onClick: function () { setMesesSelecionados(null); }, style: { color: COR.brass, fontWeight: 600 } }, "Todos"),
              h("button", { onClick: function () { setMesesSelecionados([]); }, style: { color: COR.faint } }, "Limpar")
            ),
            h("div", { className: "space-y-1", style: { maxHeight: 260, overflowY: "auto" } },
              todosMeses.map(function (mes) {
                var marcado = mesesSelecionados === null || mesesSelecionados.indexOf(mes) >= 0;
                return h("label", {
                  key: mes,
                  className: "flex items-center gap-2 cursor-pointer px-1 py-0.5 rounded",
                  style: { fontSize: 12, color: COR.dim }
                },
                  h("input", {
                    type: "checkbox",
                    checked: marcado,
                    onChange: function () {
                      var baseAtual = mesesSelecionados === null ? todosMeses.slice() : mesesSelecionados.slice();
                      var indice = baseAtual.indexOf(mes);
                      if (indice >= 0) baseAtual.splice(indice, 1); else baseAtual.push(mes);
                      setMesesSelecionados(baseAtual.length === todosMeses.length ? null : baseAtual);
                    }
                  }),
                  rotuloMes(mes)
                );
              })
            )
          )
        )
      ),

      /* Esconder ou mostrar categorias sem movimento. */
      h("div", { className: "flex rounded overflow-hidden", style: { border: "1px solid " + COR.line } },
        [[false, "Só com valor"], [true, "Todas as linhas"]].map(function (par) {
          var valor = par[0], rotulo = par[1];
          return h("button", {
            key: String(valor),
            onClick: function () { setMostrarZeradas(valor); },
            className: "px-3 py-1.5",
            title: valor
              ? "Mostra todas as categorias do plano de contas, inclusive as que não tiveram movimento"
              : "Esconde as categorias sem nenhum lançamento no período",
            style: {
              fontSize: 11,
              background: mostrarZeradas === valor ? COR.brass : "transparent",
              color: mostrarZeradas === valor ? "#FFFFFF" : COR.dim,
              fontWeight: mostrarZeradas === valor ? 600 : 400
            }
          }, rotulo);
        })
      ),

      h("button", {
        onClick: function () { setMostrarDetalhe(!mostrarDetalhe); },
        className: "px-3 py-1.5 rounded",
        style: estiloBotao(!mostrarDetalhe),
        title: mostrarDetalhe
          ? "Hoje mostrando grupo e categoria. Clique para ver só os totais de cada seção"
          : "Hoje mostrando só os totais. Clique para abrir grupo e categoria"
      }, mostrarDetalhe ? "Visão sintética" : "Visão analítica"),

      h("button", {
        onClick: function () { exportarXlsx(); },

        caixaLivre[mes] = saldoAcumulado[mes] + caucaoNegativa[mes];
      });

      var temCaucao = meses.some(function (mes) { return Math.abs(caucaoNegativa[mes]) > 0.005; });

    /* ---------------------------------------------------------------- */

    function abaDimensao() {
      var agrupado = aba === "proj" ? dados.porProjeto : dados.porCentro;
      var dimensao = aba === "proj" ? "projeto" : "centro";

      var abrirDimensao = function (valorDimensao, titulo) {
        return function (mes) {
          var filtro = { titulo: titulo, mes: mes, campo: campoData, somenteResultado: true, gruposResultado: GRUPOS_DE_RESULTADO };
          filtro[dimensao] = valorDimensao;
          setGaveta(filtro);
        };
      };

      var somarTudo = function (qual) {
        var totais = {};
        meses.forEach(function (mes) {
          totais[mes] = agrupado.lista.reduce(function (soma, item) {
            return soma + agrupado[qual][item][mes];
          }, 0);
        });
        return totais;
      };

      if (!agrupado.lista.length) {
        return h("div", {
          className: "rounded p-4",
          style: { background: COR.surface, border: "1px solid " + COR.line, fontSize: 12, color: COR.dim }
        }, "Nenhum lançamento de resultado no período.");
      }

      /* Margem acumulada de um item: soma do resultado do periodo dividida */
      /* pela soma da receita do periodo, nao a media dos percentuais       */
      /* mensais.                                                          */
      function margemAcumulada(recPorMes, resPorMes) {
        var recAcum = meses.reduce(function (s, mes) { return s + (recPorMes[mes] || 0); }, 0);
        var resAcum = meses.reduce(function (s, mes) { return s + (resPorMes[mes] || 0); }, 0);
        return recAcum ? resAcum / recAcum : 0;
      }

      /* "Geral" soma todos os itens da dimensao, do mesmo jeito que a linha */
      /* final "(=) Resultado somado" ja faz, so que aberta em Receita,      */
      /* Custos e despesas e % margem, igual a qualquer outro item, e        */
      /* mostrada primeiro por ser a visao mais ampla. Clicar nela abre      */
      /* todos os lancamentos de resultado do periodo, sem filtro de         */
      /* projeto/centro: o mecanismo da gaveta ja ignora uma dimensao que    */
      /* nao foi informada, entao basta nao passar valorDimensao nenhum.     */
      var recGeral = somarTudo("rec");
      var saiGeral = somarTudo("sai");
      var resGeral = somarTudo("res");
      var margemGeral = {};
      meses.forEach(function (mes) {
        margemGeral[mes] = recGeral[mes] ? resGeral[mes] / recGeral[mes] : 0;
      });
      var abrirGeral = function (titulo) {
        return function (mes) {
          setGaveta({ titulo: titulo, mes: mes, campo: campoData, somenteResultado: true, gruposResultado: GRUPOS_DE_RESULTADO });
        };
      };

      return h("div", { className: "space-y-4" },
        h(Tabela, null,
          h(React.Fragment, { key: "dim-geral" },
            h(LinhaTabela, {
              label: "Geral", valores: resGeral, meses: meses, nivel: "secao",
              aoAbrir: abrirGeral("Geral")
            }),
            h(LinhaTabela, {
              label: "Receita", valores: recGeral, meses: meses, nivel: "grupo",
              aoAbrir: abrirGeral("Geral - receita")
            }),
            h(LinhaTabela, {
              label: "Custos e despesas", valores: saiGeral, meses: meses, nivel: "grupo",
              aoAbrir: abrirGeral("Geral - custos e despesas")
            }),
            h(LinhaTabela, {
              label: "% margem", valores: margemGeral, meses: meses, nivel: "pct", formato: "pct",
              acumulado: margemAcumulada(recGeral, resGeral)
            })
          ),
          agrupado.lista.map(function (item) {
            var margem = {};
            meses.forEach(function (mes) {
              margem[mes] = agrupado.rec[item][mes] ? agrupado.res[item][mes] / agrupado.rec[item][mes] : 0;
            });
            return h(React.Fragment, { key: "dim" + item },
              h(LinhaTabela, {
                label: item, valores: agrupado.res[item], meses: meses, nivel: "secao",
                aoAbrir: abrirDimensao(item, item)
              }),
              h(LinhaTabela, {
                label: "Receita", valores: agrupado.rec[item], meses: meses, nivel: "grupo",
                aoAbrir: abrirDimensao(item, item + " - receita")
              }),
              h(LinhaTabela, {
                label: "Custos e despesas", valores: agrupado.sai[item], meses: meses, nivel: "grupo",
                aoAbrir: abrirDimensao(item, item + " - custos e despesas")
              }),
              h(LinhaTabela, {
                label: "% margem", valores: margem, meses: meses, nivel: "pct", formato: "pct",
                acumulado: margemAcumulada(agrupado.rec[item], agrupado.res[item])
              })
            );
          }),
          h(LinhaTabela, {
            label: "(=) Resultado somado", valores: somarTudo("res"), meses: meses, nivel: "total"
          })
        )
      );
    }

        !meses.length
          ? h("div", {
              className: "flex items-center justify-center text-center py-16",
              style: { fontSize: 12, color: COR.faint }
            }, "Nenhum mês selecionado. Abra \"Meses\" no topo e marque pelo menos um.")
          : h(React.Fragment, null,
              aba === "dre" && abaDRE(),
              aba === "caixa" && abaFluxoDeCaixa(),
              (aba === "proj" || aba === "cc") && abaDimensao(),
              aba === "achados" && abaAchados(),
              aba === "abertos" && abaCompromissos(),
              aba === "apres" && abaApresentacao()
            )
      )
    );
  }

  /* ------------------------------------------------------------------ */
  /* 12. MONTAGEM                                                        */
  /* ------------------------------------------------------------------ */

  window.__PainelRealizado = Painel;
})();
</script>
<script>
(function () {
  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(window.__PainelRealizado));
})();
</script>
</body>
</html>
